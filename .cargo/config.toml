[build]
rustc-wrapper = "scripts/lib/cargo-rustc-wrapper.sh"
incremental = false
# Intermediates live outside the checkout; target/ keeps only final binaries.
# CARGO_BUILD_BUILD_DIR (set by fno to <paths.cargo_targets_base>/{workspace-path-hash})
# overrides this value.
build-dir = "{cargo-cache-home}/build/{workspace-path-hash}"

# Every test binary and doctest on a macOS host asks for a cargo run slot
# before it runs, so a fresh-build cargo test counts against the same cap as
# a compile. Keyed by target triple, not cfg(all()): a triple runner takes
# precedence over any cfg runner, so a user's own cfg runner still fires on
# every other repo, and two cfg runners is what makes cargo refuse to start.
# Cargo resolves a config path with a slash from the checkout root.
[target.aarch64-apple-darwin]
runner = ["scripts/lib/cargo-rustc-wrapper.sh", "--run"]

[target.x86_64-apple-darwin]
runner = ["scripts/lib/cargo-rustc-wrapper.sh", "--run"]
