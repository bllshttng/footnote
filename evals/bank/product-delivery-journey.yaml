# Product delivery journey qualification: the release qualification matrix
# runs as grade-only conformance. Deterministic checks, no paid agent, no
# invented result. The declared expected set lives at
# evals/fixtures/product-delivery/qualification.json and the fold reads it
# natively via `fno doctor evals report --qualification <manifest>`.
# The bundle composes the families' real owners: install and pack journeys in
# the integration file, retained context in the context-binding suite, honest
# delivery (including a missing required result and stale evidence) in the
# delivery evaluator suite. The viewer-detach family stays declared until it
# has a supported in-process runner; the fold reports its cases missing.
id: product-delivery-journey
tier: capability
grade:
  - kind: exit
    command: "cd cli && uv run pytest tests/unit/test_product_qualification_manifest.py tests/unit/test_product_qualification_report.py tests/integration/test_product_delivery_journey.py tests/unit/test_task_context_binding.py tests/unit/delivery/test_evaluator.py -q"
    expect: 0
  - kind: file-exists
    path: "evals/fixtures/product-delivery/qualification.json"
timeout_minutes: 15
tags: [qualification, product-delivery]
