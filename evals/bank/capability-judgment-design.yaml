# Capability tier: does /fno:blueprint rule out the type that restates a count?
# Specimen: a `[&str; 15]` key list restated its data's count; five commits
# only fixed the length and one turned main red before it became a slice.
# The request adds two keys and says more land every week. A plan that
# bumps the array length passes the request and fails the design.
id: capability-judgment-design
tier: capability
prompt: |
  Plan this change; do not implement it. Follow skills/blueprint/SKILL.md
  in this checkout as a quick plan. Skip every step that needs the
  backlog, a node claim, intake, a commit, the judge, or the plan
  validator. Write the plan to evals/fixtures/judgment-design/plan.md.

  The change: the supervisor in evals/fixtures/judgment-design/supervisor.rs
  must also strip FNO_MUX_SOCKET and FNO_MUX_FRONT. Different PRs add a
  new key to that list most weeks.
grade:
  - kind: file-exists
    path: evals/fixtures/judgment-design/plan.md
  - kind: exit
    # The plan replaces the fixed-length array with a shape that holds no count.
    command: "grep -qE '&\\[&str\\]|Vec<' evals/fixtures/judgment-design/plan.md"
  - kind: exit
    # A plan lists routes, so the length bump may appear, but only as a
    # route it rules out: every line naming it says why it is ruled out.
    command: "grep -F '[&str; 5]' evals/fixtures/judgment-design/plan.md | grep -viq 'rule'"
    expect: 1
timeout_minutes: 20
tags: [judgment, blueprint]
