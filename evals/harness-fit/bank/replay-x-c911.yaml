id: replay-x-c911
tier: capability
repo_fixture: 3c8b4b0da38a016735ca1c7f55fe6a89748e49f2
prompt: |
  the installer symlinks three gh shims into a mktemp staging dir, so every gh read in the fleet breaks when it is cleaned

  MEASURED 2026-09-12 18:52Z. Fixed in place, filed so the next install does not repeat it.

  THE SYMPTOM. fno do pr list returned an error object rather than PRs: exec: fno-gh-proxy: not found. fno do pr status still answered, but degraded, with cached true, cached_age_seconds 1189, verdict unknown, and its own stale_reason saying the check set is unreadable so this is the last cached row degraded to unknown and not a verdict. That honest degradation is the only reason the outage did not read as a wall of red PRs.

  THE CAUSE. Three shims in ~/.local/bin were symlinks into a mktemp staging directory: fno-gh-proxy, fno-gh-coverage and fno-gh-loopcheck all pointed at /var/folders/.../T/tmp.<random>/tools/fno/bin/. That directory was gone, so all three dangled. Every other fno entry point runs from /Users/bb16/.local/share/uv/tools/fno/bin, and durable copies of all three binaries exist there. So the installer staged into temp and linked rather than copying, and only these three shims were affected.

  THE BLAST RADIUS. The proxy is the sanctioned lane for gh, since direct gh api graphql, gh pr list and gh pr checks are refused. So while it dangles, every merge-readiness read, CI check and review-coverage read in the fleet falls back to cache or fails. A lead reading mergeable_pr during that window gets stale rows with no fresh verdict.

  WHAT I DID. Repointed all three symlinks to the uv tools directory and confirmed fno do pr list returned real PRs again. The repair is three ln -sfn calls and is reversible.

  THE FIX. Copy the binaries to a durable location during install, or link to the uv tools path directly, and never leave a symlink target inside a mktemp directory. A post-install check that resolves every shim in ~/.local/bin and fails on a dangling one would catch the whole class.

  VERIFY. After an install, assert that no symlink under ~/.local/bin resolves into /var/folders or any temp path, and that fno-gh-proxy is executable.
