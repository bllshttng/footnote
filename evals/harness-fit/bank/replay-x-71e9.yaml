  Onboard DeepSeek Harness (dsh) over the shared ACP stdio core

  DeepSeek ships its own agent harness and footnote has never onboarded it. Operator asked directly 2026-09-08. It was named in x-009c's title, that node closed done, and deepseek was never onboarded.

  WHY THE EARLIER CLOSE DOES NOT COVER THIS. x-009c recorded that `pi --list-models` returns 114 rows all on amazon-bedrock, and that the deepseek name there is a Bedrock model id (deepseek.v3.2), not a provider family. That is true and it answers a different question. Whether DeepSeek publishes its own harness was never asked. Do not re-derive the Bedrock finding; it is settled and irrelevant here.

  THE HARNESS, sourced.

    repo        deepseek-ai/deepseek-harness, MIT, 216k stars
    cli         `dsh`, package @deepseek-ai/dsh, bin lib/bin.js
    local       ~/code/tools/deepseek-harness, master, 0.1.5-alpha.1
    arch        everything-is-a-plugin over Cordis
    status      developer preview, README warns of compatibility-breaking changes

  PROFILES, from packages/boot/app-boot/src/profile.ts:110, authoritative:

    acp          dsh-base + dsh-acp-app        automation-only JSON-RPC stdio
    web          dsh-base + dsh-web-app        patchReload live
    headless     dsh-base + dsh-headless
    sdk          dsh-base + dsh-sdk-app
    sdk-minimal  dsh-sdk-minimal

  There is NO tui profile. The `--profile tui` in apps/cli/src/args.ts is an illustrative docstring example. Do not build against it.

  THE LANE ALREADY EXISTS. packages/bundle/acp-app/package.json describes the acp profile as "automation-only JSON-RPC stdio and process lifecycle over dsh-base". Footnote already drives that transport twice: fno/agents/harnesses/_acp.py holds AcpStdioSession, the shared protocol loop, and grok.py (150 lines) and kimi.py (231 lines) subclass it. So this is a subclass plus a capability row, NOT a protocol implementation. Write no new JSON-RPC.

  WHAT EACH SUBCLASS ACTUALLY CARRIES, so scope is honest: an argv builder, auth-error detection with a typed *AuthenticationRequired, a request-timeout override, and the session verbs the vendor supports. That last is the real variance. Grok defines session_new only. Kimi defines new, resume, close, delete and fork. The size of this task is decided by which verbs dsh implements.

  FIRST TASK, before any estimate. Read packages/acp in the checkout and report which ACP session verbs dsh's acp-app actually implements, and how a session id is minted: caller-assigned like grok, or vendor-minted like kimi. Report that as a finding on this node BEFORE writing code. Kimi's six verbs against grok's one is roughly an 80-line swing and it decides the capability row.

  THEN. Add the subclass beside grok.py and kimi.py, add the harness_capabilities.toml row, and note that the toml exists in three places (cli/src/fno/agents/, crates/fno/src/, crates/fno-agents/src/). Establish whether those are generated copies with a sync gate before hand-editing three files; if they are not, say so rather than editing all three.

  VERIFY with a real process, never a mock: boot `dsh --profile acp` over stdio, complete initialize, open a session, and assert on a marker only a live dsh produces. A passing test against a stub proves the stub. Authentication is the operator's: if dsh needs a login or an API key, STOP and ask rather than synthesizing credentials.
