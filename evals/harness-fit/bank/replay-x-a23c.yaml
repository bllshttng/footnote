  Agents load their skills from the body, so a spawned main thread gets them

  Measured 2026-09-15 on claude 2.1.272 with a throwaway plugin. An Agent tool subagent preloads its skills: list, including an installed skill from another plugin. The same agent launched with claude --agent (which is what fno agents spawn --agent runs) gets its body but no skill from the list: a canary skill's secret word was absent while the body word was present. An unresolved skills entry is also dropped silently on the subagent path (0 warning lines across 4 transcripts that held the canary). agents/archer.md:8, agents/scout.md:8 and agents/frontend-executor.md:8 carry skills lists, so archer spawned with --agent fno:archer runs without tdd preloaded and nothing says so. Fix path: either state the Skill call in each agent body so the main thread loads it, or have spawn refuse or warn when --agent names an agent whose skills list will not load. Evidence and probe method: plan 20260914-architect-blueprint-agent-x-2b2f.md, section Measured 2026-09-15. x-2b2f avoids the gap for architect by shipping no skills list.
