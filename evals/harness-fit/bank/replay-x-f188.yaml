prompt: |
  A restart that reaches every long-lived process it can, says what it cannot, and never reports a stop it did not perform

  OPERATOR ASK 2026-09-10, verbatim: 'so do we need to make sure restart or update keeps the keepers and any other daemons up to date? All of these shuld be a part of the menu button too which should be explicit that we will restart but they are supposed to keep their active panes'

  MEASURED THE SAME MINUTE by af8e03f2. Installed worker binary rebuilt 2026-09-10T08:40:05. Every long-lived process older than that runs a stale code image:

    22536 store keeper graph.json      started Sep 9 04:11, 30 hours
    91090 store keeper graph-archive   started Sep 10 07:14
    12275 mux server   main.sock       started Sep 10 01:50
     5621 pane keeper  main-1925       started Sep 8 22:17
    89067 pane keeper  main-1922       started Sep 8 16:02
    52494 pane keeper  main-1954       started Sep 9 12:11
    22286 pane keeper  main-1991       started Sep 9 18:23

  ONLY THE DAEMON HAS A REFRESH PATH. fno agents restart restarts the daemon and conditionally the mux server. It never touches a store keeper or a pane keeper. cli/src/fno/agents/ mentions --store-keeper exactly once, at keeper_lane.py:46, as a lane-classification map.

  THE REAPER IS A CORPSE COLLECTOR, NOT AN UPDATER. keeper_verdict in cli/src/fno/agents/keeper_lane.py:164 returns REAP only when the socket proves the listener dead. A live listener returns LEAVE unconditionally, and silence returns LEAVE because 'silence never proves death'. A healthy but stale keeper is therefore spared forever, by design, and no other code path cycles it.

  WHAT THIS COST, MEASURED. 29 commits landed on crates/fno-agents/src/graph_keeper.rs, graph_store.rs and crates/fno/src/store_client.rs after keeper 22536 started, out of 543 commits to main in that window. All 29 are inert in the running process. They include PR 1676 (reads share the keeper gate, writes exclude) and the entire SQLite rollout: shadow rows into SQLite, cut reads over by config, make JSON a debounced export.

  THE TRAP THAT FOLLOWS. config read_source defaults to json and commit_mode is rows. Flipping read_source to sqlite while the keeper runs pre-SQLite code points the config at a code path the serving process does not contain. The rollout is gated on the one component with no refresh mechanism.

  THE TRIGGER MUST BE BUILD IDENTITY, NOT PROTOCOL VERSION. graph_keeper.rs:42 defines PROTOCOL_VERSION and emits it on Identify at :432, and NOTHING reads it: store_client.rs mentions version seven times and every one is base_version, the content digest for conflict detection. Compare pane keeper, whose version IS enforced at crates/fno/src/pty.rs:1064 with a real refusal. But the constant is documented 'bump on any frame-shape change', and PR 1676 changed locking behaviour, not frame shape, so a version compare would have caught none of this. Use the build-identity test the daemon already performs and already reports: 'the running daemon is an older build than the installed binary'.

  THE MECHANISM EXISTS. graph_keeper.rs defines a Shutdown frame (:176, :700) that ends the process from inside with exit(0), so no signal is needed. A killed store keeper is cheap and self-healing: it owns a file on disk plus a warm cache, and the next caller respawns it from crates/fno/src/store_client.rs:112. Measured cost of a cold reparse of all 2419 entries: 0.041s.

  SECOND DEFECT FOUND WHILE MEASURING: A RESPAWN STORM. Four store keepers are live on the SAME graph.json.store.sock. Beyond the 30-hour-old 22536, three more started at 10:15:27, 10:15:29 and 10:15:34, a seven-second window, and all three are still running. Concurrent callers each spawned one and the losers never exited. Four processes each hold a parsed 15MB graph. Whatever lands here must make a loser exit.

  THE ASYMMETRY THAT SHAPES THE FIX, and it limits what the menu can promise. A store keeper holds recoverable state: a file plus a cache. Cycling it is invisible and safe. A PANE keeper holds a live child process and its pty master; killing it destroys running work, and surviving a restart is its entire purpose. So a pane keeper cannot be refreshed on demand at all. It goes current only when its pane ends. 'Restart everything' and 'keep your active panes' are in direct conflict, and the pane keeper is exactly where.

  WHAT TO BUILD.
  1. Plain fno agents restart cycles every store keeper whose build differs from the installed binary, via the Shutdown frame, and mirrors the existing mux safety rule: spare and report one with a mutation in flight rather than interrupting it. Not behind --mux, because that flag is gated for ending user-visible shells and a store cycle ends nothing a human can see. Not behind a new opt-in flag either: a flag you must know to pass is the bug we already have, which is 'merged, not live, nobody knew'.
  2. Make a losing respawn exit, so one socket has one keeper.
  3. The update menu states, per component, what will restart and what survives. It must say plainly that keeper-hosted panes are preserved AND that their keepers stay on old code until those panes end. Do not print one promise and mean the other.
  4. Report staleness per component, not just for the daemon. Today only the daemon says 'older build than the installed binary'; keepers and the mux server say nothing.

  RELATED: x-f1f4 is the same operator complaint at the modal (an update surface that reports state and offers no action). x-4f44 shipped this exact staleness fix for the DAEMON and left every keeper uncovered. x-ebd6 is a wedged keeper hanging mux startup, the adjacent lifecycle gap.
