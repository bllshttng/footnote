  A portal is a TV, never a pane: only operator portals exist and survive a restart, and threads tune into them like channels

  USER RULING 2026-09-26 near 17:45Z, law d-ef71b97a: "No pane is EVER a portal. A portal is a window into any pane. Any pane can get assigned into a portal. It's like a TV and the threads are different channels we are flipping through." Also: "We ONLY want the N portals to return (that we created)."

  SYMPTOM (screenshot 17:40Z): after the mux restart the tab bar shows 13 tabs (portal5, portal1, portal3, portal4, portal2, candor, portal6, portal7, folio, portal9, portal10, t-x-1867-glm and more). The user had 2 or 3 portals open.

  MEASURED (fno mux pane ls --json, server pid 43964): 15 panes. Only 4 carry a portal index (0, 3, 8, 11), and indices reached 11 today. 9 panes are named portalN with portal=null. Each is a bare idle /bin/zsh with no child: the seat shell left when a viewer died. candor is the same kind of stand-in.

  WHY: the code models a portal AS a pane. The seat pane runs the viewer process, so the portal's life is the pane's life. Three documented rules then multiply tabs:
  1. A bare fno agents spawn inside a mux opens a portal (docs/architecture/portals.md:28), so every king spawn from a mux pane mints a portal and a tab.
  2. A dead viewer's seat is kept as a stand-in shell in its tab (portals.md:60, x-3349).
  3. Restore brings back every kept pane and portal slot (portals.md:50, x-a9b4, x-a6b9), and keepers re-adopt every pane.

  TARGET (the TV model):
  (a) A portal is its own object: an index, a placement (which tab and which split in it) and its current channel. It is never a pane and never a tab. A tab is a layout that holds one or more portals in splits. The viewer process is only what the TV plays now.
  (b) Tuning swaps the viewer inside the portal. The portal keeps its index and placement. Any thread tunes into any portal.
  (c) Only an operator gesture creates, places, splits or closes a portal. A spawn, a reach, a restart, a finished worker or a dead viewer never creates, closes or multiplies one. A spawn is a paneless thread.
  (d) A portal whose channel ends shows "no signal" (the thread ended, with its name) and stays. The stand-in shell pane goes away.
  (e) A restart restores exactly the operator's tabs, splits and portals, placed as before. Each is held on its last channel until the operator tunes it, so nothing starts a process unasked.
  (f) Reaching a row tunes an existing portal (the focused one, or one named with --portal N) and never mints a tab, a split or a portal. With no portal open, it asks or opens one on operator request only.
  (g) Migration: a one-time prune closes stand-in seat shells (bare shell, no child, portal=null, named portalN or a row name). It never touches a pane with a child process.
  Rewrite docs/architecture/portals.md around this model and retire the rules it replaces.

  VERIFY: spawn 3 workers from a king pane and no tab appears. Open 2 portals by hand as a split in one tab, restart the mux, and the same tab returns with the same 2 portals in the same split. Tune portal 1 across 3 threads and the tab count never changes. A thread that exits leaves its portal on "no signal" and adds no shell pane.

  DONE MEANS THE LAW IS GONE (user, 2026-09-26): law d-0f0a99e7 (portal-is-a-viewport, which supersedes d-e7bca290 and d-ef71b97a) states this model as guidance, with graduation should-be-enforced-but-i-did-not node:x-32de. After this node's PR merges, retract the live law under subject portal-is-a-viewport (today d-0f0a99e7; once x-9ca3 ships, fno backlog decide-retract portal-is-a-viewport) with --reason "graduated: x-32de enforces the portal model". The machinery must then hold every case alone. Any case that breaks after the retraction is a gap in this node, not a reason to restore the law.

  WHERE THE MODEL DRIFTED: docs/architecture/portals.md:3 says "A portal is the dedicated pane a thread is shown through", and :5 says "A portal is what one is" (a pane). Lines 9 to 12 quote the user's 2026-09-02 naming ("call viewports: portal") and then argue a portal is not a passive viewport. The doc moved there in 90d54822ae (2026-09-02). Every later rule (seat panes, kept stand-in shells, close portal = pane kill) builds on that line. The rewrite starts by replacing lines 3 to 12 with the user's words.
