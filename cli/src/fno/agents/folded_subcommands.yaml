# Agent subcommands folded under `fno agents` as lazy subcommands.
# Each entry: import_path, short_help, typer options. Loaded by
# rust_runtime.FOLDED_AGENT_SUBCOMMANDS.
autonomy:
  - fno.autonomy_cli:autonomy_app
  - Inspect every path that can start a session without an operator asking.
  - hidden: true
claim:
  - fno.claims.cli:cli
  - Work-claim coordination primitive
  - hidden: true
lead:
  - fno.lead.cli:agents_lead_app
  - The lead session manifest and escalation controls.
  - hidden: true
# The canonical spelling the Rust front and every hint teach: the same app
# under both names until the lead mount takes its one-release exit.
org:
  - fno.lead.cli:agents_lead_app
  - The org chart of roles and their lifecycle.
  - hidden: true
mail:
  - fno.mail.cli:mail_app
  - "Durable polled mailbox: send/unread/ack/reply/drain/status (canonical spelling; root `fno mail` is the shim)."
  - hidden: true
mcp:
  - fno.mcp.cli:mcp_app
  - MCP sidecar client verbs.
  - hidden: true
restart:
  - fno.restart:restart_command
  - Restart running fno processes onto fresh binaries.
  - hidden: true
roles:
  - fno.roles.cli:roles_app
  - Inspect bounded business-role definitions and resolutions.
  - hidden: true
# (d-cf2d6fe1): worktree lifecycle folds under agents, which also
# resolves the Python/Rust `workspace` collision - root `workspace` then
# unambiguously means the mux one. Old spellings stay one-release shims.
workspace:
  - fno.workspace.cli:cli
  - Worktree lifecycle and worker registration.
  - hidden: true
worker:
  - fno.worker.cli:cli
  - Manage delivery worker phases.
  - hidden: true
