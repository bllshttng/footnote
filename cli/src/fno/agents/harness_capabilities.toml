loop_extension = ""
command_surface = "slash"
slash_prefix = ""
ready_marker = "idle_plan_build"
ready_rule_ids = ["idle_plan_build"]
manifest_rules = [{ id = "idle_plan_build", state = "idle" }]
# Three 6KB-class / 43-line pastes followed immediately by Enter all returned
