# The keeper-lane spawn arm (docs/architecture/thread-lanes.md). The lane
# driver appends pi's own provider/model pair, so every option that would ride
# another lane's argv is refused by name and `carries` is empty.
[harness.pi.keeper]
once_refusal = "--once is not supported on the pi thread lane (it is persistent); pi has no one-shot lane - its headless stance is unmeasured"
carries = []
ready_marker = "(sub)"
resume_refusal = "is not supported on the pi thread lane yet; the keeper row resumes by name (fno agents ask/resume <name>). Refusing rather than silently spawning a fresh session."

[harness.cursor-agent]
permission_bypass = ["--force"]
resume = "native-session"
# TRUE, and the live journey is the evidence
