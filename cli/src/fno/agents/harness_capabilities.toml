# CANONICAL. Two gated copies hang off this file: cli/src/fno/agents/harness_capabilities.toml
# (generated by crates/fno-agents/build.rs) and crates/fno/src/harness_capabilities.toml
# (hand-synced; the fno crate embeds it with include_str!). Edit this file, then
# resync BOTH copies, not just the first:
#   bash scripts/ci/check-harness-capabilities-fresh.sh --write
# scripts/ci/check-harness-capabilities-fresh.sh fails CI when any copy differs.
map_version = 15

[harness.claude]
permission_bypass = ["--dangerously-skip-permissions"]
resume = "native-session"
thread = true
autonomous_pane = false
route_on_pane = true
# LOOP PARTICIPATION. Can the fno target loop CLOSE on this harness?
#
# hooks/target-stop-hook.sh shims `fno-agents loop-check`, which decides stop or
# allow from external truth. No lifecycle boundary means no loop-check
# invocation, which means no loop, however well the harness spawns, resumes and
# receives mail. Three members:
#
#   "native"     a shell hook fires at the lifecycle boundary and can invoke
#                loop-check today
#   "extension"  the harness exposes no shell hook. The loop is reachable only
#                through a harness-native plugin fno ships, named by
#                `loop_extension`. An EMPTY `loop_extension` means fno ships
#                none yet, so a looping dispatch is refused rather than left to
#                hang with nothing to stop it
#   "none"       no boundary is exposed at all; a looping dispatch is refused
#
# This field REPLACES `stop_hook`, which read "native" on every row that ever
# carried it and had zero behavioral consumers. One value across every row is
# not a measurement. It is one declaration inherited five times, the shape
# already proved on send_keys_enter_delay_ms, where four of five harnesses
# carried one unrevisited default and every receipt read delivered while a
# composer piled up. The provenance was written down beside the old field: a
# 2026-07-13 docstring verified THREE harnesses and six rows ended up carrying
# the value.
#
# Every value below is measured, per harness, against the artifact and the
# wiring that reaches it - never against the word "native" in a table. Two of
# the five inherited rows were wrong.
#
# claude, measured 2026-08-28: hooks/hooks.json declares a `Stop` group whose
# command is hooks/target-stop-hook.sh, which shells loop-check.
loop_participation = "native"
loop_extension = ""
command_surface = "slash"
slash_prefix = ""
ready_marker = "live_prompt_box"
ready_rule_ids = ["live_prompt_box", "osc_title_idle"]
manifest_rules = [
  { id = "live_prompt_box", state = "idle" },
  { id = "osc_title_idle", state = "idle" },
  { id = "permission_prompt", state = "blocked" },
]
send_keys_enter_delay_ms = 800
submit_keys = ["enter"]
stop_strategy = "claude-short-id"
remove_strategy = "claude-short-id"
session_binding = { strategy = "preassigned-or-session-start", required = true, timeout_ms = 60000 }

# How each harness and substrate stands toward the fno state root. One of:
#
#   "<carrier>"    the lane is sandboxed and this names how the grant travels
#   "unsandboxed"  MEASURED to need no carrier: the worker runs with the user's
#                  own permissions, so nothing restricts its state-root writes
#   "unmeasured"   nobody has measured this lane. It is NOT refused, because
#                  refusing on an unmeasured premise is the same guess in the
#                  other direction; the caller gets the stderr note that
#                  writable_dirs.py already prints
#
# The spawn gate refuses only an ABSENT key, meaning a lane nobody declared at
# all. That keeps a newly added lane loud on day one without converting a
# working spawn into a refused one.
#
# The trigger is deliberately not "declares no carrier". Epic rule R3 refuses a
# process DENIED its declared root, and a lane that runs under no sandbox is
# never denied anything. Measured 2026-08-28: an opencode PANE worker acquired
# a claim and delivered mail with no grant at all, so refusing it would have
# broken a lane that works.
[harness.claude.state_root_grant]
# `--add-dir`, spent by `claude_ask::build_argv` on every claude substrate.
pane = "argv-add-dir"
thread = "argv-add-dir"
headless = "argv-add-dir"

[harness.claude.permission_response.allow_once]
supported = true
rule_ids = ["permission_prompt"]
keys = ["1"]

[harness.claude.permission_response.allow_always]
supported = true
rule_ids = ["permission_prompt"]
keys = ["2"]

[harness.claude.permission_response.deny]
supported = true
rule_ids = ["permission_prompt"]
keys = ["3"]

[harness.claude.resume_strategy.forms.interactive_create]
kind = "session_flag"
tokens = ["claude", "--session-id", "{session_id}"]

[harness.claude.resume_strategy.forms.interactive_resume]
kind = "flag"
tokens = ["claude", "--resume", "{session_id}"]

[harness.claude.resume_strategy.forms.interactive_attach]
kind = "subcommand"
tokens = ["claude", "attach", "{short_id}"]

[harness.claude.resume_strategy.forms.headless_create]
kind = "flag"
tokens = ["claude"]

[harness.claude.resume_strategy.forms.headless_resume]
kind = "flag"
tokens = ["claude", "-p", "--resume", "{session_id}"]

[harness.claude.model_switch_strategy]
kind = "direct"
tokens = ["/model {model}", "/effort {effort}"]
effort_labels = {}
status_command = "/status"
status_pattern = 'Model:\s+(?P<model>\S+).*?(?:reasoning|effort)\s+(?P<effort>minimal|low|medium|high|xhigh|max)'

[harness.codex]
permission_bypass = ["--dangerously-bypass-approvals-and-sandbox"]
resume = "native-thread"
# A codex thread lives on the SHARED `codex app-server daemon`, which owns it.
# So it survives mux death AND `fno-agents-daemon` death: neither process
# holds it. The bit was first flipped for mux survival alone, when the lane
# forked a private app-server per worker as a child of `fno-agents-daemon`.
# That child did survive mux death and did not obviously survive its own
# parent's, so the bit promised more than it delivered; measured 2026-08-27,
# corrected 2026-08-28 (docs/architecture/codex-thread-driver.md).
thread = true
autonomous_pane = true
route_on_pane = false
# codex, measured 2026-08-28: hooks/codex-hooks.json declares a `Stop` group
# whose command is hooks/target-stop-hook.sh, the same adapter claude wires.
loop_participation = "native"
loop_extension = ""
command_surface = "codex-skill"
# The codex TUI's own slash verbs, measured 2026-09-01. The verb normalizer
# rewrites a leading-slash token on this surface only when it names a shipped
# footnote verb AND is not one of these, so a native verb driven through a
# spawn or dispatch reaches the TUI verb instead of a footnote skill that does
# not exist. `review` is the collision case - it is both, and the bare
# spelling stays native; the fno lane is reached namespaced, as /fno:review.
native_verbs = ["/review", "/code-review", "/model", "/status", "/compact"]
# The subset the shared app-server daemon maps to its review/start RPC. Every
# other native verb has no prompt line on a daemon thread, and the mail lane
# refuses it by name.
review_verbs = ["/review", "/code-review"]
ready_marker = "idle_prompt"
ready_rule_ids = ["idle_prompt"]
manifest_rules = [
  { id = "idle_prompt", state = "idle" },
  { id = "approval_prompt", state = "blocked" },
]
# Measured 2026-08-23 on a live mux pane (x-4b0b): floor 0. Every D in
# {0,100,200,400,800} ms, 3 trials each, submitted both idle and mid-turn,
# payloads 0.7-2.0 KB, codex-cli 0.148.0; confirmed by probe token in the
# rollout transcript. The operator pile-up (six queued envelopes, table read
# 0) did NOT reproduce, so 800 is a margin, not a floor: it matches the
# claude row and CR_SETTLE_MS (mux pane send --submit), the two shipped
# settles never observed to lose a CR. Do not lower without a repro.
send_keys_enter_delay_ms = 800
submit_keys = ["enter"]
stop_strategy = "registry-noop"
remove_strategy = "codex-session-index"
session_binding = { strategy = "rollout-fd-or-daemon", required = true, timeout_ms = 60000 }

[harness.codex.state_root_grant]
# pane/headless spend `--add-dir` (writable_dirs.ADD_DIR_PROVIDERS). The thread
# lane builds NO argv - it sends JSON-RPC to a shared app-server - so its only
# carrier is a protocol field. Measured against the live daemon on 2026-08-28:
# `thread/start` takes only the scalar `sandbox` enum and IGNORES a
# `sandboxPolicy` object without erroring, while `turn/start` honors
# `sandboxPolicy.writableRoots`. docs/architecture/codex-thread-driver.md
# records the measurement and the frames it came from.
pane = "argv-add-dir"
thread = "turn-start-sandbox-policy"
headless = "argv-add-dir"

[harness.codex.permission_response.allow_once]
supported = true
rule_ids = ["approval_prompt"]
keys = ["1"]

[harness.codex.permission_response.allow_always]
supported = true
rule_ids = ["approval_prompt"]
keys = ["2"]

[harness.codex.permission_response.deny]
supported = true
rule_ids = ["approval_prompt"]
keys = ["3"]

[harness.codex.resume_strategy.forms.interactive_create]
kind = "subcommand"
tokens = ["codex"]

[harness.codex.resume_strategy.forms.interactive_resume]
kind = "subcommand"
tokens = ["codex", "resume", "{session_id}"]

# `codex resume <id>` execs codex's OWN TUI on a thread the shared app-server
# daemon holds. fno renders nothing.
#
# `pre_exec` starts the daemon and `--remote unix://` asserts that it did.
# Measured 2026-08-29 against codex-cli 0.149.1 with the marker the vendor
# itself produces: session 01a0398f (a rollout on disk from 2026-08-25) was
# ABSENT from `thread/loaded/list` before the resume and PRESENT after, read
# over an independent connection to the control socket. `unix://` with no path
# makes codex resolve `CODEX_HOME` itself, so fno never rebuilds a socket path
# it would only have to keep in step. A BARE `codex resume <id>` also
# auto-attaches with the daemon up; the flag is kept because it makes the
# daemon-down case LOUD (a named failure) where a bare resume would silently
# run a private in-process app-server against a copy of the rollout and hand
# back a session that looks correct. `daemon start` is a documented no-op when
# one is already running (measured: `{"status":"alreadyRunning"}` twice in a
# row), so the pair is cheap on every attach.
#
# `{session_id}`, never `{short_id}`: a codex UUIDv7 head-8 is a ~65.5s clock
# bucket, so siblings spawned in one minute collide and a short id would
# attach the wrong worker.
[harness.codex.resume_strategy.forms.interactive_attach]
kind = "subcommand"
pre_exec = ["codex", "app-server", "daemon", "start"]
tokens = ["codex", "resume", "{session_id}", "--remote", "unix://"]

[harness.codex.resume_strategy.forms.headless_create]
kind = "subcommand"
tokens = ["codex", "exec"]

[harness.codex.resume_strategy.forms.headless_resume]
kind = "subcommand"
tokens = ["codex", "exec", "resume", "{session_id}"]

[harness.codex.model_switch_strategy]
kind = "menu_walk"
tokens = ["/model", "{model}", "{effort_label}"]
effort_labels = { low = "Low", medium = "Medium (default)", high = "High", xhigh = "Extra high", max = "More reasoning…" }
status_command = "/status"
status_pattern = 'Model:\s+(?P<model>\S+).*?reasoning\s+(?P<effort>minimal|low|medium|high|xhigh|max)'

[harness.gemini]
permission_bypass = ["--yolo"]
resume = "native-continue"
thread = false
autonomous_pane = false
route_on_pane = false
# gemini, measured 2026-08-28, and the old "native" was WRONG. Nothing in this
# tree wires a gemini stop boundary. `fno config setup cli-hooks` installs
# exactly one gemini hook, `install_gemini_hook` in cli/src/fno/setup/cli_hooks.py,
# and it merges a SessionStart group only. hooks/hooks-gemini.json, named in
# docs/architecture/multi-cli-hooks.md, does not exist on disk. docs/harnesses/gemini.md
# lists the SessionStart context hook and no other. No file in hooks/ reaches
# loop-check under a gemini lifecycle event. The searches: every `loop-check`
# caller in hooks/ and scripts/ (five files, none gemini), and every gemini
# installer in cli/src/fno/setup/ (SessionStart only). The CLI is deprecated
# upstream and `command_surface` already reads "refused", so this is a coherent
# result rather than a regression; it is recorded plainly instead of inherited.
loop_participation = "none"
loop_extension = ""
command_surface = "refused"
ready_marker = "unsupported"
ready_rule_ids = []
manifest_rules = []
send_keys_enter_delay_ms = 0
submit_keys = ["unsupported"]
stop_strategy = "registry-noop"
remove_strategy = "registry-only"
session_binding = { strategy = "preassigned", required = true, timeout_ms = 60000 }

[harness.gemini.state_root_grant]
# gemini maps no additive write grant on any substrate. Whether a gemini worker
# is actually DENIED the state root is unmeasured, and the CLI is deprecated
# upstream, so nobody is going to measure it. Declared rather than refused: the
# stderr note already warns, and a refusal here would rest on a guess.
pane = "unmeasured"
thread = "unmeasured"
headless = "unmeasured"

[harness.gemini.permission_response.allow_once]
supported = false
rule_ids = []
keys = []

[harness.gemini.permission_response.allow_always]
supported = false
rule_ids = []
keys = []

[harness.gemini.permission_response.deny]
supported = false
rule_ids = []
keys = []

[harness.gemini.resume_strategy.forms.interactive_create]
kind = "session_flag"
tokens = ["gemini", "--session-id", "{session_id}"]

[harness.gemini.resume_strategy.forms.interactive_resume]
kind = "flag"
tokens = ["gemini", "--resume", "{session_id}"]

[harness.gemini.resume_strategy.forms.interactive_attach]
kind = "unsupported"
tokens = []

[harness.gemini.resume_strategy.forms.headless_create]
kind = "session_flag"
tokens = ["gemini", "--session-id", "{session_id}"]

[harness.gemini.resume_strategy.forms.headless_resume]
kind = "flag"
tokens = ["gemini", "--resume", "{session_id}"]

# model_switch_strategy kind="unsupported" records that fno has not built the
# switch lane on that harness, never that the harness cannot switch models. It
# is a lane statement, not a harness measurement; a built lane flips the kind.
[harness.gemini.model_switch_strategy]
kind = "unsupported"
tokens = []
effort_labels = {}
status_command = ""
status_pattern = ""

[harness.agy]
permission_bypass = ["--dangerously-skip-permissions"]
resume = "native-continue"
# TRUE behind a live journey (cli/tests/agents/test_agy_spawn_journey.py,
# journey wk-x-d145): fno's keeper hosts the agy TUI and `dispatch_spawn`'s agy
# branch drives it. Measured 2026-09-03 on agy 1.1.24 - one `agy -p
# --output-format json` turn returned a conversation_id in 1.5s, the id named a
# real db under ~/.gemini/antigravity-cli/conversations, and a FRESH process
# resumed that conversation interactively with its transcript restored.
thread = true
autonomous_pane = false
route_on_pane = false
# agy, measured 2026-08-28: hooks/agy-target-stop-hook.sh is a real adapter that
# shells the same loop-check, and `fno config setup` registers it in agy's
# ~/.gemini/config/hooks.json under the `footnote` namespace key as a `Stop`
# handler (_agy_install in cli/src/fno/setup/integration.py). agy's hooks carry
# claude-shaped event names over a Gemini-family wire format, so the adapter
# translates rather than reusing target-stop-hook.sh verbatim; the authority is
# the same binary.
loop_participation = "native"
loop_extension = ""
command_surface = "slash"
slash_prefix = ""
ready_marker = "unsupported"
ready_rule_ids = []
manifest_rules = []
# Measured 2026-08-23 on a live mux pane (x-4b0b): floor 0. Every D in
# {0,100,200,400,800} ms, 3 trials each, submitted at idle, payloads 0.7 and
# 1.2 KB, agy 1.1.19; judged by the model's ACK answer appearing after the
# probe token (agy keeps no local transcript store). 800 is a margin, not a
# floor, matching the claude row and CR_SETTLE_MS; do not lower without a
# repro of the lost-CR regime.
send_keys_enter_delay_ms = 800
submit_keys = ["enter"]
stop_strategy = "registry-noop"
remove_strategy = "registry-only"
# agy mints its own conversation id and takes none on the command line, so the
# spawn runs one print-mode turn and reads the id back out of its JSON envelope
# - cursor-agent's shape, minus the fd dance, because `agy -p` exits on its own.
#
# `required` stays FALSE, and the asymmetry is the reason: this field is a
# whole-row claim, and only the THREAD lane binds an id today. The pane arm
# still launches a bare `agy` and mints nothing, so `true` would assert a
# binding for a lane that makes none - and would add agy to
# `_SESSION_BINDING_HARNESSES` (harness_probe._required_registrations), where
# its pane receipts would then report `bound: false` for healthy workers.
# Minting on the pane lane too is what makes this `true`.
session_binding = { strategy = "callee-minted-read-back", required = false, timeout_ms = 60000 }

[harness.agy.state_root_grant]
# `--add-dir` (writable_dirs.ADD_DIR_PROVIDERS).
pane = "argv-add-dir"
thread = "argv-add-dir"
headless = "argv-add-dir"

[harness.agy.permission_response.allow_once]
supported = false
rule_ids = []
keys = []

[harness.agy.permission_response.allow_always]
supported = false
rule_ids = []
keys = []

[harness.agy.permission_response.deny]
supported = false
rule_ids = []
keys = []

# Create and resume are the SAME launch once the id exists: the print-mode turn
# mints it, every later process rejoins it. Bare `agy` would open a conversation
# fno cannot name, which is the one thing a keeper thread may never do.
[harness.agy.resume_strategy.forms.interactive_create]
kind = "session_flag"
tokens = ["agy", "--conversation", "{session_id}"]

# `--conversation <id>` resumes the conversation from any process state,
# the same primitive the headless_resume row below records. Measured
# 2026-08-26 on agy 1.1.19 and re-measured 2026-08-26 on 1.1.21: a fresh
# process quoting a token planted in an earlier turn (num_turns 2), and the
# help text reads "Resume a previous conversation by ID".
[harness.agy.resume_strategy.forms.interactive_resume]
kind = "session_flag"
tokens = ["agy", "--conversation", "{session_id}"]

[harness.agy.resume_strategy.forms.interactive_attach]
kind = "unsupported"
tokens = []

[harness.agy.resume_strategy.forms.headless_create]
kind = "flag"
tokens = ["agy"]

[harness.agy.resume_strategy.forms.headless_resume]
kind = "session_flag"
tokens = ["agy", "--conversation", "{session_id}"]

[harness.agy.model_switch_strategy]
kind = "unsupported"
tokens = []
effort_labels = {}
status_command = ""
status_pattern = ""


# The keeper-lane spawn arm (docs/architecture/thread-lanes.md). state_root_grant
# above records a write-access MECHANISM per lane, never whether a lane was
# run, so agy passes the seam's unmeasured-stance check for headless too and
# that refusal has to be stated here. `ready_marker` measured 2026-09-03 on
# 1.1.24, after the restored transcript finishes painting.
[harness.agy.keeper]
once_refusal = "--once is not supported on the agy thread lane (it is persistent); agy's one-shot form is `agy -p`, whose lane is unmeasured"
carries = ["model", "yolo", "permission_mode", "add_dir", "effort", "resume_session_id"]
ready_marker = "? for shortcuts"
headless_refusal = "agy's headless lane is unmeasured: `agy -p` prints and exits, and nothing has run it as an fno worker. Use --substrate thread for a persistent worker or --substrate pane for an attended one."
bypass_flag = "--dangerously-skip-permissions"
bypass_always = true
takes_model = true
takes_effort = true
takes_add_dir = true
# Enter accepts the highlighted default, "Yes, I trust this folder", the same
# answer the pane lane submits. A keeper has nobody to answer a modal, and a
# TUI behind an unanswered one runs NOTHING while holding a live registry row.
clear_modal = ["trust (?:this )?folder|do you trust", "\r"]

[harness.opencode]
permission_bypass = ["--dangerously-skip-permissions"]
resume = "native-session"
# The serve lane is launch-only: `ask` refuses (no steering over the HTTP
# API yet), the x-d9f9 journey test covers spawn + one turn but not the
# server-kill survival, cold resume, or review steps of the bar in
# docs/architecture/codex-thread-driver.md. A caller routed onto thread by
# default got a session it could not talk to. False until the steering
# lane ships with its own unattended journey test; measured 2026-08-26.
thread = false
autonomous_pane = false
route_on_pane = false
# opencode, measured 2026-08-28, and the old "native" was WRONG. opencode has no
# shell hook and no exit veto; its own plugin says so in its header. The loop
# closes here through a JS plugin fno ships and installs into
# ~/.config/opencode/plugins/footnote.js, which subscribes to `session.idle`,
# synthesizes a claude-shaped transcript, shells the same `fno-agents loop-check`,
# and re-drives the session in-context on a block. That is a working loop, so the
# honest value is "extension" rather than "none": the boundary exists, it is just
# an artifact somebody wrote instead of a hook the harness fires.
loop_participation = "extension"
loop_extension = "cli/src/fno/setup/assets/opencode/footnote.js"
command_surface = "slash"
slash_prefix = "fno:"
ready_marker = "unsupported"
ready_rule_ids = []
manifest_rules = [{ id = "permission_required", state = "blocked" }]
send_keys_enter_delay_ms = 0
submit_keys = ["unsupported"]
stop_strategy = "registry-noop"
remove_strategy = "registry-only"
session_binding = { strategy = "store-lookup", required = false, timeout_ms = 2000 }

[harness.opencode.state_root_grant]
# opencode maps no additive dir flag (`--dir` SETS cwd, verified against
# v1.14.50), so its argv lanes carry nothing. The serve-HTTP thread lane does:
# `opencode_serve.rs` turns FNO_WORKER_ADD_DIRS into per-session
# `external_directory` allow rules.
#
# pane is MEASURED unsandboxed, 2026-08-28: an opencode pane worker with no
# grant acquired `session:probe-<nonce>` and delivered mail carrying the same
# nonce, both read by the dispatcher from the operator root. opencode is
# pane-hosted and a mux pane is an ordinary user process, so there is nothing
# to widen. headless has had no such measurement.
pane = "unsandboxed"
thread = "serve-external-directory"
headless = "unmeasured"

[harness.opencode.permission_response.allow_once]
supported = false
rule_ids = ["permission_required"]
keys = ["enter"]

[harness.opencode.permission_response.allow_always]
supported = false
rule_ids = ["permission_required"]
keys = ["right", "enter"]

[harness.opencode.permission_response.deny]
supported = false
rule_ids = ["permission_required"]
keys = ["right", "right", "enter"]

[harness.opencode.resume_strategy.forms.interactive_create]
kind = "flag"
tokens = ["opencode"]

[harness.opencode.resume_strategy.forms.interactive_resume]
kind = "session_flag"
tokens = ["opencode", "--session", "{session_id}"]

[harness.opencode.resume_strategy.forms.interactive_attach]
kind = "unsupported"
tokens = []

[harness.opencode.resume_strategy.forms.headless_create]
kind = "subcommand"
tokens = ["opencode", "run"]

[harness.opencode.resume_strategy.forms.headless_resume]
kind = "session_flag"
tokens = ["opencode", "run", "--session", "{session_id}"]

[harness.opencode.model_switch_strategy]
kind = "unsupported"
tokens = []
effort_labels = {}
status_command = ""
status_pattern = ""

# pi (@earendil-works/pi-coding-agent 0.84.2), a DUAL-LANE harness. Which lane
# a session gets is a choice fno makes at exec, never a property of pi:
#
#   rpc lane    `pi --mode rpc`. Strict JSONL over stdin/stdout, typed events,
#               LF the only record delimiter, `id` correlating request to
#               response. The DRIVING lane: spawn, ask, and mail injection,
#               the last of which rides pi's native `steer` command rather
#               than typed keystrokes.
#   pane lane   plain interactive `pi` in a mux pane, showing pi's real TUI.
#               The WATCHING lane, and the only lane where `/login <provider>`
#               can be run at all. Measured 2026-08-28: a TUI opened on a
#               session an rpc driver already holds JOINS it, renders that
#               session's own turns, and the session-file count stays at ONE.
#               So the pane is a VIEW onto a live rpc session, not a rival
#               launch, and no lane has to be chosen at spawn.
#
# CALLER-ASSIGNED IDS REMOVE THE CLOCK-BUCKET COLLISION AND DO NOT REMOVE THE
# COLLISION. pi adopts any `--session-id`, so it cannot suffer the ~65s clock
# bucket that collides two codex short ids. But CONCURRENT CREATE on one id is
# UNSERIALISED AND SILENT: four simultaneous creates on one id each printed
# "creating a new session with that id", each exited 0, and produced FOUR
# session files 49ms apart, every one of them internally perfect. A later
# resume picked the OLDEST and named none of the other three. Joining an
# EXISTING session is safe, measured four times, one linear parentId chain.
# Creating one concurrently is not. fno serialises the CREATE DECISION with
# `fno agents claim` on a `pi-session:<cwd>:<id>` key and releases it as soon
# as the winner is recorded.
#
# Session lookup is CWD-SCOPED. Sessions live at
# ~/.pi/agent/sessions/<encoded-cwd>/<ISO-timestamp>_<session-id>.jsonl, so the
# identity is the pair (cwd, session_id) and never the id alone. A resume issued
# from the canonical checkout will not see a session started in a worktree.
[harness.pi]
# pi ships NO permission popups. Its own docs/usage.md says so in as many
# words, and `pi --help` carries no bypass flag: `--approve`/`-a` trusts
# project-local FILES for a run, which is a different axis. So there is no
# prompt to bypass and nothing honest to put here.
permission_bypass = []
resume = "native-session"
# TRUE, and the seven-step restart journey is the evidence
# (cli/tests/agents/test_thread_keeper_journey.py, journey wk-x61bc, first
# green 2026-09-01 on pi 0.84.2): with the mux server AND fno-agents-daemon
# both SIGKILLed, the keeper-hosted child stayed alive under launchd with cwd
# and session id unchanged, the restart sweep re-bound the same row (same
# child pid, same socket, same session id), ~/.pi/agent/sessions gained no
# file across the restart, and a second prompt answered from the first turn's
# memory. The bit covers the lane dispatch resolves onto, which the lane-B
# driver spawns and a keeper process hosts. The spawn arm shipped (x-43bd):
# pi is in SPAWN_HARNESSES, dispatch_spawn has a pi branch, and the public
# surface brings its own journey (cli/tests/agents/test_pi_spawn_journey.py).
thread = true
autonomous_pane = false
route_on_pane = false
# pi, measured 2026-08-28, replacing the inherited value this row refused to
# stand behind. pi ships NO shell hook surface at all: nothing invokes a script
# at a lifecycle boundary. Its extension points are in-process TypeScript
# extensions under ~/.pi/agent/extensions, and the fno hook contract maps onto
# them cleanly but as code - the stop gate onto `pi.on("agent_settled")`, whose
# own definition is no retry, compaction or follow-up left, which is both the
# right semantics and a positive marker rather than an absence. So pi's answer is
# "extension", the same member opencode carries. The extension shipped (x-43bd,
# a port of opencode's plugin: loop-check stays the sole completion authority
# and the extension never fabricates a termination), so `loop_extension` names
# the shipped artifact and a looping dispatch at pi resolves.
loop_participation = "extension"
loop_extension = "cli/src/fno/setup/assets/pi/footnote.ts"
command_surface = "slash"
slash_prefix = ""
# Read off a live pi TUI on 2026-08-28, not inherited: the status bar carries
# the cost, the subscription tag, the context percentage and the compaction
# tag, and it is the lowest-priority rule in manifests/pi.toml precisely
# because it is drawn while WORKING too. The spinner rule outranks it, so only
# a screen with the bar and no spinner reads idle. These are the PANE lane's
# rules. The rpc lane reads no screen at all: it asserts the typed
# `agent_settled` event, which is the only sound completion read there, because
# rpc mode EXITS ON STDIN EOF mid-turn with status 0 and a clean exit therefore
# proves nothing about a turn.
ready_marker = "idle_status_bar"
ready_rule_ids = ["idle_status_bar"]
# Only the idle/blocked vocabulary belongs in this field; the working rule
# that outranks this one lives in manifests/pi.toml, where the arbitration
# happens. pi declares no blocked rule because it has no approval screen.
manifest_rules = [{ id = "idle_status_bar", state = "idle" }]
# Measured 2026-08-28 in a live tmux pane against pi 0.84.2, testing the exact
# shape that broke codex in x-4b0b: a large multi-line paste followed
# immediately by a return, with no settle time. Payload 6,155 bytes / 42 lines,
# the size of a real fno_mail envelope; delay 0 ms; three trials, all three
# SUBMITTED with the composer cleared and the model replying; plus one short
# single-line trial, also submitted. This 0 is MEASURED. The 0 the gemini and
# opencode rows carry is a placeholder for a keystroke lane neither has. Do not
# copy this value to another harness: the evidence above is what makes it
# legitimate, and a 0 without it is indistinguishable from an unset default.
send_keys_enter_delay_ms = 0
submit_keys = ["enter"]
stop_strategy = "registry-noop"
remove_strategy = "registry-only"
# `--session-id <id>` is documented as "Use exact project session ID, creating
# it if missing" and behaves that way across two separate processes: a second
# run with the same assigned id recalled the first run's answer and printed no
# creation warning. fno MUST always mint and pass the id. pi's own default is a
# UUIDv7, whose head-8 is the same clock bucket that collides on codex.
session_binding = { strategy = "caller-assigned-cwd-scoped", required = true, timeout_ms = 60000 }

[harness.pi.state_root_grant]
# pi maps NO additive directory flag: `pi --help` on 0.84.2 lists nothing of
# the `--add-dir` shape, and `--approve`/`-a` trusts project-local FILES for a
# run, which is a different axis. So no pi lane can carry a grant.
#
# pane is unsandboxed, and this is a property of pi rather than a measurement
# gap. pi ships no permission popups and no sandbox at all - its own
# docs/usage.md says the tool deliberately excludes them, pointing operators at
# containers and tmux instead - so a pi pane worker is an ordinary user process
# with the operator's own reach. There is nothing to widen and nothing that
# could deny it the state root. That is the same reading opencode's pane lane
# carries, arrived at from pi's documented absence rather than from a probe.
#
# thread is unsandboxed by that same reading, earned rather than borrowed: the
# restart journey ran a real keeper-hosted pi child on this lane, and that
# process is as ordinary and unsandboxed as a pane child. headless stays
# `unmeasured` - nothing has run pi headless yet, so no claim write has ever
# been observed there, and a lane nothing dispatches must not inherit a stance
# from the lanes that do. The spawn arm shipped (x-43bd) and enforces that
# stance in code: `_check_spawn_harness` refuses the unmeasured substrate by
# name, and the lane opens only when its own journey lands.
pane = "unsandboxed"
thread = "unsandboxed"
headless = "unmeasured"

# pi has no approval UI, so there is no keystroke answer to record and all
# three actions are unsupported. This is an absence in pi, not an unmeasured
# field: docs/usage.md states outright that pi ships no permission popups, and
# manifests/pi.toml therefore declares no blocked rule for these to name. The
# rpc lane does carry an Extension UI Protocol, where `select`, `confirm`,
# `input` and `editor` dialogs go out on stdout as `extension_ui_request` and
# come back on stdin as `extension_ui_response` with the matching id. That is a
# structured round-trip on a different surface from this keystroke contract.
[harness.pi.permission_response.allow_once]
supported = false
rule_ids = []
keys = []

[harness.pi.permission_response.allow_always]
supported = false
rule_ids = []
keys = []

[harness.pi.permission_response.deny]
supported = false
rule_ids = []
keys = []

[harness.pi.resume_strategy.forms.interactive_create]
kind = "session_flag"
tokens = ["pi", "--session-id", "{session_id}"]

# Create and resume are the SAME flag on pi: `--session-id` adopts an existing
# session and creates one when it is absent. That is exactly why the create has
# to be serialised elsewhere. The flag itself cannot tell a caller which of the
# two it just did, and neither can its exit code.
[harness.pi.resume_strategy.forms.interactive_resume]
kind = "session_flag"
tokens = ["pi", "--session-id", "{session_id}"]

# The attach LANE is unsupported because this table's attach form is keyed on a
# `{short_id}`, and pi has none: its handle is the caller-assigned session id in
# its cwd, which is the interactive_resume form above. pi IS attachable, and the
# viewport builds that argv in `crate::pi::pi_attach_argv`, the same way PR 1255
# builds codex's. Opening it is a JOIN onto a session the rpc lane already
# holds; opening it on an id that does not exist yet is a CREATE and races.
[harness.pi.resume_strategy.forms.interactive_attach]
kind = "unsupported"
tokens = []

[harness.pi.resume_strategy.forms.headless_create]
kind = "session_flag"
tokens = ["pi", "--session-id", "{session_id}"]

[harness.pi.resume_strategy.forms.headless_resume]
kind = "session_flag"
tokens = ["pi", "--session-id", "{session_id}"]

# Unsupported in THIS table's vocabulary, which is a keystroke contract: a
# `direct` strategy types a slash command and reads a `/status` screen back.
# pi switches models on a different surface entirely - `set_model` (provider +
# modelId) over the rpc lane, and Ctrl+P cycling through `--models` in the TUI.
# Neither is a typed slash command with a status screen to scrape, so declaring
# `direct` here would be a spelling borrowed from codex rather than a fact about
# pi. The rpc lane's own driver reaches `set_model` directly.
[harness.pi.model_switch_strategy]
kind = "unsupported"
tokens = []
effort_labels = {}
status_command = ""
status_pattern = ""

# cursor-agent is a pane-only fno harness. Its --print stream-json mode is
