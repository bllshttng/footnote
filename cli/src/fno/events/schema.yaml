      required: []
      properties:
        op:
          type: string
          description: "Operation that failed (e.g. reap_orphans)."
        error:
          type: string

  - name: drive_force_close_timeout
    description: "Drive authority window could not be closed within the timeout during a forced agent stop."
    sources: [daemon]
    data:
      required: []
      properties:
        name:
          type: string
        short_id:
          type: string

  - name: drive_keystroke_stepped
    description: "A keystroke was delivered to the agent PTY in step-mode drive."
    sources: [daemon]
