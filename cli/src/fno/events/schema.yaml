# cli/src/fno/events/schema.yaml
# Single source of truth for events.jsonl envelope shape across footnote.
# Lives beside its Python loader (fno.events) and ships as package data.
#
# Both validators load this file:
#   - cli/src/fno/events/__init__.py (Python; imports raise SchemaUnavailableError if absent)
#   - scripts/lib/events-validate.sh (bash; caches at /tmp/events-schema-$$.cache via yq or python3 fallback)
#
# Adding a new event type:
#   1. Add an entry under `event_types`.
#   2. If gate-flipping, add the gate name to `gates`.
#   3. Add a fixture record to cli/tests/events/parity_corpus.jsonl so
#      both validators agree on the shape.
#   4. CI parity test (test_validator_parity.py) runs both validators
#      against the corpus; both must give the same verdict on every record.
#
# Removing an event type:
#   Add a `deprecated: <UTC ISO8601>` marker to the entry rather than
#   deleting it outright. test_no_undocumented_deletions enforces the marker
#   shape; downstream consumers get one release of warning before removal.

version: 1

envelope:
  required: [ts, type, source, data]
  properties:
    ts:
      type: string
      format: rfc3339-utc
      description: "UTC RFC3339 timestamp like 2026-05-07T09:30:42Z"
    type:
      type: string
      description: "Event type name; must match an entry in event_types"
    source:
      type: string
      # x-2901: single unified envelope. 'active-backlog' added (real emitter at
      # daemon.rs). Per-agent worker sources (worker:<id>, stream-worker:<id>) are
      # pattern sources, validated by both the Python and bash validators via the
      # `patterns` list below (previously only the parity-script layer checked them).
      enum: [target, megawalk, megatron, fno-loop, loop, hook, subagent, migration, test, backlog, daemon, observer, skill_diff, active-backlog, approvals]
      patterns:
        - '^(worker|stream-worker):.+$'
      description: "Producer identity; consumers route on this. A fixed-string source from the enum, or a per-agent worker matching one of `patterns`."
    data:
      type: object
      description: "Per-type payload; see event_types[].data"

# Allowed gate names for phase_transition events. Adding a gate without
# updating set_gate.sh's allowlist will fail the parity test.
gates:
  - quality_check_passed
  - output_validated
  - ledger_updated
  - artifact_shipped
  - external_review_passed
  - browser_testing_passed
  - memory_pass_passed
  - deferrals_captured
  - frontend_craft_passed
  - phase_init       # not strictly a gate; retained for back-compat with phase_init events
  - phase_rolled_back

event_types:

  - name: event_migration_landed
    retention: durable
    description: "A worktree-local journal segment landed in the canonical journal. Its deterministic migration id survives GC rewrites so crash recovery cannot replay the segment after later appends."
    sources: [migration]
    data:
      required: [migration_id]
      properties:
        migration_id:
          type: string
          description: "SHA-256 over the pending backup path and bytes, stable for every retry of that migration."
    consumers: [scripts/setup/setup-worktree.sh]

  - name: phase_transition
    description: "A gate flipped to true (gate_bearing=true) OR an audit-only phase boundary crossed (gate_bearing=false)."
    sources: [target, megawalk, fno-loop, hook]
    data:
      required: [gate_bearing, phase, nonce, session_id]
      properties:
        gate_bearing:
          type: boolean
          description: "True if this transition flipped a state-file gate bool; false for audit-only phase boundaries."
        gate:
          type: string
          description: "Gate name (e.g. ledger_updated). Required when gate_bearing=true; absent otherwise."
        phase:
          type: string
          description: "Phase identifier (e.g. register, review, ship)."
        nonce:
          type: string
          description: "provenance_nonce from the session's state file. Stop hook matches on this."
        session_id:
          type: string
          description: "target or megawalk session id."
    consumers: [hooks/target-stop-hook.sh, hooks/megawalk-stop-hook.sh]

  - name: child_promise
    description: "A target child session emitted <promise> at COMPLETE. Megawalk verifies before advancing."
    sources: [target]
    data:
      required: [session_id, nonce]
      properties:
        session_id:
          type: string
        nonce:
          type: string
    consumers: [hooks/megawalk-stop-hook.sh]

  - name: context_snapshot
    description: "A runtime observation of the exact directive text delivered by Footnote-owned SessionStart or PostCompact hook carriers. Session-bound, derived, and read-only with respect to delivery behavior."
    sources: [hook, test]
    data:
      required: [session_id, harness, entry_state, context_bytes, estimated_tokens, source_hashes, source_manifest, measurement_complete]
      properties:
        session_id:
          type: string
          description: "Harness session identity observed by the delivery hook."
        harness:
          type: string
          enum: [claude, codex, gemini]
        entry_state:
          type: string
          enum: [startup, resume, clear, post_compact]
        context_bytes:
          type: integer
          description: "UTF-8 bytes of delivered directive text, excluding carrier implementation bytes."
        estimated_tokens:
          type: integer
        context_hash:
          type: [string, "null"]
        source_hashes:
          type: array
        source_manifest:
          type: array
          description: "Per-source delivered-byte/hash/status observations."
        measurement_complete:
          type: boolean
          description: "True only when every expected delivery source was observed in the same hook invocation."
        measurement_errors:
          type: array
        node_id:
          type: string
    consumers: [fno whoami scoreboard --plan-fidelity]

  - name: context_comparison_declared
    description: "A predeclared context-pruning or graph-widening comparison contract. The derived scoreboard reads it but never mutates or persists a comparison result."
    sources: [target, hook, test]
    data:
      required: [comparison_contract]
      properties:
        comparison_contract:
          type: object
    consumers: [fno whoami scoreboard --plan-fidelity]

  - name: verification_receipt
    description: "Commit-bound deterministic verification evidence. Mode describes coverage; result describes the observed state. Only an exact-SHA full/passed receipt with every expected step executed may satisfy a full-evidence gate."
    sources: [target, hook, test]
    data:
      required: [candidate_sha, command, environment, scope, started_at, finished_at, mode, result, producer, generation, steps_expected, steps_executed]
      properties:
        candidate_sha:
          type: string
          description: "Full 40-hex candidate commit SHA."
        command:
          type: array
          items: { type: string }
          description: "Exact argv executed; never a prose summary. Each item is capped at 4096 UTF-8 bytes."
        environment:
          type: object
          description: "Structured host, platform, and runner identity."
        scope:
          type: array
          items: { type: string }
          description: "Exact verification legs covered by this result. Each item is capped at 512 UTF-8 bytes."
        started_at:
          type: string
          format: rfc3339-utc
        finished_at:
          type: string
          format: rfc3339-utc
        mode:
          type: string
          enum: [full, subset, void, advisory]
        result:
          type: string
          enum: [not_configured, unavailable, pending, failed, passed, stale]
        producer:
          type: object
          description: "Structured producer kind and unique id."
        generation:
          type: integer
          maximum: 9007199254740991
          description: "Positive journal-derived per-candidate receipt generation; authoritative for supersession and capped at the largest exactly represented IEEE-754 integer."
        steps_expected:
          type: integer
        steps_executed:
          type: integer
        detail:
          type: string
    consumers: [scripts/ci/preflight.sh, fno do pr, fno agents worker ship, fno-agents verify-evidence]

  - name: review_attestation
    retention: gate
    description: "A local reviewer (sigma | code-review | declare) completed a head-pinned review pass. loop-check reads this as gate evidence for a config.review.reviewers entry (x-e703, Phase 2): the entry is satisfied when reviewer matches, verdict == pass, and `review_freshness(head_sha, current HEAD)` is not Stale (x-5b99/x-62a1). That last clause used to be a bare `head_sha == current HEAD`, which made addressing a review destroy the proof the review happened - a mandatory pre-merge rebase cost a full re-review even though it changed no code. Freshness is now decided from the PR's own code-diff identity, so a pass carries across a rebase or a documentation-only advance and dies on any real code change. Head-pinning is still mandatory and the fail-closed direction is unchanged: an absent head_sha, an unresolvable commit, or any git failure is Stale. An unused-import removal is a `.py` change and still costs a re-review; no classifier here parses Python. NOTE what this event does and does not prove: the review verb emits nothing itself, and this event is written by a script that records the reviewer name and verdict it was PASSED. It proves a commit was pinned, never that a review happened."
    sources: [target, subagent, hook, test]
    data:
      required: [reviewer, head_sha, verdict, session_id]
      properties:
        reviewer:
          type: string
          description: "The reviewer name matching a config.review.reviewers entry (sigma | code-review | declare; a leading '/' is stripped by both parsers)."
        head_sha:
          type: string
          description: "The git HEAD sha the reviewer reviewed. loop-check head-pins on this: it satisfies the gate only while `review_freshness` rates it Fresh or Carried against the current HEAD (x-5b99). Emit it AFTER the reviewed commit is the tip - an attestation emitted before committing pins a commit the reviewer's findings are not about."
        verdict:
          type: string
          enum: [pass, fail]
          description: "pass satisfies the gate entry; fail (or an absent attestation) holds it (fail closed)."
        branch:
          type: string
          description: "The branch the attestation was emitted on (git rev-parse --abbrev-ref HEAD at emit; empty on a detached HEAD, never the literal string 'HEAD'). OPTIONAL, and its absence means the event PREDATES the field: every consumer scanning for attestations admits exact head equality for any line whatever branch it names (a foreign branch cannot share this head sha without being this commit - the spawned-reviewer lane emits from its own worktree branch at the PR head), while the code-diff carry stays branch-gated: a legacy line on a moved head is not scopeable to any PR. The field exists because the journal is shared across every worktree of a repo by design, so head_sha alone cannot say which PR an attestation is about and a global match counted foreign reviews."
        session_id:
          type: string
          description: "The target run id of the worktree the attestation was emitted in (fno_id, mirrored). NOT the attesting actor: it is grepped from the worktree manifest, so it equals manifest.session_id for every emitter in that worktree, including a reviewer who is not the author. A join on it returns self by construction; key the authorship join on attester_session_id instead."
        harness:
          type: string
          description: "The harness that ran the attesting session (claude | codex | gemini | opencode | agy), read from the live manifest. Names the session_id namespace."
        repo:
          type: string
          description: "Full repository identity `host/owner/repo`, lowercased, from the git remote. Present ONLY on the copy mirrored into the cross-project global log (`fno.events.cli` GLOBAL_MIRROR_TYPES); the project-log copy needs no scoping and omits it. Same producer and same meaning as `review_coverage.repo`: one parser, `fno.paths.repo_identity_from_remote_url`, in parity with `repo_identity_from_remote_url` in crates/fno-agents/src/finalize.rs. It is the FULL identity, never the last path segment, because `org-a/widget` and `org-b/widget` would otherwise share a key. Without it a global-log reader can match only on `head_sha`, and a fork shares those. Omitted (never null) when no remote resolves or it has fewer than two path segments; a reader must then decline to match the row rather than guess."
        attester_session_id:
          type: string
          description: "The harness session of the process that emitted the attestation - the attesting ACTOR. Stamped by the emit chokepoint (`fno doctor event emit`) via resolve_attester_identity(), never read from a caller-supplied value: the env read is corroborated against the process ancestry and an ancestor carrying a DIFFERENT value for the same marker refuses the whole emit, because one `VAR=<other-session>` assignment on the command line used to write the attestation under any session id and refresh that session's stale verdict onto a head it never saw. A supplied --data value disagreeing with the resolved identity is refused too. Unlike session_id it varies with who emitted, so it is the field the authorship join keys on: equal to the authoring session's manifest harness_session_id means self-attested. Empty when no marker is set or a mixed-family env cannot be attributed (unobserved, never guessed, never fallen back to the manifest - a fallback restores the tautology session_id carries). Every pre-landed attestation has this empty or caller-stamped."
        attester_witness:
          type: string
          enum: [process, env_only]
          description: "How attester_session_id was corroborated at emit: `process` when a readable ancestor process carries the same marker value (the harness that minted the id is in the emitting process's ancestry), `env_only` when nothing corroborates it - a bare shell, dead ancestry, or an ancestor the OS will not let the emitter read (darwin `ps eww` readability is partial by measurement: it exposed a live harness chain yet not other same-user processes). Recorded, never gating: an env_only attestation from such a lane is still a real review, and refusing it would wedge exactly the lanes the review-coverage work is trying to unwedge. Whether to gate on it is a later operator decision with this data in hand."
        retracts_attester:
          type: string
          description: "Present only on a RETRACTION: a fail verdict naming the attester whose pass at this head is revoked. The pair the coverage gate keys on becomes (reviewer, retracts_attester) instead of the event's own attester, so an operator session can revoke a forged or mistaken pass WITHOUT performing the impersonation a second time - the revoking identity is recorded in attester_session_id, never laundered into the key. Emitted by `fno do pr attestation retract`, which refuses when no matching pass exists."
        retraction_reason:
          type: string
          description: "The --reason text a retraction was emitted with, verbatim. The audit trail for why a pass stopped counting."
        model:
          type: string
          description: "The model the attesting session CLAIMED to be running (read from ANTHROPIC_MODEL at emit). Optional and best-effort: it reports what the environment asserted, not proof of the model that answered. Empty means NOT OBSERVABLE, never proof of the primary model - an unrouted session leaves it unset, and so does a routed codex worker, whose route rides in `-c model=...` config args with only the API key in env. The producer now REFUSES to record a claim it can prove false: a non-`claude*` model name with an empty or anthropic.com base URL cannot be the model that answered (the request silently falls back to the primary Anthropic model), so that case records empty rather than a value a reader would take as fact. A live specimen produced exactly that wrong record on 2026-08-12. The residue is a claim that is merely unverified rather than known-false, and no environment-side check closes that one. Recorded because a routed worker renders its own verdict on the routed model - role guards are per-spawn and cannot see a verdict emitted later inside an already-routed process. Not read by loop-check; this is the audit trail a capability floor would need."
        provider:
          type: string
          description: "The endpoint host the attesting session was pointed at (host only, derived from ANTHROPIC_BASE_URL at emit; scheme, path, and any userinfo are stripped so no key material lands here). Empty means not observable from the environment - the default Anthropic endpoint, or a lane that does not route via env. Same best-effort caveat as model."
        reviewer_context:
          type: string
          enum: [fresh, shared, unknown]
          description: "Positive evidence about the reviewer's execution context: fresh means a harness-recorded forked review context, shared means a same-context review tool result, and unknown means no positive context marker. Measures context independence, never who invoked the verb, and is not gating."
        reviewed_base_sha:
          type: string
          description: "The merge-base of the base branch and HEAD at emit - the far end of the diff the reviewer read. Recorded so a reader can tell a review of the PR from a review of nothing: a session resolving its target from a checkout sitting on the base branch reads a zero-line diff, and before this field a clean review of nothing was byte-identical to a clean review. The producer REFUSES to emit when the measured diff is 0 lines, so every event carrying these fields covers a non-empty diff. OPTIONAL: every pre-landed attestation lacks the trio."
        reviewed_head_sha:
          type: string
          description: "The HEAD the diff was measured against at emit - equal to head_sha, recorded explicitly so a reader never has to infer the range from two events. OPTIONAL, same pre-landed cohort as reviewed_base_sha."
        reviewed_line_count:
          type: integer
          description: "Added plus deleted lines across the reviewed diff (git diff --numstat of reviewed_base_sha..reviewed_head_sha). The producer refuses to emit at 0, and the coverage gate skips an attestation whose value is present and 0 - the gate-side guard catches an old or hand-crafted event the producer never saw. A line with the field ABSENT still counts: that is the pre-landed backlog and must not be invalidated. OPTIONAL."
    consumers: [fno-agents loop-check]

  - name: review_coverage
    retention: gate
    description: "Per-reviewer coverage verdicts for one gate evaluation (x-0eaf). Coverage is the instrument result; review_state is the known outcome when that instrument succeeded. Counts remain diagnostic. A head-pinned local pass makes coverage known even when the bot read failed, so a bot quota outage cannot wedge the autonomous path while a local lane reviewed."
    sources: [target, hook]
    data:
      required: [pr, coverage, verdicts, head_sha]
      properties:
        pr:
          type: integer
          description: "The PR number the gate evaluated."
        coverage:
          type: string
          enum: [covered, uncovered, unknown]
          description: "`covered` (count > 0) carries a count in reviewed_count; `uncovered` is a real, known zero; `unknown` means the review read failed and no local evidence confirmed a review (fail closed for autonomy, honest in the receipt). `uncovered` was added in x-5b99: a zero count previously serialized as the string `covered`, so `coverage: covered` and `reviewed_count: 0` co-occurred on three PRs in flight and the reassuring WORD sat beside the honest NUMBER. Additive for every reader, all of which already test `covered AND count > 0`, so a historical `covered` event with a zero count keeps reading as not-covered."
        review_state:
          type: string
          enum: [reviewed, unreviewed, reviewer_refused]
          description: "Known review outcome when the evidence read succeeded. reviewed wins when any current non-human verdict counts; otherwise reviewer_refused wins when a configured reviewer refused; otherwise unreviewed. Omitted when coverage is unknown so transport failure never becomes a known review outcome."
        reviewed_count:
          type: integer
          description: "Count of reviewed verdicts EXCLUDING human approvals (whether a human approval counts is the operator's deferred call; lean exclude). A verdict counts only while its freshness is not `stale`. Present whenever coverage is covered or uncovered (omitted only on unknown)."
        self_attested_count:
          type: integer
          description: "How many of reviewed_count are the AUTHOR attesting its own diff (attestation_origin == self_attested). Recorded, never gating, and deliberately not named `independent_count` - the schema is explicit below that other_session is not independence, and this must not launder that. A self-attested pass counts, because self-review is the DEFAULT path (config.review.self_review_required floors the harness review verb onto the author's own head), so refusing one would wedge every single-session PR. What x-62a1 asked for is that the answer be visible in the verdict rather than asserted in prose: a gate that wants to demand a second reader is now one predicate over this number, not a redesign. Present alongside reviewed_count."
        verdicts:
          type: array
          description: "One entry per reviewer over one producer axis. Producer is named by axis so the chatgpt-codex-connector App and the local codex CLI are distinct."
          items:
            type: object
            properties:
              producer:
                type: string
                enum: [github_app, local_attestation]
              name:
                type: string
              verdict:
                type: string
                enum: [reviewed, stale, refused, errored, absent]
                description: "`stale` (x-5b99) means the reviewer RESPONDED, but against a commit whose code no longer describes HEAD. It is recorded rather than dropped so the trail shows what happened, it is excluded from reviewed_count, and it is deliberately distinct from `absent`: a reviewer that read an older commit needs a nudge to re-read, while one that never responded needs waiting for."
              reviewed_sha:
                type: string
                description: "The commit this reviewer actually read: a github_app review object's `.commit.oid`, or a local attestation's own head_sha. Omitted when unknowable, which the freshness predicate treats as stale (fail closed). Its ABSENCE was the x-5b99 defect: head_sha below is stamped at EVAL time, so a bot verdict rendered hours and commits earlier serialized as coverage for a commit its author never saw."
              freshness:
                type: string
                enum: [fresh, carried_base_sync, carried_docs_only, carried_subset, stale]
                description: "Whether reviewed_sha still describes the code at HEAD. `fresh` = the reviewer read this exact commit. `carried_base_sync` = the PR's own code delta is byte-identical and any tree difference came from the base moving (a rebase). `carried_docs_only` = only documentation paths changed since. `carried_subset` = the code delta only shrank: every raw diff line still shipping is byte-identical to one the reviewer read, and the vanished lines are paths the base absorbed on the rebase (a strict subset of the reviewed diff). `stale` = everything else, including every failure path. A carry requires a positive match between two successfully computed code-diff identities; two absences never match. Omitted on a verdict with no review behind it (absent, refused)."
              human_approval:
                type: boolean
              scope:
                type: string
                enum: [attested_branch, legacy_head_match]
                description: "How a local_attestation verdict was scoped to this PR: `attested_branch` means the event was admitted while scope lasts - its branch equals the PR's head branch, or it pins the PR's exact head sha; `legacy_head_match` means the event predates the branch field and was admitted on exact head equality alone. Only present on local_attestation verdicts; github_app evidence is scoped by being a review object on this PR. A refusal that sees only legacy_head_match passes under a moved head names them as unscoped (pre-branch-field) rather than reporting a bare count."
              attestation_origin:
                type: string
                enum: [self_attested, other_session, unknown]
                description: "Authorship of a local_attestation review, computed from attester_session_id vs the authoring session's harness_session_id. self_attested = emitted by the authoring session; other_session = emitted by a different session (NOT 'independent' - a self-handoff successor or a second agent in a shared worktree is a different session and still not independent); unknown = attester empty/absent or the author session is unknown (the entire pre-landed backlog). Meaningful only on local_attestation verdicts; github_app/human approvals omit it. Recorded, never gating: reviewed_count does not read this field, so a self_attested verdict counts toward coverage exactly like any other and a green PR whose only attestation is self_attested is covered and may merge. Whether that should stay true is a later gate decision, not this field."
        head_sha:
          type: string
          description: "The HEAD the coverage was computed against (coverage is a snapshot). This is the EVAL head, not the head any reviewer read - that is per-verdict `reviewed_sha`. Conflating the two is x-5b99: the merge gate compared this field against the current head and correctly refused a stale eval, but a FRESH eval carrying a stale bot verdict walked straight through it."
        repo:
          type: string
          description: "Full repository identity `host/owner/repo`, lowercased, from the git remote (x-f43c). This event is written to BOTH the project log and the cross-project global log, and `pr` is a bare integer, so a reader scanning ~/.fno/events.jsonl needs this to tell repo A's PR 781 from repo B's. It is the FULL identity, never the last path segment: `org-a/widget` and `org-b/widget` would otherwise share a key, and since this gates auto-merge one repo's coverage could clear the other's guard (a fork shares head SHAs, so the staleness check would not catch it). Omitted (never null) when no remote resolves or it has fewer than two path segments; a reader must then decline to match the event in the global log rather than guess. Stable across a repo's worktrees, which is the property that lets a merge run from canonical see coverage attested inside a worktree. Producer: crates/fno-agents/src/finalize.rs `repo_identity_from_remote_url`; reader: fno/paths.py `repo_identity_from_remote_url`. The two must agree."
    consumers: [fno-agents loop-check, fno do pr, fno backlog reconcile]

  - name: review_gate_bot_usage_limited
    description: "A required/optional review bot posted a usage-limit comment (quota exhausted) and was dropped from missing_bots so the gate proceeds on remaining evidence rather than wedging until budget death (PR #214). Registered (x-0eaf) so the standard audit tooling sees a drop that was previously written to an unregistered stream. Distinct from review_coverage: this names bots that refused; coverage is the count that reviewed."
    sources: [target, hook]
    data:
      required: [pr, bots]
      properties:
        pr:
          type: integer
        bots:
          type: array
          items:
            type: string
          description: "Bot logins that posted a usage-limit refusal and were dropped from missing_bots."
    consumers: [fno-agents loop-check, fno do pr]

  - name: review_finding
    description: "An operator annotated a node's work (via `fno backlog annotate add` / `fno mux block annotate`). loop-check treats an open finding as a blocking review-gate input: terminal-allow is denied while any review_finding for the node has no matching review_finding_resolved. Node-scoped and NOT head-pinned - only an explicit resolve clears it, a new commit does not. The recorded text is the original; only the mail live-inject frame is x-9ed6-defanged."
    sources: [observer]
    data:
      required: [finding_id, node, text]
      properties:
        finding_id:
          type: string
          description: "Collision-safe short id minted at emit, never operator-supplied. loop-check quotes it in the deny reason and `fno backlog annotate resolve` clears it."
        node:
          type: string
          description: "The backlog node the finding is scoped to. loop-check matches the session's node against this."
        text:
          type: string
          description: "The operator annotation (original, un-defanged)."
        block_cmd:
          type: string
          description: "The annotated block's command line, when captured via mux (optional)."
        block_excerpt:
          type: string
          description: "A capped excerpt of the annotated block output (optional)."
    consumers: [fno-agents loop-check]

  - name: review_finding_resolved
    description: "A review_finding was explicitly resolved (by operator or self-resolving worker via `fno backlog annotate resolve`). Clears the matching finding for the loop-check gate. Idempotent: a second resolve of the same id is a warning no-op and emits nothing."
    sources: [observer]
    data:
      required: [finding_id]
      properties:
        finding_id:
          type: string
          description: "The review_finding id being resolved."
        node:
          type: string
          description: "The finding's node (echoed for observability; optional)."
    consumers: [fno-agents loop-check]

  - name: review_hold_expired
    description: "A merge surface read a review hold (review:branch:<branch>) whose TTL had lapsed with a dead holder, and cleared past it. The hold exists so a merge cannot land while a review of that head is still executing; a hold that outlives a crashed reviewer would wedge the lane permanently, so it ages out - but never silently, because a lane that clears with no receipt is indistinguishable from one that was never held. Emitted where the decision was taken, not by the reaper."
    sources: [fno-loop]
    data:
      required: [key, holder]
      properties:
        key:
          type: string
          description: "The claim key, review:branch:<branch>."
        holder:
          type: string
          description: "Who registered the hold, so a reader can find the reviewer that died."
        head_sha:
          type: string
          description: "The head the expired review was reviewing; empty when the hold recorded none."
        expires_at:
          type: integer
          description: "Epoch-ms TTL the hold passed."
    consumers: [operator]

  - name: mission_started
    description: "Megatron mission entered RUNNING state."
    sources: [megatron]
    data:
      required: [mission_id]
      properties:
        mission_id:
          type: string
    consumers: [postmortem]

  - name: wave_advanced
    description: "Megatron mission completed a wave; new wave dispatched."
    sources: [megatron]
    data:
      required: [mission_id, wave, child_session_ids]
      properties:
        mission_id:
          type: string
        wave:
          type: integer
        child_session_ids:
          type: array
          items: { type: string }
    consumers: [postmortem]

  - name: mission_complete
    description: "Megatron mission reached terminal status (done|failed|cancelled)."
    sources: [megatron]
    data:
      required: [mission_id, status]
      properties:
        mission_id:
          type: string
        status:
          type: string
          enum: [done, failed, cancelled]
    consumers: [postmortem]

  - name: completion_artifact_write_failed
    description: "write_mission_complete raised an exception when writing the aggregated completion artifact. The mission status flip already committed; this event is telemetry only."
    sources: [megatron]
    data:
      required: [mission_id, reason]
      properties:
        mission_id:
          type: string
          description: "The mission whose artifact write failed."
        reason:
          type: string
          description: "str(exception) from the failed write_mission_complete call."
    consumers: [operator]

  - name: completion_file_corrupt
    description: "A wave-completion JSON file could not be parsed. The wave is treated as not-yet-complete until the file is fixed or replaced."
    sources: [megatron]
    data:
      required: [path, reason]
      properties:
        path:
          type: string
          description: "Absolute path to the corrupt completion file."
        reason:
          type: string
          description: "Error message from json.JSONDecodeError or OSError, or a structured note like 'non-mapping json top-level: list'."
    consumers: [operator]

  - name: completion_schema_unknown
    description: "A wave-completion JSON record carried a schema_version greater than the consumer understands. The record still parses (additive evolution); telemetry exists so operators can detect producer/consumer drift."
    sources: [megatron]
    data:
      required: [observed_version, known_max, path]
      properties:
        mission_id:
          type: string
          description: "The mission_id from the completion record (best-effort)."
        observed_version:
          type: integer
          description: "schema_version read from the record."
        known_max:
          type: integer
          description: "Highest schema_version this consumer understands (CURRENT_COMPLETION_SCHEMA_VERSION)."
        path:
          type: string
          description: "Absolute path to the completion file."
    consumers: [operator]

  - name: completion_schema_invalid
    description: "A wave-completion JSON record carried a schema_version that is not coercible to an integer (string, null, list, ...). Treated as schema_version: 0 and the record still parses; telemetry exists so operators can detect malformed producers."
    sources: [megatron]
    data:
      required: [observed_raw, path]
      properties:
        mission_id:
          type: string
          description: "The mission_id from the completion record (best-effort)."
        observed_raw:
          type: string
          description: "repr() of the malformed schema_version value."
        path:
          type: string
          description: "Absolute path to the completion file."
    consumers: [operator]

  - name: manifest_baselined
    description: "Megatron stamped the mission's first manifest sha256 baseline (manifest_sha256 transition from None -> sha). Marks the start of dispatching for that mission; subsequent iterations compare fresh sha against this baseline to detect operator mutation. Emitted once per mission via _emit_manifest_event in megatron/loop.py."
    sources: [megatron]
    data:
      required: [mission_id, sha_short]
      properties:
        mission_id:
          type: string
          description: "The mission_id whose manifest was baselined."
        sha_short:
          type: string
          description: "First 12 hex chars of the manifest sha256 baseline."
    consumers: [operator]

  - name: manifest_mutated
    description: "Megatron detected that the manifest's sha256 diverged from the stored baseline (stored_sha != fresh_sha). Mission auto-paused with paused_reason=manifest_mutated:stored_sha=...:fresh_sha=...; operator must reconcile or rebaseline before dispatch resumes."
    sources: [megatron]
    data:
      required: [mission_id, stored_sha_short, fresh_sha_short]
      properties:
        mission_id:
          type: string
          description: "The mission_id whose manifest mutated mid-run."
        stored_sha_short:
          type: string
          description: "First 12 hex chars of the previously baselined manifest sha256."
        fresh_sha_short:
          type: string
          description: "First 12 hex chars of the manifest sha256 read on the iteration that detected the drift."
    consumers: [operator]

  - name: mission_complete_emit_failed
    description: "Stop hook deferred a mission completion emit because a precondition was not yet met (most commonly: pr_url not yet captured in target-state.md after a Phase-6 race). Best-effort forensic event written to hook-events.jsonl; the next stop-hook invocation retries the emit. Pairs with the <help reason=\"mission-pr-url-missing\"> stderr signal."
    sources: [hook]
    data:
      required: [mission_id, reason]
      properties:
        mission_id:
          type: string
          description: "The mission whose completion emit was deferred."
        reason:
          type: string
          description: "Why the emit deferred (e.g. pr_url_missing). Free-form string scoped to the stop hook's emit_mission_complete_if_needed branch."
    consumers: [postmortem]

  - name: mission_handoff_unreadable
    description: "Stop hook attempted to read .fno/HANDOFF.md to seed the discoveries field in the mission completion JSON but could not. Best-effort forensic event written to hook-events.jsonl alongside the completion emit; does not block completion. See plan 2026-05-13-megatron-discoveries-field."
    sources: [hook]
    data:
      required: [mission_id, reason]
      properties:
        mission_id:
          type: string
          description: "The mission whose HANDOFF.md could not yield a discoveries section."
        reason:
          type: string
          enum: [file_not_found, file_unreadable, file_empty, no_sections_found]
          description: "Why the helper could not extract content."
    consumers: [postmortem]

  - name: phase_init
    description: "Existing event from emit-gate-transition.sh / events.sh::emit_event_raw. Retained for back-compat."
    sources: [target, hook]
    data:
      required: [phase, nonce, session_id]
      properties:
        phase: { type: string }
        nonce: { type: string }
        session_id: { type: string }
    consumers: [hooks/target-stop-hook.sh]

  - name: target_denominator
    description: "The scope denominator chosen at `fno do target init` (x-cbab): a plan-backed run (plan_path set), a declared deliverable count (--deliverables N), or none. Feeds the deliverables-1 ratio measurement that detects when the cheap --deliverables exit is used as a bypass rather than an honest single-task declaration."
    sources: [target]
    data:
      required: [denominator]
      properties:
        session_id: { type: string, description: "The run's fno_id; best-effort (used to dedup retried inits in the ratio)." }
        denominator: { type: string, enum: [plan, deliverables, none] }
        count: { type: integer, description: "The declared deliverable count when denominator=deliverables; absent otherwise." }
        enumerated: { type: boolean, description: "Whether enumerated_scope fired on the node (withdrawing the cheap exit)." }
    consumers: [operator]

  - name: phase_rolled_back
    description: "Existing event from set_gate rollback path. Retained for back-compat."
    sources: [hook]
    data:
      required: [gate, reason, nonce, session_id]
      properties:
        gate: { type: string }
        reason: { type: string }
        nonce: { type: string }
        session_id: { type: string }
    consumers: [postmortem]

  - name: transcript_audit_failed
    description: "An external-state audit (verify-review-replies, verify-pr-merged) found that a gate's claimed outcome does not match the observable world. Emitted with rc=1 from the verifier; stop hook reads it as belt-and-braces evidence of the flip-back."
    sources: [hook]
    data:
      required: [gate, reason]
      properties:
        gate:
          type: string
          description: "Gate or audit category (e.g. external_review_passed when verify-review-replies flips a state-file gate back; auto_merge_outcome when verify-pr-merged blocks the promise without flipping a bool)."
        reason:
          type: string
          description: "Short audit-failure reason like missing_reply_to_reviewer or pr_closed_without_merge. Verifier-specific; not enumerated to keep the writer free to surface novel evidence."
        pr_number:
          description: "PR number the audit referenced (integer or string)."
        reviewer:
          type: string
          description: "External reviewer login when applicable (verify-review-replies)."
        last_review_at:
          type: string
          format: rfc3339-utc
          description: "Reviewer's most recent submitted_at timestamp."
        session_id:
          type: string
        nonce:
          type: string
    consumers: [postmortem]

  - name: polling_external_review
    description: "Emitted by /pr check at every external-review check tick. Counted as the fifth thrash-fingerprint signal so polling iterations register as progress and the thrash detector does not force-cancel the loop while waiting for a slow external reviewer."
    sources: [target, subagent, hook]
    data:
      required: [pr_number, reviewer_bot, wait_kind, session_id]
      properties:
        pr_number:
          description: "GitHub PR number being polled. Integer or string accepted."
        reviewer_bot:
          type: string
          description: "Identity of the awaited external reviewer (e.g. gemini-code-assist[bot])."
        wait_kind:
          type: string
          enum: [cron, inline]
          description: "Whether the tick fired from a CronCreate-scheduled prompt or the immediate inline check."
        session_id:
          type: string
          description: "target session id."
        next_check_at:
          type: string
          format: rfc3339-utc
          description: "Next scheduled poll time. The 30-minute exemption window in check_no_progress_thrash reads this."
        nonce:
          type: string
          description: "Optional provenance_nonce; tie-back to a session if provided."
    consumers: [hooks/target-stop-hook.sh]

  - name: reconcile_backfill_wrote
    description: "fno megatron reconcile --backfill wrote a missing completion JSON for a confirmed-merged PR. Forensic event: the file is the source of truth, this event is best-effort telemetry."
    sources: [megatron]
    data:
      required: [mission_id, wave, project, pr_url, commit_sha]
      properties:
        mission_id:
          type: string
          description: "Mission whose completion was backfilled."
        wave:
          type: integer
          description: "Wave number the backfilled project belongs to."
        project:
          type: string
          description: "Canonical project name (post-resolve)."
        pr_url:
          type: string
          description: "GitHub PR URL the backfill payload references."
        commit_sha:
          type: string
          description: "Merge commit SHA captured from gh."
    consumers: [operator]

  - name: cost_subprocess_failed
    description: |
      Emitted when register_session_cost's session-cost.py subprocess returns
      non-zero. The direct-JSON fallback still writes to ledger.json; this
      event is the forensic trail.
    sources: [fno-loop, hook]
    data:
      required:
        - session_id
        - returncode
        - stderr_snippet
        - fallback_succeeded
      properties:
        session_id:
          type: string
          description: "The footnote session ID passed to register_session_cost."
        returncode:
          type: integer
          description: "Exit code (or signal-negated value) returned by session-cost.py subprocess."
        stderr_snippet:
          type: string
          description: "First 4KB of session-cost.py stderr, or empty string if none."
        fallback_succeeded:
          type: boolean
          description: "True when the direct-JSON fallback ledger write succeeded after the subprocess failure."
        cost_usd:
          type: number
          description: "Cost in USD attributed to this session (optional; present when known)."
        tokens:
          type: integer
          description: "Token count for this session (optional; present when known)."
        provider_id:
          type: string
          description: "Provider ID this cost is attributed to (optional)."
        account_id:
          type: string
          description: "Human-friendly account label (optional)."
    consumers: [operator]

  - name: graph_status_drift
    description: |
      Emitted when an Entry is deserialized with a persisted `status`
      value that differs from the computed derivation (e.g. legacy
      graph.json with stale field). The computed value wins; this
      event records the drift for forensic audit.
    sources: [fno-loop, migration, subagent]
    data:
      required:
        - entry_id
        - persisted
        - computed
      properties:
        entry_id:
          type: string
          description: "The id field of the Entry whose persisted status diverged."
        persisted:
          type: string
          description: "The status value read from disk."
        computed:
          type: string
          description: "The status value derived from the entry's own fields."
    consumers: [operator]

  - name: phase_0_decision
    description: "Phase 0 measurement spike completed; gate decision recorded before any daemon implementation lands."
    sources: [target, subagent]
    data:
      required: [ratio, decision, evidence_path]
      properties:
        ratio:
          type: number
          description: "Aggregate fno_wall_seconds / phase_wall_seconds ratio across sampled sessions."
        decision:
          type: string
          enum: [abort_daemon, reads_only_v1, full_v1]
          description: "Gate outcome: abort_daemon (<15%), reads_only_v1 (15-30%), full_v1 (>=30%)."
        evidence_path:
          type: string
          description: "Path to the decision artifact (e.g., .fno/measurements/YYYY-MM-DD-fno-overhead.md)."
    consumers: [operator]

  - name: graph_reloaded
    description: |
      Emitted by the megawalk walker when a mid-loop mtime check detects
      graph.json or its sha256 sidecar has changed; the entry list has
      been reloaded.
    sources: [megawalk]
    data:
      required: [old_count, new_count, mtime_ns]
      properties:
        old_count:
          type: integer
          description: "Number of graph entries before the reload."
        new_count:
          type: integer
          description: "Number of graph entries after the reload."
        mtime_ns:
          type: integer
          description: "st_mtime_ns of graph.json at the time of reload (may be null if file was missing)."
        sidecar_mtime_ns:
          type: integer
          description: "st_mtime_ns of graph.json.sha256 at the time of reload (may be null; optional)."
    consumers: [operator]

  - name: graph_reload_failed
    description: |
      Emitted by the megawalk walker when a mid-loop reload attempt
      raised GraphCorruptionError, JSONDecodeError, or OSError; cached
      graph_entries preserved this tick.
    sources: [megawalk]
    data:
      required: [error_kind, mtime_ns]
      properties:
        error_kind:
          type: string
          description: "Exception class name (GraphCorruptionError, JSONDecodeError, or OSError)."
        mtime_ns:
          type: integer
          description: "st_mtime_ns of graph.json that triggered the failed reload attempt (may be null if missing)."
        sidecar_mtime_ns:
          type: integer
          description: "st_mtime_ns of graph.json.sha256 at the time of the failed reload (may be null; optional)."
        detail:
          type: string
          description: "str(exc) truncated to 200 chars (optional)."
    consumers: [operator]

  - name: integrity_warning
    description: "Forensic notice that a gate verification path accepted a degraded input. Non-blocking but auditable."
    sources: [target, fno-loop, hook]
    data:
      required: [kind, phase, session_id, artifact_path]
      properties:
        kind:
          type: string
          enum: [missing_nonce_legacy_accepted]
          description: "Which degraded-input variant was accepted."
        phase:
          type: string
          description: "Phase being verified (e.g. ship, review)."
        session_id:
          type: string
          description: "Session ID from the state file at verify time."
        artifact_path:
          type: string
          description: "Absolute or relative path to the artifact that was accepted without a nonce."
    consumers: [operator]

  - name: done_race_collision
    description: "Two backlog done calls landed on the same node; second saw status already done."
    sources: [fno-loop]
    data:
      required: [node_id, first_completed_at, second_attempt_at]
      properties:
        node_id:
          type: string
          description: "The backlog node id that was already done."
        first_completed_at:
          type: string
          description: "The completed_at timestamp already stored in the graph entry."
        second_attempt_at:
          type: string
          description: "UTC ISO8601 timestamp of the second backlog done call."
    consumers: [operator]

  - name: backlog_done_refused
    description: "fno backlog done refused to close a node because no merged/green-CI evidence was found."
    sources: [backlog]
    data:
      required: [node_id, pr_number, reason]
      properties:
        node_id:
          type: string
          description: "The backlog node id that was not closed."
        pr_number:
          type: integer
          description: "The first referenced PR number that was checked."
        reason:
          type: string
          description: "Human-readable reason for the refusal (e.g. PR state, CI bucket summary)."
    consumers: [operator]

  - name: backlog_done_forced
    description: "fno backlog done closed a node via --force --reason, bypassing the gh cross-check."
    sources: [backlog]
    data:
      required: [node_id, force_reason]
      properties:
        node_id:
          type: string
          description: "The backlog node id that was force-closed."
        force_reason:
          type: string
          description: "The --reason text provided by the operator."
        pr_number:
          type: integer
          description: "The first referenced PR number (if any)."
        pr_state:
          type: string
          description: "The gh-reported state of the PR at force-close time (OPEN/CLOSED/MERGED/UNKNOWN)."
    consumers: [operator]

  - name: graph_archive_swept
    description: "One archive sweep ran to completion (fno backlog archive, apply or dry-run alike), whether invoked directly or from the daily groom pass. Moved and every held-back bucket are always present, so a run that moves nothing still reports why: 'ok' with no count is indistinguishable from a sweep that never ran."
    sources: [backlog]
    data:
      required: [moved, held_referenced, held_related, held_too_recent, held_no_timestamp, older_than_days, mode]
      properties:
        moved:
          type: integer
          description: "Terminal nodes actually moved into graph-archive.json this run."
        held_referenced:
          type: integer
          description: "Terminal nodes held back because an open node still references them through a hard edge (blocker/parent/supersede)."
        held_related:
          type: integer
          description: "Terminal nodes held back because a related terminal peer is staying behind (moving one side of a symmetric pair would strand the other)."
        held_too_recent:
          type: integer
          description: "Terminal nodes held back because they are younger than the age gate."
        held_no_timestamp:
          type: integer
          description: "Terminal nodes held back because no parseable terminal timestamp was found."
        soft_edges_stripped:
          type: integer
          description: "Soft-edge references (related list entries, source_node_id origins) stripped from staying nodes so a soft-held terminal node could leave. Zero on dry-run (nothing is written) and on runs with no soft-held candidates."
        mode:
          type: string
          description: "dry-run or apply. Both modes emit, so a silent daily rehearsal leg is detectable."
        older_than_days:
          type: integer
          description: "The age gate this sweep used (--older-than-days)."
    consumers: [operator]

  - name: graph_archive_ids_reminted
    description: "One archive id-repair ran to completion (fno backlog archive-dedupe-ids --apply). A distinct type from graph_archive_swept: recording a repair as a zeroed sweep corrupts both 'did the daily sweep run' and per-gate hold statistics."
    sources: [backlog]
    data:
      required: [remint_count]
      properties:
        remint_count:
          type: integer
          description: "Archive-side ids reminted to resolve a collision with a working-graph id."
        remap:
          type: object
          description: "Map of old id to new id for every entry reminted this run."
    consumers: [operator]

  - name: style_refusal
    description: "A mail body was refused by the seven-rule style gate before delivery. The retry rate (a refusal followed by a passing send in the same session) is a query over events.jsonl."
    sources: [target, subagent, test]
    data:
      required: [surface, rule_ids]
      properties:
        surface:
          type: string
          description: "The surface the check ran on. Mail can refuse delivery; pr-body and markdown are hand-run lint surfaces."
        rule_ids:
          type: array
          description: "The rule numbers (1-6) that fired on the refused body."
          items:
            type: integer
        violation_count:
          type: integer
          description: "Total violations found; a body can break several rules at once."
        session_id:
          type: string
          description: "The refusing session's id, when ambient identity is present. Pairs a refusal with a later passing send for the retry-rate query."
    consumers: [operator]

  - name: backlog_reopened
    description: "fno backlog reopen cleared a node's completion. Every reopen carries a reason: a node that was done and now is not needs a why, or the graph records a state change nobody can account for."
    sources: [backlog]
    data:
      required: [node_id, reason]
      properties:
        node_id:
          type: string
          description: "The backlog node id that was reopened."
        reason:
          type: string
          description: "The --reason text. Required by the verb, not merely accepted."
        forced:
          type: boolean
          description: "True when --force bypassed the merged-PR refusal, i.e. the node's work is in main and was reopened anyway."
        pr_number:
          type: integer
          description: "The first referenced PR number (if any)."
        pr_state:
          type: string
          description: "The gh-reported state of that PR at reopen time (OPEN/CLOSED/MERGED/UNKNOWN)."
        cascade_reopened:
          type: string
          description: "Comma-separated ancestor epic ids reopened alongside, because the cascade had auto-closed them when this node closed. Empty when none."
    consumers: [operator]

  - name: claim_acquired
    retention: ephemeral
    description: "A work-claim was acquired on a key. First write to .fno/claims/<key>.lock."
    sources: [fno-loop, target, megawalk, megatron, hook]
    data:
      required: [key, holder, pid, host, acquired_at]
      properties:
        key:
          type: string
          description: "Claim key (e.g. node:ab-1234abcd, fleet:<mission-id>)."
        holder:
          type: string
          description: "Symbolic owner string (e.g. target-session:<sid>)."
        pid:
          type: [integer, "null"]
          description: "Holder process PID at acquire time."
        pid_unavailable:
          type: boolean
        host:
          type: string
          description: "Host (socket.gethostname) at acquire time; liveness compares the claim's machine_id, not this."
        acquired_at:
          type: integer
          description: "Epoch milliseconds, UTC."
        expires_at:
          type: integer
          description: "Epoch ms for TTL claims; absent or null for PID-liveness claims."
        reason:
          type: string
          description: "Optional human-readable context (max 512 chars)."
    consumers: [operator]

  - name: claim_released
    retention: ephemeral
    description: "A claim was released by its owner. Lock file unlinked."
    sources: [fno-loop, target, megawalk, megatron, hook]
    data:
      required: [key, holder, pid, host, acquired_at, duration_held_ms]
      properties:
        key:
          type: string
        holder:
          type: string
        pid:
          type: [integer, "null"]
        pid_unavailable:
          type: boolean
        host:
          type: string
        acquired_at:
          type: integer
        expires_at:
          type: integer
        duration_held_ms:
          type: integer
          description: "Milliseconds between acquire and release."
    consumers: [operator]

  - name: claim_refreshed
    retention: ephemeral
    description: "A TTL claim's expires_at was extended by its owner."
    sources: [fno-loop, target, megawalk, megatron]
    data:
      required: [key, holder, pid, host, acquired_at, expires_at]
      properties:
        key:
          type: string
        holder:
          type: string
        pid:
          type: [integer, "null"]
        pid_unavailable:
          type: boolean
        host:
          type: string
        acquired_at:
          type: integer
        expires_at:
          type: integer
        previous_expires_at:
          type: integer
          description: "expires_at before this refresh; null if was PID-liveness."
    consumers: [operator]

  - name: claim_stale_reclaimed
    retention: ephemeral
    description: "A stale claim was recovered by a new holder. Old file archived to .expired/."
    sources: [fno-loop, target, megawalk, megatron]
    data:
      required: [key, holder, pid, host, acquired_at, previous_holder, previous_pid]
      properties:
        key:
          type: string
        holder:
          type: string
          description: "New holder taking over."
        pid:
          type: [integer, "null"]
        pid_unavailable:
          type: boolean
        host:
          type: string
        acquired_at:
          type: integer
        expires_at:
          type: integer
        previous_holder:
          type: string
          description: "Holder whose claim was reclaimed."
        previous_pid:
          type: [integer, "null"]
          description: "PID of the dead/expired holder."
    consumers: [operator]

  - name: claim_force_overridden
    retention: ephemeral
    description: "Operator administratively dropped a claim regardless of owner."
    sources: [fno-loop, hook]
    data:
      required: [key, override_reason]
      properties:
        key:
          type: string
        override_reason:
          type: string
          description: "Non-empty rationale for the override."
        previous_holder:
          type: string
          description: "Holder before override; absent if key was already free."
        previous_pid:
          type: integer
          description: "PID before override; absent if key was already free."
    consumers: [operator]

  - name: claim_idempotent_reacquired
    retention: ephemeral
    description: "Same holder re-acquired a key it already owns (resume/restart path)."
    sources: [fno-loop, target, megawalk, megatron]
    data:
      required: [key, holder, pid, host, acquired_at, previous_acquired_at]
      properties:
        key:
          type: string
        holder:
          type: string
        pid:
          type: [integer, "null"]
        pid_unavailable:
          type: boolean
        host:
          type: string
        acquired_at:
          type: integer
        expires_at:
          type: integer
        previous_acquired_at:
          type: integer
          description: "acquired_at on the prior claim - now superseded by the refresh."
    consumers: [operator]

  - name: claim_rebound
    retention: ephemeral
    description: "A native target resume rebound a same-holder local claim whose prior PID was dead to the resumed durable PID (x-2ccd). Distinct from claim_idempotent_reacquired (a live same-holder refresh) and claim_stale_reclaimed (a new holder taking a stale claim)."
    sources: [fno-loop, target]
    data:
      required: [key, holder, pid, host, acquired_at, previous_pid, previous_state, mode]
      properties:
        key:
          type: string
        holder:
          type: string
          description: "Unchanged symbolic holder across the PID rebind."
        pid:
          type: [integer, "null"]
          description: "The resumed durable PID now anchoring the claim."
        pid_unavailable:
          type: boolean
        host:
          type: string
        acquired_at:
          type: integer
        expires_at:
          type: integer
        previous_pid:
          type: [integer, "null"]
          description: "The dead prior PID that proved the rebind was safe."
        previous_state:
          type: string
          description: "Claim state before rebind (live|suspect|stale)."
        mode:
          type: string
          description: "rebound = a dead prior PID was rebound to the resumed durable PID; idempotent = a live same-PID lease refresh."
        fno_id:
          type: string
          description: "Target run id from the manifest, when emitted by the resume path."
        harness:
          type: string
        harness_session_id:
          type: string
    consumers: [operator]

  - name: claim_reaped
    description: "GC archived one provably-dead claim to .expired/. Emitted only after a re-read confirms the source path is gone and the archive path exists."
    sources: [fno-loop]
    data:
      required: [key, holder, pid, host, acquired_at, root, age_ms]
      properties:
        key:
          type: string
        holder:
          type: string
        pid:
          type: [integer, "null"]
          description: "The new claim's pid; null when the new holder is pid_unavailable. The dead/reused pid that proved reapability rides previous_pid."
        pid_unavailable:
          type: boolean
        host:
          type: string
        acquired_at:
          type: integer
        expires_at:
          type: integer
        root:
          type: string
          description: "Which claims root (global or cwd-local) this file was reaped from."
        age_ms:
          type: integer
          description: "Milliseconds between acquired_at and reap time."
    consumers: [operator]

  - name: claim_reap_swept
    description: "One `fno agents claim reap --apply` run completed, including a run that reaped nothing. A silent sweep and a dead sweep must not look the same. Never fires for a dry-run: dry-run's own no-writes promise covers this event too."
    sources: [fno-loop]
    data:
      required: [scanned, reaped, would_reap, kept_live, kept_suspect, kept_offhost, corrupted, vanished, contended, reap_failed, apply, lock_mirror_cleared, roots]
      properties:
        scanned:
          type: integer
        reaped:
          type: integer
        would_reap:
          type: integer
          description: "Count that classified reapable but apply=False so nothing was written."
        kept_live:
          type: integer
        kept_suspect:
          type: integer
        kept_suspect_alive:
          type: integer
          description: "SUSPECT node claims the roster probe MEASURED as still worked: the holder's own row was found and reads engaged. A measurement, kept apart from its absence below."
        kept_suspect_unprobed:
          type: integer
          description: "SUSPECT node claims the roster probe could not answer for: no row resolved to the holder, or the roster itself did not read. Absence, never proof, so the claim is kept."
        kept_offhost:
          type: integer
        corrupted:
          type: integer
        vanished:
          type: integer
        contended:
          type: integer
          description: "Provably-dead but its recovery mutex was held by a genuine live recovery this round - still on disk, left for the next sweep."
        reap_failed:
          type: integer
          description: "Count of files that classified reapable but the post-archive re-read did not confirm the move."
        apply:
          type: boolean
        lock_mirror_cleared:
          type: integer
          description: "Graph entries whose locked_by/claimed_at mirror was cleared for reaped node claims. Default sweeps only: an explicit --root sweep owns someone else's claims tree, not this graph."
        roots:
          type: array
          items:
            type: string
    consumers: [operator]

  - name: claim_clock_skew_rejected
    retention: ephemeral
    description: "A refresh was rejected because computed expires_at landed in the past."
    sources: [fno-loop, target, megawalk, megatron]
    data:
      required: [key, now_ms, expires_at, reason]
      properties:
        key:
          type: string
        now_ms:
          type: integer
        expires_at:
          type: integer
        reason:
          type: string
    consumers: [operator]

  - name: session_satisfied
    description: "Signals that a target session's work is complete; alternative to <promise> tag emission. The stop hook scans for these and may auto-release the Stop hook when a fresh event matches the current session and the three-factor gates are still satisfied. Data.source is the constrained subsystem that produced the signal (check_pr, pr_merge, ci_watcher, fno_gate_manual, delegated); envelope source is the producer identity."
    sources: [target, megawalk, fno-loop, hook]
    data:
      required: [source, reason, session_id, gate_state_hash]
      properties:
        source:
          type: string
          enum: [check_pr, pr_merge, ci_watcher, fno_gate_manual, delegated]
          description: "Which constrained subsystem emitted this satisfaction signal"
        reason:
          type: string
          description: "Human-readable reason"
        evidence_url:
          type: string
          description: "Optional PR URL, review URL, CI URL"
        session_id:
          type: string
          description: "The target session id this satisfies"
        gate_state_hash:
          type: string
          description: "md5 of target-state.md at emit time. Stop hook ignores stale events whose hash no longer matches. For trigger=delegated this is audit-only: the close mechanism is manifest archival (not hash matching) because target-state.md no longer exists post-handoff."
    consumers: [hooks/target-stop-hook.sh]

  - name: auto_complete_triggered
    description: "The stop hook fired the auto-complete path based on a matching session_satisfied event. Audit-only record so the post-hoc review can count which auto-complete signals actually fired."
    sources: [hook]
    data:
      required: [source, session_id]
      properties:
        source:
          type: string
          enum: [check_pr, pr_merge, ci_watcher, fno_gate_manual, delegated]
          description: "Which session_satisfied data.source triggered this auto-complete"
        session_id:
          type: string
          description: "The target session id that auto-completed"
    consumers: [audit]

  - name: capture_add
    description: "An item was captured into the backlog capture tier (fu-* items below idea nodes; `fno backlog capture add`). Third honesty factor for the deferrals_captured gate: one capture_add OR capture_empty_pass per session satisfies factor 3 (legacy inbox_add/inbox_empty_pass rows also count)."
    sources: [backlog, target, hook]
    data:
      required: [session_id, fu_id]
      properties:
        session_id:
          type: string
          description: "target session id (or 'manual' when run standalone from a terminal)."
        fu_id:
          type: string
          description: "The minted fu-XXXXXX shortcode."
        title:
          type: string
        priority:
          type: string
          description: "p0|p1|p2|p3."
    consumers: [hooks/target-stop-hook.sh, scripts/lib/gate-audit.sh, scripts/lib/gates-reality.sh]

  - name: capture_empty_pass
    description: "An honest empty deferrals pass: nothing worth capturing this session. Satisfies the deferrals_captured gate's third factor without fabricating entries."
    sources: [backlog, target, hook]
    data:
      required: [session_id, reason]
      properties:
        session_id:
          type: string
        reason:
          type: string
          description: "Why nothing was captured (mandatory; anti-rubber-stamp)."
        scan_candidates:
          type: integer
          description: "Count of candidate lines the mechanical scan found. >0 with an empty-pass is an auditable yellow flag, not a hard block."
    consumers: [hooks/target-stop-hook.sh, scripts/lib/gate-audit.sh, scripts/lib/gates-reality.sh]

  - name: capture_scan
    description: "A mechanical regex pre-filter ran over a transcript and returned candidate deferral snippets. Telemetry; lets the audit record whether a scan preceded an empty-pass."
    sources: [backlog, target, hook]
    data:
      required: [session_id, candidates]
      properties:
        session_id:
          type: string
        candidates:
          type: integer
          description: "Number of candidate lines returned."
    consumers: [scripts/lib/gate-audit.sh]

  - name: capture_promote
    description: "A capture-tier fu-* item was promoted to a graph node (idea or full). The checkbox is struck with -> ab-XXXXXXXX."
    sources: [backlog]
    data:
      required: [fu_id, node_id]
      properties:
        fu_id:
          type: string
        node_id:
          type: string
          description: "The ab-XXXXXXXX graph node created by promotion."
    consumers: [audit]

  - name: capture_dismiss
    description: "A capture-tier fu-* item was dismissed (struck [-], never deleted, preserving autocorrect provenance)."
    sources: [backlog]
    data:
      required: [fu_id, reason]
      properties:
        fu_id:
          type: string
        reason:
          type: string
    consumers: [audit]

  - name: capture_tidy
    description: "An `fno backlog capture tidy` pass ran: ejected completed filed nodes to the archive, normalized separators, and rebuilt the pinned digest. Telemetry; lets the audit record when the capture tier was last swept."
    sources: [backlog]
    data:
      required: [session_id, ejected]
      properties:
        session_id:
          type: string
          description: "target session id (or 'manual' when run standalone from a terminal)."
        ejected:
          type: integer
          description: "Count of completed filed-node lines swept to inbox-archive.md this pass."
    consumers: [audit]

  - name: inbox_add
    description: "DEPRECATED, renamed capture_add: emitted only by pre-rename binaries; kept so append-only history always validates. An item was captured into the capture tier below idea nodes."
    sources: [backlog, target, hook]
    data:
      required: [session_id, fu_id]
      properties:
        session_id:
          type: string
          description: "target session id (or 'manual' when run standalone from a terminal)."
        fu_id:
          type: string
          description: "The minted fu-XXXXXX shortcode."
        title:
          type: string
        priority:
          type: string
          description: "p0|p1|p2|p3."
    consumers: [hooks/target-stop-hook.sh, scripts/lib/gate-audit.sh]

  - name: inbox_empty_pass
    description: "DEPRECATED, renamed capture_empty_pass: emitted only by pre-rename binaries; kept so append-only history always validates. An honest empty deferrals pass."
    sources: [backlog, target, hook]
    data:
      required: [session_id, reason]
      properties:
        session_id:
          type: string
        reason:
          type: string
          description: "Why nothing was captured (mandatory; anti-rubber-stamp)."
        scan_candidates:
          type: integer
          description: "Count of candidate lines the mechanical scan found. >0 with an empty-pass is an auditable yellow flag, not a hard block."
    consumers: [hooks/target-stop-hook.sh, scripts/lib/gate-audit.sh]

  - name: inbox_scan
    description: "DEPRECATED, renamed capture_scan: emitted only by pre-rename binaries; kept so append-only history always validates."
    sources: [backlog, target, hook]
    data:
      required: [session_id, candidates]
      properties:
        session_id:
          type: string
        candidates:
          type: integer
          description: "Number of candidate lines returned."
    consumers: [scripts/lib/gate-audit.sh]

  - name: inbox_promote
    description: "DEPRECATED, renamed capture_promote: emitted only by pre-rename binaries; kept so append-only history always validates."
    sources: [backlog]
    data:
      required: [fu_id, node_id]
      properties:
        fu_id:
          type: string
        node_id:
          type: string
          description: "The ab-XXXXXXXX graph node created by promotion."
    consumers: [audit]

  - name: inbox_dismiss
    description: "DEPRECATED, renamed capture_dismiss: emitted only by pre-rename binaries; kept so append-only history always validates."
    sources: [backlog]
    data:
      required: [fu_id, reason]
      properties:
        fu_id:
          type: string
        reason:
          type: string
    consumers: [audit]

  - name: inbox_tidy
    description: "DEPRECATED, renamed capture_tidy: emitted only by pre-rename binaries; kept so append-only history always validates."
    sources: [backlog]
    data:
      required: [session_id, ejected]
      properties:
        session_id:
          type: string
          description: "target session id (or 'manual' when run standalone from a terminal)."
        ejected:
          type: integer
          description: "Count of completed filed-node lines swept to inbox-archive.md this pass."
    consumers: [audit]

  - name: worktree_overlap_observed
    description: "A SessionStart carrier observed at least one other session with a fresh worktree-local liveness stamp. Advisory-only: it proves concurrent recent activity, not simultaneous writes, ownership, or harm. Written to the machine-global journal so it survives worktree cleanup; consumed by `fno workspace worktree overlaps` for recurrence reporting. Harness identity may ride as optional diagnostic metadata but never shapes the predicate, the observation id, or the recurrence threshold."
    sources: [hook]
    data:
      required: [observation_id, repository_key, worktree_key, observer_session_id, peer_session_ids, live_window_seconds]
      properties:
        observation_id:
          type: string
          description: "Deterministic sha256 digest of repository_key, worktree_key, observer_session_id, and the sorted peer_session_ids. The dedup and recurrence key."
        repository_key:
          type: string
          description: "Normalized absolute common Git directory; a local machine identity for the repository, not current ownership truth."
        worktree_key:
          type: string
          description: "Normalized absolute worktree Git administrative directory."
        observer_session_id:
          type: string
          description: "The session receiving the advisory."
        peer_session_ids:
          type: array
          items: { type: string }
          description: "Sorted non-empty fresh peer identities observed in the fixed liveness window."
        live_window_seconds:
          type: integer
          description: "The reader window that classified the peers as fresh (120)."
        harness:
          type: string
          description: "Optional diagnostic: the observer harness (claude|codex). Never participates in the predicate, observation id, or recurrence threshold."
    consumers: [fno workspace worktree overlaps]

# ---------------------------------------------------------------------------
# W7 additive: Rust fno-agents supervisor event kinds.
# These are emitted by the Rust daemon/workers to events.jsonl with kind
# (not type) and source daemon or worker:<id>. They are documented here so
# the Python/bash validators stop treating them as undocumented events.
# No existing entry above is modified.
# ---------------------------------------------------------------------------

  - name: daemon_started
    description: "fno-agents daemon process started and initialized successfully."
    sources: [daemon]
    data:
      required: []
      properties:
        pid:
          type: integer
          description: "Daemon process ID."
        version:
          type: string
          description: "Binary version string."

  - name: daemon_exited
    description: "fno-agents daemon process exited (clean shutdown or crash)."
    sources: [daemon]
    data:
      required: []
      properties:
        reason:
          type: string
          description: "Exit reason (e.g. 'sigterm', 'idle', 'error')."

  - name: daemon_idle_pending_exit
    description: "Daemon has no live agents and is counting down to idle exit."
    sources: [daemon]
    data:
      required: []
      properties: {}

  - name: daemon_shutting_down
    description: "Daemon received shutdown signal and is winding down."
    sources: [daemon]
    data:
      required: []
      properties:
        reason:
          type: string

  - name: daemon_socket_lost
    description: "Socket path no longer resolves to the inode this daemon bound, so it is unreachable and retires."
    sources: [daemon]
    data:
      required: []
      properties:
        reason:
          type: string

  - name: daemon_state
    description: "Periodic daemon health snapshot (agent count, memory, etc.)."
    sources: [daemon]
    data:
      required: []
      properties:
        state:
          type: object
          description: "Arbitrary daemon state snapshot."

  - name: agent_spawned
    retention: durable
    description: "A new PTY-managed agent worker process was spawned."
    sources: [daemon]
    data:
      required: []
      properties:
        name:
          type: string
        short_id:
          type: string
        provider:
          type: string
        pid:
          type: integer
        # Parent-edge provenance (x-30f6): the spawning session's ambient env,
        # captured at launch so a worker can be traced BACK to the conversation
        # that decided to spawn it. All optional; absent for legacy spawns.
        spawned_by_session:
          type: string
          description: "Parent session id (e.g. CLAUDE_CODE_SESSION_ID) ambient at spawn time."
        spawned_by_harness:
          type: string
          description: "Parent harness: claude | codex | gemini (from env)."
        spawned_by_cwd:
          type: string
          description: "Parent cwd, used by the per-harness transcript-path resolver."

  - name: agent_stopped
    description: "An agent was stopped (graceful SIGTERM sequence completed)."
    sources: [daemon]
    data:
      required: []
      properties:
        name:
          type: string
        short_id:
          type: string
        reason:
          type: string

  - name: agent_exited
    description: "An agent worker process exited (child process exit detected)."
    sources: [subagent]
    data:
      required: []
      properties:
        name:
          type: string
        short_id:
          type: string
        exit_code:
          type: integer

  - name: agent_removed
    description: "An agent registry entry was removed (fno-agents rm)."
    sources: [daemon]
    data:
      required: []
      properties:
        name:
          type: string
        short_id:
          type: string
        registry_removed:
          type: boolean
        harness:
          type: string
        harness_row_id:
          type: [string, "null"]
        harness_removed:
          type: [boolean, "null"]
        harness_reason:
          type: [string, "null"]
        pane_session:
          type: [string, "null"]
        pane_id:
          type: [integer, "null"]
        pane_removed:
          type: [boolean, "null"]
        pane_reason:
          type: [string, "null"]

  - name: agent_inconsistent
    description: "Agent state is inconsistent (missing state.json, unexpected status, etc.)."
    sources: [daemon]
    data:
      required: []
      properties:
        name:
          type: string
        short_id:
          type: string
        reason:
          type: string
          description: "Inconsistency reason (e.g. missing_state_json, daemon_restart)."

  - name: agent_ask_done
    description: "An fno-agents ask RPC completed; agent replied."
    sources: [daemon]
    data:
      required: []
      properties:
        name:
          type: string
        short_id:
          type: string
        duration_ms:
          type: integer

  - name: channel_registered
    description: "An MCP channel was registered for an agent."
    sources: [daemon]
    data:
      required: []
      properties:
        name:
          type: string
        mcp_channel_id:
          type: string
        backend:
          type: string

  - name: inside_leg_report
    description: "Signal that an inside-leg state push (E3.2) was stored. Carries session_id/seq/state; the full stored report (reason/ttl_ms/received_at) lives on the matching claude registry row, which is the audit source -- this event is not a reconstruction record."
    sources: [daemon]
    data:
      required: [session_id, seq, state]
      properties:
        session_id:
          type: string
        seq:
          type: integer
        state:
          type: string
          enum: [working, blocked, done]

  - name: inside_leg_report_dropped
    description: "An inside-leg report was dropped without storing it (stale seq, unknown session, or the early-push buffer was full)."
    sources: [daemon]
    data:
      required: [session_id, seq, reason]
      properties:
        session_id:
          type: string
        seq:
          type: integer
        reason:
          type: string
          enum: [stale_seq, unknown_session, buffer_full]
        last_seq:
          type: integer

  - name: inside_leg_report_buffered
    description: "Buffer-on-early-push (E3.3): a report arrived before its session's registry row existed and was held in the bounded pending buffer, to be flushed onto the row at creation."
    sources: [daemon]
    data:
      required: [session_id, seq, state]
      properties:
        session_id:
          type: string
        seq:
          type: integer
        state:
          type: string
          enum: [working, blocked, done]

  - name: inside_leg_buffer_flushed
    description: "Buffer-on-early-push (E3.3): a buffered early-push report was flushed onto its session's registry row at row creation."
    sources: [daemon]
    data:
      required: [name, session_id, state, seq]
      properties:
        name:
          type: string
        session_id:
          type: string
        state:
          type: string
          enum: [working, blocked, done]
        seq:
          type: integer

  - name: inside_leg_completed
    description: "Ordered exit teardown (E3.3, AC-X2-4): a claude row carrying an inside-leg report is transitioning to Exited. Emitted BEFORE the registry write clears the report, so list/waiters observe the final state before the badge goes blank."
    sources: [daemon]
    data:
      required: [name, final_state, seq]
      properties:
        name:
          type: string
        session_id:
          type: string
        final_state:
          type: string
          enum: [working, blocked, done]
        seq:
          type: integer

  - name: drive_attached
    description: "An interactive drive window was opened for an agent."
    sources: [daemon]
    data:
      required: []
      properties:
        name:
          type: string
        short_id:
          type: string
        mode:
          type: string
          description: "Drive mode (interactive/watch/step/paranoid)."

  - name: drive_detached
    description: "An interactive drive window was closed cleanly."
    sources: [daemon]
    data:
      required: []
      properties:
        name:
          type: string
        short_id:
          type: string

  - name: drive_crashed
    description: "An interactive drive window was lost unexpectedly (heartbeat timeout, daemon restart, etc.)."
    sources: [daemon]
    data:
      required: []
      properties:
        name:
          type: string
        short_id:
          type: string
        reason:
          type: string

  - name: reconcile_error
    description: "An error occurred during the agent reconcile sweep."
    sources: [daemon]
    data:
      required: []
      properties:
        error:
          type: string
        name:
          type: string

  - name: event_payload_too_large
    description: "A Rust-emitted event payload exceeded MAX_EVENT_PAYLOAD_BYTES (500). The oversized event is replaced by this meta-event so the intended_kind is still visible to auditors."
    sources: [daemon, subagent]
    data:
      required: []
      properties:
        intended_kind:
          type: string
          description: "The event kind that would have been emitted."
        size:
          type: integer
          description: "Serialized payload size in bytes."

  # W7 fix: 12 additional kinds found by sigma-review audit (emitted at call
  # sites in daemon.rs/drive.rs but missing from the initial W7 block).

  - name: agent_create_no_session
    description: "Worker process spawned but its Unix socket did not appear within 10s; agent was never contactable."
    sources: [daemon]
    data:
      required: []
      properties:
        name:
          type: string
        short_id:
          type: string

  - name: agent_orphan_reaped
    description: "An orphaned agent (live PID, no registry entry) was killed during the recovery sweep."
    sources: [daemon]
    data:
      required: []
      properties:
        short_id:
          type: string
        pid:
          type: integer

  - name: agent_row_reaped
    description: "An agent-view row was removed by the dead-row GC sweep or `fno agents reap`: a terminal/dead row past grace with corroboration (confirmed-dead pid, positively-stale transcript, or its session gone from its OWN harness's store), an absolute-age backstop removal, or a live-but-done row (idle past grace, transcript tail classifies done) which carries resumable: true so a dormant distinction can be rendered later. For a convention-named target/reconcile worker, node_id plus termination_event make a pre-claim death durable; no-termination reaps also emit node_failed for failure-streak accounting (x-5c08). Distinct from agent_orphan_reaped: this removes the ROW, not just flips a PID to exited."
    sources: [daemon]
    data:
      required: []
      properties:
        short_id:
          type: string
        name:
          type: string
        node_id:
          type: [string, "null"]
        session_id:
          type: [string, "null"]
        termination_event:
          type: boolean
        harness:
          type: string
          description: "The reaped row's harness identity (claude/codex/...), so the reap is attributable to the store that judged it."
        harness_session_id:
          type: [string, "null"]
          description: "The row's session id in its own harness's store. With harness, the resumable handle for a dormant reap; also the join key for correlating a reap with the harness's own session records."
        resumable:
          type: boolean
          description: "True only for a live-but-done (dormant) reap: the session finished its turn rather than dying, and the handle above can resume it."
        cascade_refused:
          type: [object, "null"]
          description: "When the post-reap cascade into the harness's own session store refused or failed: {id, reason}. Never swallowed, and never rolls back the registry reap."
        node_session_cleared:
          type: boolean
          description: "True only after the exact open node do-row was positively settled by the observer cascade."
        node_row_removed:
          type: [boolean, "null"]
          description: "Whether the observer cascade removed an open row; false means it was already settled."
        node_status_before:
          type: [string, "null"]
        node_status_after:
          type: [string, "null"]
        node_remaining_open_do:
          type: [integer, "null"]

  - name: worktree_sweep
    description: "One repo's reading from the daemon's 24h worktree report sweep (x-5a30): what `fno workspace worktree cleanup --merged` WOULD archive. Report-only by construction, because a merged PR is external proof that work landed and a timer tick is not; removal stays on the merge-triggered path gated by post_merge.self_reap. Emitted for every repo including those reading zero, so a quiet repo is never mistaken for a sweep that did not run. `error: unreadable-summary` when the verb's Summary line could not be parsed, since a zeroed report is indistinguishable from a clean machine."
    sources: [daemon]
    data:
      required: []
      properties:
        repo:
          type: string
        eligible:
          type: integer
        kept:
          type: integer
        dirty:
          type: integer
        mode:
          type: string
        error:
          type: string

  - name: bg_worker_terminal_stopped
    description: "A fire-and-forget `claude --bg` /target|/think worker that finalize marked terminal was `claude stop`ped by the daemon terminal-stop sweep, so its slot frees instead of parking at an idle prompt forever (x-fcbf)."
    sources: [daemon]
    data:
      required: []
      properties:
        short_id:
          type: string
        session_id:
          type: string
        reason:
          type: string

  - name: agent_orphan_state_archived
    description: "An orphaned agent's state directory was archived to the orphan archive path before removal."
    sources: [daemon]
    data:
      required: []
      properties:
        short_id:
          type: string
        archived_to:
          type: string

  - name: agent_spawn_failed
    description: "The agent worker process could not be launched (binary not found, exec error, etc.)."
    sources: [daemon]
    data:
      required: []
      properties:
        name:
          type: string
        reason:
          type: string
        detail:
          type: string

  - name: agent_spawn_cwd_fallback
    description: "A spawn/ask request reached the daemon with no cwd, so the worker was launched in a neutral temp dir instead of the caller's project. Signals a misbehaving client (the client should always forward cwd); the launch lands in /tmp rather than silently adopting the daemon's own start dir."
    sources: [daemon]
    data:
      required: []
      properties:
        name:
          type: string
        fallback:
          type: string
        via:
          type: string

  - name: agent_stream_claim_unavailable
    description: "The claude stream-json adopt front door could not consult the single-writer claim substrate (no `fno` on PATH / exec error / unparseable output) before spawning, so the adopt proceeded fail-open. The registry one-host re-check under the lock is the authoritative in-daemon guard; this event makes the degraded path greppable."
    sources: [daemon]
    data:
      required: []
      properties:
        name:
          type: string
        session_uuid:
          type: string
        detail:
          type: string

  - name: agent_deliver_injected
    description: "A deliver RPC successfully injected a message into an agent's PTY via bracketed paste (US4)."
    sources: [daemon]
    data:
      required: []
      properties:
        name:
          type: string
          description: "Registry name of the target agent."
        from_name:
          type: string
          description: "Sender name as it appears in the provenance container."
        provider:
          type: string
          description: "Provider of the target agent (codex or gemini)."

  - name: agent_deliver_demoted
    description: "A deliver RPC could not inject into the agent's PTY and demoted delivery to durable (worker unreachable, US4)."
    sources: [daemon]
    data:
