        agent:
          type: string
        holder:
          type: string
        session_uuid:
          type: string

  - name: drive_takeover_after_stale
    description: "A new drive session took over from a stale session (heartbeat expired)."
    sources: [daemon]
    data:
      required: []
      properties:
        stale_session_id:
          type: string
        new_session_id:
          type: string
        agent:
          type: string

  - name: drive_watch_input_rejected
    description: "Input was rejected in watch-mode drive (watch mode is read-only)."
    sources: [daemon]
    data:
      required: []
      properties:
        agent:
          type: string
        session_id:
          type: string

  - name: reconcile_deferred
    description: "One or more agents were deferred during the reconcile sweep (budget or liveness limit reached)."
    sources: [daemon]
    data:
      required: []
      properties:
        remaining_count:
          type: integer

  - name: reconcile_done
    description: "The reconcile sweep completed."
    sources: [daemon]
    data:
