# Single owner of the per-agent registry schema version. build.rs renders the
# Rust constant (state.rs include!s $OUT_DIR/registry_schema.rs) and projects
# this file byte-for-byte to cli/src/fno/agents/registry_schema.toml, which
# registry.py reads as package data. Bump `version` here and rebuild: both
# languages move together, so there is no second constant to drift.
#
# v27: additive `launch_account_source` - WHO chose the row's
# `launch_account`: "caller" (a flag on this spawn's argv) or "config"
# (accounts.quota.pick_on_launch picked it). None on every other row:
# launch_account "default" already says nobody chose, a revive inherits the
# source row's stamp, and mints that cannot attribute stay silent. Rationale
# lives beside the column in state.rs / registry.py.
#
# v28: additive `adopted_by_session` - the session that VOUCHED for
# an adopted row. LD3 splits one field's two meanings: `spawned_by_session`
# keeps "who spawned this row, whose share pays for it", and the adoption
# grantor moves here, so crowning can never re-attribute a row's cost.
# Rationale lives beside the column in state.rs / registry.py.
# v29: additive `resolved_sandbox` / `granted_writable_roots` - what a codex
# thread row's sandbox RESOLVED to server-side, and the roots it carries onto
# every turn. v19's `sandbox_posture` records the REQUEST, which a resume
# re-applies; the request and the outcome disagree on this lane, so a row that
# carries only the request cannot answer what the worker could write.
# Rationale lives beside the column in state.rs / registry.py.
#
# v30 adds the effective git common-dir grant for Codex threads. Rationale
# lives beside the column in state.rs / registry.py.
#
# v31: additive `harness_args` - the fenced `--` tokens a codex thread spawn
# carried, re-parsed onto thread/resume after a daemon restart. Rationale
# lives beside the column in state.rs / registry.py.
#
# v32: additive `stop` - fno's own stop of a worker (the stop verb and the
# terminal-stop sweep), so the harness `stopped` state it leaves behind is
# never read as finished work by the retirement sweep. The bump is
# writer-protection, the same reason v16/v22 bumped: a pre-v32 writer would
# accept the unknown key and erase the stamp on its next read-modify-write,
# after which a worker fno stopped retires as finished.
#
# v33: additive `lineage_reason` - why a mint with no parent session could
# not name one. The rule: an origin=spawn row carries `spawned_by_session`
# or a non-empty `lineage_reason`, never neither; a daemon mint reads the
# parent from the spawn REQUEST, so an edge-less request stamps the reason
# instead of a silent null. Same additive-optional writer-protection
# rationale as v28: a pre-v33 writer accepts the unknown key and erases it
# on its next read-modify-write. Rationale lives beside the column in
# state.rs / registry.py. v33 also adds `spawn_id` and structured
# `spawn_provenance` - the coordinator's spawn-attempt id and the validated
# origin+owner record every new birth carries; `spawned_by_*` become
# generated compatibility fields derived from the origin at mint.
#
# v34: additive `lineage_kind` - a served fact, `child` or `peer`, derived
# by `spawn_edge::lineage_kind` and written only by the liveness sweep, so
# readers that cannot link fno-agents render the edge without re-deriving
# it. Absent on rows with no spawn edge. Rationale lives beside the column
# in state.rs / registry.py.
# v35: additive `requested_permission_mode` and `turn_policy_source` on the
# codex thread posture record. `requested_permission_mode` is the operator's
# exact permission_mode string, which a resume replays; `sandbox_posture`
# alone could not tell `read-only:on-request` from `read-only:never`.
# `turn_policy_source` names where the current turn's sandboxPolicy came
# from - "resolved" (echoed server posture) or "requested" (replayed row
# request) - so requested, resolved and current-turn stay three
# distinguishable readings. Same additive-optional writer-protection
# rationale as v22 through v34: a pre-v35 writer accepts the unknown keys
# through serde and erases them on its next read-modify-write, so the bump
# turns a silent erasure into a loud refusal. Rationale lives beside the
# columns in state.rs / registry.py.
# v36: additive `node_reason`, the receipt for a named-but-unresolvable node; rationale in state.rs.
#
# `fields` pins the sorted serde (wire) names of every RegistryEntry field at
# this version. The equal-version trap this closes: PR 2090 minted v33 for
# lineage_reason and PR 2091 then added spawn_id/spawn_provenance AT v33
# without a bump, so an fno built between the two merges called itself v33,
# read v33-with-spawn_id rows as its own version, and Python's strict reader
# refused the whole registry ("row N has malformed shape"), taking down every
# crowned king's checkin. The Rust unit test `registry_schema_fields` (state
# tests) and scripts/ci/check-registry-schema-bump.sh both read this array:
# any field-set change without a monotonic version bump is refused at test
# time and at PR time. Add the field, add its name here, bump `version` - in
# that order, in one PR.
fields = ["account_record_id", "adopted_by_session", "aliases", "cc_session_id", "claude_session_uuid", "claude_short_id", "codex_session_id", "created_at", "crown_grantor", "crown_level", "crown_scope", "cwd", "delivery_policy", "effort", "exited_at", "fno_id", "forked_from_session_id", "gemini_session_id", "git_grant", "granted_writable_roots", "harness", "harness_args", "harness_session_id", "harness_title", "host_mode", "inside_leg", "keeper_child_pid", "last_message_at", "last_reconciled_at", "launch_account", "launch_account_source", "legacy_provider", "lineage_kind", "lineage_reason", "liveness", "liveness_measured_at", "log_path", "mcp_channel_id", "messaging_socket_path", "model", "model_basis", "model_name", "mux", "name", "node", "node_reason", "origin", "pending_session_row", "pid", "pid_start_time", "predecessor_session_ids", "project_root", "provider", "related_session_id", "requested_effort", "requested_model", "requested_permission_mode", "requested_provider", "resolved_sandbox", "route_provider_id", "route_settings_path", "sandbox_posture", "screen_state", "session_id", "short_id", "spawn_id", "spawn_provenance", "spawn_trigger", "spawned_by_cwd", "spawned_by_harness", "spawned_by_session", "status", "stop", "substrate", "turn_policy_source"]
version = 36
