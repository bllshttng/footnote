# CANONICAL. Two gated copies hang off this file: cli/src/fno/agents/harness_capabilities.toml
# (generated by crates/fno-agents/build.rs) and crates/fno/src/harness_capabilities.toml
# (hand-synced; the fno crate embeds it with include_str!). Edit this file, then
# resync BOTH copies, not just the first:
#   bash scripts/ci/check-harness-capabilities-fresh.sh --write
# scripts/ci/check-harness-capabilities-fresh.sh fails CI when any copy differs.
map_version = 13

[harness.claude]
permission_bypass = ["--dangerously-skip-permissions"]
resume = "native-session"
thread = true
autonomous_pane = false
route_on_pane = true
# LOOP PARTICIPATION. Can the fno target loop CLOSE on this harness?
#
# hooks/target-stop-hook.sh shims `fno-agents loop-check`, which decides stop or
# allow from external truth. No lifecycle boundary means no loop-check
# invocation, which means no loop, however well the harness spawns, resumes and
# receives mail. Three members:
#
#   "native"     a shell hook fires at the lifecycle boundary and can invoke
#                loop-check today
#   "extension"  the harness exposes no shell hook. The loop is reachable only
#                through a harness-native plugin fno ships, named by
#                `loop_extension`. An EMPTY `loop_extension` means fno ships
#                none yet, so a looping dispatch is refused rather than left to
#                hang with nothing to stop it
#   "none"       no boundary is exposed at all; a looping dispatch is refused
#
# This field REPLACES `stop_hook`, which read "native" on every row that ever
# carried it and had zero behavioral consumers. One value across every row is
# not a measurement. It is one declaration inherited five times, the shape
# already proved on send_keys_enter_delay_ms, where four of five harnesses
# carried one unrevisited default and every receipt read delivered while a
# composer piled up. The provenance was written down beside the old field: a
# 2026-07-13 docstring verified THREE harnesses and six rows ended up carrying
# the value.
#
# Every value below is measured, per harness, against the artifact and the
# wiring that reaches it - never against the word "native" in a table. Two of
# the five inherited rows were wrong.
#
# claude, measured 2026-08-28: hooks/hooks.json declares a `Stop` group whose
# command is hooks/target-stop-hook.sh, which shells loop-check.
loop_participation = "native"
loop_extension = ""
command_surface = "slash"
slash_prefix = ""
ready_marker = "live_prompt_box"
ready_rule_ids = ["live_prompt_box", "osc_title_idle"]
manifest_rules = [
  { id = "live_prompt_box", state = "idle" },
  { id = "osc_title_idle", state = "idle" },
  { id = "permission_prompt", state = "blocked" },
]
send_keys_enter_delay_ms = 800
submit_keys = ["enter"]
stop_strategy = "claude-short-id"
remove_strategy = "claude-short-id"
session_binding = { strategy = "preassigned-or-session-start", required = true, timeout_ms = 60000 }

# How each harness and substrate stands toward the fno state root. One of:
#
#   "<carrier>"    the lane is sandboxed and this names how the grant travels
#   "unsandboxed"  MEASURED to need no carrier: the worker runs with the user's
#                  own permissions, so nothing restricts its state-root writes
#   "unmeasured"   nobody has measured this lane. It is NOT refused, because
#                  refusing on an unmeasured premise is the same guess in the
#                  other direction; the caller gets the stderr note that
#                  writable_dirs.py already prints
#
# The spawn gate refuses only an ABSENT key, meaning a lane nobody declared at
# all. That keeps a newly added lane loud on day one without converting a
# working spawn into a refused one.
#
# The trigger is deliberately not "declares no carrier". Epic rule R3 refuses a
# process DENIED its declared root, and a lane that runs under no sandbox is
# never denied anything. Measured 2026-08-28: an opencode PANE worker acquired
# a claim and delivered mail with no grant at all, so refusing it would have
# broken a lane that works.
[harness.claude.state_root_grant]
# `--add-dir`, spent by `claude_ask::build_argv` on every claude substrate.
pane = "argv-add-dir"
thread = "argv-add-dir"
headless = "argv-add-dir"

[harness.claude.permission_response.allow_once]
supported = true
rule_ids = ["permission_prompt"]
keys = ["1"]

[harness.claude.permission_response.allow_always]
supported = true
rule_ids = ["permission_prompt"]
keys = ["2"]

[harness.claude.permission_response.deny]
supported = true
rule_ids = ["permission_prompt"]
keys = ["3"]

[harness.claude.resume_strategy.forms.interactive_create]
kind = "session_flag"
tokens = ["claude", "--session-id", "{session_id}"]

[harness.claude.resume_strategy.forms.interactive_resume]
kind = "flag"
tokens = ["claude", "--resume", "{session_id}"]

[harness.claude.resume_strategy.forms.interactive_attach]
kind = "subcommand"
tokens = ["claude", "attach", "{short_id}"]

[harness.claude.resume_strategy.forms.headless_create]
kind = "flag"
tokens = ["claude"]

[harness.claude.resume_strategy.forms.headless_resume]
kind = "flag"
tokens = ["claude", "-p", "--resume", "{session_id}"]

[harness.claude.model_switch_strategy]
kind = "direct"
tokens = ["/model {model}", "/effort {effort}"]
effort_labels = {}
status_command = "/status"
status_pattern = 'Model:\s+(?P<model>\S+).*?(?:reasoning|effort)\s+(?P<effort>minimal|low|medium|high|xhigh|max)'

[harness.codex]
permission_bypass = ["--dangerously-bypass-approvals-and-sandbox"]
resume = "native-thread"
# A codex thread lives on the SHARED `codex app-server daemon`, which owns it.
# So it survives mux death AND `fno-agents-daemon` death: neither process
# holds it. The bit was first flipped for mux survival alone, when the lane
# forked a private app-server per worker as a child of `fno-agents-daemon`.
# That child did survive mux death and did not obviously survive its own
# parent's, so the bit promised more than it delivered; measured 2026-08-27,
# corrected 2026-08-28 (docs/architecture/codex-thread-driver.md).
thread = true
autonomous_pane = true
route_on_pane = false
# codex, measured 2026-08-28: hooks/codex-hooks.json declares a `Stop` group
# whose command is hooks/target-stop-hook.sh, the same adapter claude wires.
loop_participation = "native"
loop_extension = ""
command_surface = "codex-skill"
# The codex TUI's own slash verbs, measured 2026-09-01. The verb normalizer
# rewrites a leading-slash token on this surface only when it names a shipped
# footnote verb AND is not one of these, so a native verb driven through a
# spawn or dispatch reaches the TUI verb instead of a footnote skill that does
# not exist. `review` is the collision case - it is both, and the bare
# spelling stays native; the fno lane is reached namespaced, as /fno:review.
native_verbs = ["/review", "/code-review", "/model", "/status", "/compact"]
# The subset the shared app-server daemon maps to its review/start RPC. Every
# other native verb has no prompt line on a daemon thread, and the mail lane
# refuses it by name.
review_verbs = ["/review", "/code-review"]
ready_marker = "idle_prompt"
ready_rule_ids = ["idle_prompt"]
manifest_rules = [
  { id = "idle_prompt", state = "idle" },
  { id = "approval_prompt", state = "blocked" },
]
# Measured 2026-08-23 on a live mux pane (x-4b0b): floor 0. Every D in
# {0,100,200,400,800} ms, 3 trials each, submitted both idle and mid-turn,
# payloads 0.7-2.0 KB, codex-cli 0.148.0; confirmed by probe token in the
# rollout transcript. The operator pile-up (six queued envelopes, table read
# 0) did NOT reproduce, so 800 is a margin, not a floor: it matches the
# claude row and CR_SETTLE_MS (mux pane send --submit), the two shipped
# settles never observed to lose a CR. Do not lower without a repro.
send_keys_enter_delay_ms = 800
submit_keys = ["enter"]
stop_strategy = "registry-noop"
remove_strategy = "codex-session-index"
session_binding = { strategy = "rollout-fd-or-daemon", required = true, timeout_ms = 60000 }

[harness.codex.state_root_grant]
# pane/headless spend `--add-dir` (writable_dirs.ADD_DIR_PROVIDERS). The thread
# lane builds NO argv - it sends JSON-RPC to a shared app-server - so its only
# carrier is a protocol field. Measured against the live daemon on 2026-08-28:
# `thread/start` takes only the scalar `sandbox` enum and IGNORES a
# `sandboxPolicy` object without erroring, while `turn/start` honors
# `sandboxPolicy.writableRoots`. docs/architecture/codex-thread-driver.md
# records the measurement and the frames it came from.
pane = "argv-add-dir"
thread = "turn-start-sandbox-policy"
headless = "argv-add-dir"

[harness.codex.permission_response.allow_once]
supported = true
rule_ids = ["approval_prompt"]
keys = ["1"]

[harness.codex.permission_response.allow_always]
supported = true
rule_ids = ["approval_prompt"]
keys = ["2"]

[harness.codex.permission_response.deny]
supported = true
rule_ids = ["approval_prompt"]
keys = ["3"]

[harness.codex.resume_strategy.forms.interactive_create]
kind = "subcommand"
tokens = ["codex"]

[harness.codex.resume_strategy.forms.interactive_resume]
kind = "subcommand"
tokens = ["codex", "resume", "{session_id}"]

# `codex resume <id>` execs codex's OWN TUI on a thread the shared app-server
# daemon holds. fno renders nothing.
#
# `pre_exec` starts the daemon and `--remote unix://` asserts that it did.
# Measured 2026-08-29 against codex-cli 0.149.1 with the marker the vendor
# itself produces: session 01a0398f (a rollout on disk from 2026-08-25) was
# ABSENT from `thread/loaded/list` before the resume and PRESENT after, read
# over an independent connection to the control socket. `unix://` with no path
# makes codex resolve `CODEX_HOME` itself, so fno never rebuilds a socket path
# it would only have to keep in step. A BARE `codex resume <id>` also
# auto-attaches with the daemon up; the flag is kept because it makes the
# daemon-down case LOUD (a named failure) where a bare resume would silently
# run a private in-process app-server against a copy of the rollout and hand
# back a session that looks correct. `daemon start` is a documented no-op when
# one is already running (measured: `{"status":"alreadyRunning"}` twice in a
# row), so the pair is cheap on every attach.
#
# `{session_id}`, never `{short_id}`: a codex UUIDv7 head-8 is a ~65.5s clock
# bucket, so siblings spawned in one minute collide and a short id would
# attach the wrong worker.
[harness.codex.resume_strategy.forms.interactive_attach]
kind = "subcommand"
pre_exec = ["codex", "app-server", "daemon", "start"]
tokens = ["codex", "resume", "{session_id}", "--remote", "unix://"]

[harness.codex.resume_strategy.forms.headless_create]
kind = "subcommand"
tokens = ["codex", "exec"]

[harness.codex.resume_strategy.forms.headless_resume]
kind = "subcommand"
tokens = ["codex", "exec", "resume", "{session_id}"]

[harness.codex.model_switch_strategy]
kind = "menu_walk"
tokens = ["/model", "{model}", "{effort_label}"]
effort_labels = { low = "Low", medium = "Medium (default)", high = "High", xhigh = "Extra high", max = "More reasoning…" }
status_command = "/status"
status_pattern = 'Model:\s+(?P<model>\S+).*?reasoning\s+(?P<effort>minimal|low|medium|high|xhigh|max)'

[harness.gemini]
permission_bypass = ["--yolo"]
resume = "native-continue"
thread = false
autonomous_pane = false
route_on_pane = false
# gemini, measured 2026-08-28, and the old "native" was WRONG. Nothing in this
# tree wires a gemini stop boundary. `fno config setup cli-hooks` installs
# exactly one gemini hook, `install_gemini_hook` in cli/src/fno/setup/cli_hooks.py,
# and it merges a SessionStart group only. hooks/hooks-gemini.json, named in
# docs/architecture/multi-cli-hooks.md, does not exist on disk. docs/harnesses/gemini.md
# lists the SessionStart context hook and no other. No file in hooks/ reaches
# loop-check under a gemini lifecycle event. The searches: every `loop-check`
# caller in hooks/ and scripts/ (five files, none gemini), and every gemini
# installer in cli/src/fno/setup/ (SessionStart only). The CLI is deprecated
# upstream and `command_surface` already reads "refused", so this is a coherent
# result rather than a regression; it is recorded plainly instead of inherited.
loop_participation = "none"
loop_extension = ""
command_surface = "refused"
ready_marker = "unsupported"
ready_rule_ids = []
manifest_rules = []
send_keys_enter_delay_ms = 0
submit_keys = ["unsupported"]
stop_strategy = "registry-noop"
remove_strategy = "registry-only"
session_binding = { strategy = "preassigned", required = true, timeout_ms = 60000 }

[harness.gemini.state_root_grant]
# gemini maps no additive write grant on any substrate. Whether a gemini worker
# is actually DENIED the state root is unmeasured, and the CLI is deprecated
# upstream, so nobody is going to measure it. Declared rather than refused: the
# stderr note already warns, and a refusal here would rest on a guess.
pane = "unmeasured"
thread = "unmeasured"
headless = "unmeasured"

[harness.gemini.permission_response.allow_once]
supported = false
rule_ids = []
keys = []

[harness.gemini.permission_response.allow_always]
supported = false
rule_ids = []
keys = []

[harness.gemini.permission_response.deny]
supported = false
rule_ids = []
keys = []

[harness.gemini.resume_strategy.forms.interactive_create]
kind = "session_flag"
tokens = ["gemini", "--session-id", "{session_id}"]

[harness.gemini.resume_strategy.forms.interactive_resume]
kind = "flag"
tokens = ["gemini", "--resume", "{session_id}"]

[harness.gemini.resume_strategy.forms.interactive_attach]
kind = "unsupported"
tokens = []

[harness.gemini.resume_strategy.forms.headless_create]
kind = "session_flag"
tokens = ["gemini", "--session-id", "{session_id}"]

[harness.gemini.resume_strategy.forms.headless_resume]
kind = "flag"
tokens = ["gemini", "--resume", "{session_id}"]

# model_switch_strategy kind="unsupported" records that fno has not built the
# switch lane on that harness, never that the harness cannot switch models. It
# is a lane statement, not a harness measurement; a built lane flips the kind.
[harness.gemini.model_switch_strategy]
kind = "unsupported"
tokens = []
effort_labels = {}
status_command = ""
status_pattern = ""

[harness.agy]
permission_bypass = ["--dangerously-skip-permissions"]
resume = "native-continue"
thread = false
autonomous_pane = false
route_on_pane = false
# agy, measured 2026-08-28: hooks/agy-target-stop-hook.sh is a real adapter that
# shells the same loop-check, and `fno config setup` registers it in agy's
# ~/.gemini/config/hooks.json under the `footnote` namespace key as a `Stop`
# handler (_agy_install in cli/src/fno/setup/integration.py). agy's hooks carry
# claude-shaped event names over a Gemini-family wire format, so the adapter
# translates rather than reusing target-stop-hook.sh verbatim; the authority is
# the same binary.
loop_participation = "native"
loop_extension = ""
command_surface = "slash"
slash_prefix = ""
ready_marker = "unsupported"
ready_rule_ids = []
manifest_rules = []
# Measured 2026-08-23 on a live mux pane (x-4b0b): floor 0. Every D in
# {0,100,200,400,800} ms, 3 trials each, submitted at idle, payloads 0.7 and
# 1.2 KB, agy 1.1.19; judged by the model's ACK answer appearing after the
# probe token (agy keeps no local transcript store). 800 is a margin, not a
# floor, matching the claude row and CR_SETTLE_MS; do not lower without a
# repro of the lost-CR regime.
send_keys_enter_delay_ms = 800
submit_keys = ["enter"]
stop_strategy = "registry-noop"
remove_strategy = "registry-only"
session_binding = { strategy = "unsupported", required = false, timeout_ms = 0 }

[harness.agy.state_root_grant]
# `--add-dir` (writable_dirs.ADD_DIR_PROVIDERS).
pane = "argv-add-dir"
thread = "argv-add-dir"
headless = "argv-add-dir"

[harness.agy.permission_response.allow_once]
supported = false
rule_ids = []
keys = []

[harness.agy.permission_response.allow_always]
supported = false
rule_ids = []
keys = []

[harness.agy.permission_response.deny]
supported = false
rule_ids = []
keys = []

[harness.agy.resume_strategy.forms.interactive_create]
kind = "flag"
tokens = ["agy"]

# `--conversation <id>` resumes the conversation from any process state,
# the same primitive the headless_resume row below records. Measured
# 2026-08-26 on agy 1.1.19 and re-measured 2026-08-26 on 1.1.21: a fresh
# process quoting a token planted in an earlier turn (num_turns 2), and the
# help text reads "Resume a previous conversation by ID".
[harness.agy.resume_strategy.forms.interactive_resume]
