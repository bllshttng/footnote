# grok readiness manifest (x-fd31) - rules pinned against a live grok 1.0.13
# [stable] TUI on 2026-09-02, replacing the reference-derived port this file
# carried while grok was manifest-only (x-83e7). The capability row landed in
# the same change, so the manifest is live-selected and every rule below is
# one the live TUI actually painted.
#
# Measured vocabulary: the idle composer carries the status bar
# `Shift+Tab:mode | Ctrl+x:shortcuts`; while a turn runs the mode hint is
# replaced by `Esc:cancel` beside `Waiting for response…`, so the idle pair
# is idle-only. The reference port's permission-scope and ctrl+c-keyed
# working rules never matched the live TUI and were deleted with the rot
# rather than kept unfired (the cursor-agent row's precedent). grok has
# approval prompts only in its default permission mode; the lanes the
# capability row opens always launch --always-approve, so no blocked rule is
# pinned. State vocab + arbitration: see codex.toml.
#
# Priority (highest wins): 120 waiting (working) > 10 idle.

min_engine_version = 1

[[rule]]
id = "waiting_for_response_working"
state = "working"
priority = 120
region = "whole_recent"
gate = { all = [
  { contains = "Waiting for response…" },
  { contains = "Esc:cancel" },
] }

[[rule]]
id = "idle_status_bar"
state = "idle"
priority = 10
region = "whole_recent"
gate = { all = [
  { contains = "Shift+Tab:mode" },
  { contains = "Ctrl+x:shortcuts" },
] }
