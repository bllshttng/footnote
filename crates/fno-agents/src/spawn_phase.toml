# spawn_phase.toml - which session phase a spawn payload's verb names.
# Canonical home: this file. build.rs writes the byte copy at
# cli/src/fno/agents/spawn_phase.toml (Python package data).
# A verb matches its bare (/verb), plugin (/fno:verb) and codex ($fno:verb) spellings.
[phases]
do = ["target", "execute", "tdd", "fix", "do"]
review = ["review", "code-review"]
blueprint = ["blueprint"]
think = ["think"]
ship = ["pr", "ship"]
