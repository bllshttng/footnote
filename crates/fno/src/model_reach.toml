# Which routed protocol the fno spawn door can carry per harness, and the
# vendor endpoints no catalog states. A config.model_routing.providers record
# of the same name wins over every value here.
[harness.claude]
routes = ["anthropic"]
native_catalog = "anthropic"

[harness.codex]
routes = []            # codex speaks openai; the door refuses a routed codex pick today
native_catalog = "openai"

[harness.opencode]
own_list = true        # `opencode models --pure` is the ready list

[vendor.zai]
catalog = "zai"
builtin = true         # mirrors model_routing.py _DEFAULT_PROVIDERS["zai"]
anthropic = { base_url = "https://api.z.ai/api/anthropic", key_env = "ZAI_API_KEY", key_file = "~/.fno/.env" }

[vendor.deepseek]
catalog = "deepseek"
anthropic = { base_url = "https://api.deepseek.com/anthropic", key_env = "DEEPSEEK_API_KEY" }
