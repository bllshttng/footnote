<!doctype html>
<!--
  fno backlog web board. Vendored inline by `fno mux serve --web`
  (include_str!), so no external resource exists and the strict CSP holds
  offline. It draws the Rust read model (backlog_model) through
  /backlog/model.json and /backlog/node.json, computing nothing the model
  already answered, polling while the tab is visible and keeping the last
  good board when a poll fails. Titles, details, notes and decisions are
  free text any session writes, so every node string lands through
  textContent: no HTML is ever built from data. When the serving bridge
  stamps the body element writable, the panel adds act controls that POST
  the same verbs the agents run (the write_guard gates them server-side);
  on a read-only bridge the page runs nothing and shows each session's
  attach or resume command to copy.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; connect-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>fno backlog</title>
<style>
/* The footnote themes (Telemetry palette): Superscript dark, Paper light,
   the same tokens the mux paints in theme.rs. The brand is monochrome ink;
   hue carries state only. */
:root {
  color-scheme: dark light;
  --crust: #070707; --mantle: #0e0e0e; --base: #141414;
  --surface0: #2b2b2b; --surface1: #404040; --surface2: #555555;
  --overlay1: #838383; --subtext0: #b4b4b4; --text: #e8e8e8;
  --red: #e1a6a3; --yellow: #c5b784; --green: #9cc49c; --blue: #9fb8e5; --violet: #bcaedf;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: light) {
  :root {
    --crust: #dfdfdf; --mantle: #e9e9e9; --base: #f7f7f7;
    --surface0: #d7d7d7; --surface1: #bfbfbf; --surface2: #a8a8a8;
    --overlay1: #656565; --subtext0: #505050; --text: #292929;
    --red: #965351; --yellow: #796823; --green: #3f6c41; --blue: #4c689d; --violet: #6f5d96;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--base); color: var(--text); font: 12.5px/1.45 var(--mono); }
body { display: flex; flex-direction: column; overflow: hidden; }
::selection { background: var(--text); color: var(--base); }
:focus-visible { outline: 1px solid var(--text); outline-offset: 1px; }
noscript p { margin: 0; padding: 8px 12px; color: var(--yellow); }
button, select, input { font: inherit; }
.controls { flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 14px; background: var(--mantle); border-bottom: 1px solid var(--surface0); }
.mark { font-weight: 700; margin-right: 10px; white-space: pre; }
.mark b { background: var(--text); color: var(--base); margin-right: 1ch; }
.controls .lbl { color: var(--overlay1); font-size: 12px; }
.controls button, .controls select, .controls input { font-size: 12px; background: var(--base); color: var(--text); border: 1px solid var(--surface1); border-radius: 0; padding: 3px 8px; max-width: 180px; min-height: 26px; }
.controls button { cursor: pointer; color: var(--subtext0); }
.controls button:hover { border-color: var(--text); }
.controls button.active { background: var(--text); color: var(--base); border-color: var(--text); }
.controls label { display: flex; align-items: center; gap: 4px; color: var(--overlay1); font-size: 12px; }
.controls input[type=checkbox] { accent-color: var(--text); min-height: 0; }
#note { flex: 0 0 auto; }
#note:empty { display: none; }
#note .err { padding: 3px 14px; color: var(--red); white-space: pre-wrap; }
#note .stale { padding: 3px 14px; color: var(--yellow); }
#hdr { flex: 0 0 auto; padding: 4px 14px 0; color: var(--overlay1); font-size: 11.5px; }
#hdr:empty { display: none; }
#hdr .unavail { color: var(--yellow); }
#stats { flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px; padding: 8px 14px; border-bottom: 1px solid var(--surface0); font-size: 12px; }
#stats:empty { display: none; }
#stats .dim { color: var(--overlay1); }
.bars { display: flex; align-items: flex-end; gap: 2px; height: 32px; }
.bars .bar { width: 7px; background: var(--subtext0); }
.bars .bar.partial { opacity: .4; }
#main { flex: 1 1 auto; overflow: auto; padding: 14px 16px 40px; }
#board { display: grid; gap: 10px; width: max-content; min-width: 100%; }
.hcell { position: sticky; top: 0; z-index: 5; background: var(--base); color: var(--text); font-weight: 700; padding: 5px 2px; border-bottom: 1px solid var(--text); }
.hcell.corner { left: 0; z-index: 6; color: var(--overlay1); }
.lcell { position: sticky; left: 0; z-index: 4; background: var(--base); font-weight: 700; padding: 6px 2px; align-self: start; max-width: 150px; overflow-wrap: anywhere; }
.cell { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.card { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left; width: 100%; background: var(--mantle); color: var(--text); border: 1px solid var(--surface0); border-radius: 0; padding: 7px 9px; cursor: pointer; transition: border-color .12s; }
.card:hover { border-color: var(--text); }
.card .cid { font-size: 11px; color: var(--subtext0); font-weight: 700; }
.card .ct { font-size: 12.5px; font-weight: 600; overflow-wrap: anywhere; }
.card .cm { color: var(--overlay1); font-size: 11px; }
.card .lead { color: var(--yellow); font-size: 11px; }
.card .chip { font-size: 10.5px; color: var(--yellow); }
.card .chip::before, .ktag::before { content: "["; }
.card .chip::after, .ktag::after { content: "]"; }
.card .live { width: 7px; height: 7px; background: var(--green); display: inline-block; }
.card.blocked { border-color: var(--red); }
.more { color: var(--overlay1); font-size: 11px; padding: 2px 9px; }
.empty { color: var(--overlay1); padding: 10px 2px; }
#panel { position: fixed; top: var(--fno-nav-h, 0px); right: 0; bottom: 0; width: min(480px, 46vw); background: var(--mantle); border-left: 1px solid var(--surface1); overflow-y: auto; padding: 10px 14px 24px; z-index: 500; }
#panel[hidden] { display: none; }
#panelhead { display: flex; justify-content: flex-end; margin-bottom: 4px; }
#panelclose { font-size: 11px; cursor: pointer; background: var(--base); color: var(--subtext0); border: 1px solid var(--surface1); border-radius: 0; padding: 3px 10px; min-height: 26px; }
#panelclose:hover { color: var(--text); border-color: var(--text); }
.ptitle { margin: 0 0 6px; font-size: 15px; font-weight: 700; overflow-wrap: anywhere; }
.pid { font-size: 12px; color: var(--subtext0); }
.pgroup { margin: 14px 0 0; }
.pgroup h3 { margin: 0 0 5px; font-size: 11px; font-weight: 700; color: var(--overlay1); }
.pgroup h3::before { content: "## "; }
.fields { display: grid; grid-template-columns: max-content 1fr; gap: 1px 12px; }
.fields .k { color: var(--overlay1); }
.fields .v { overflow-wrap: anywhere; }
.actrow { display: flex; align-items: center; gap: 6px; margin: 4px 0; flex-wrap: wrap; }
.actrow .albl { color: var(--overlay1); font-size: 12px; min-width: 48px; }
.actrow .ainput { font-size: 12px; background: var(--base); color: var(--text); border: 1px solid var(--surface1); border-radius: 0; padding: 3px 8px; max-width: 220px; min-height: 26px; }
.actrow button { font-size: 12px; cursor: pointer; background: var(--base); color: var(--subtext0); border: 1px solid var(--surface1); border-radius: 0; padding: 3px 10px; min-height: 26px; }
.actrow button:hover { color: var(--text); border-color: var(--text); }
.actrow button:disabled { opacity: .45; cursor: default; }
.actnote { color: var(--yellow); font-size: 11px; min-height: 14px; overflow-wrap: anywhere; }
.actnote:empty { display: none; }
.pre { margin: 4px 0 0; padding: 6px 8px; background: var(--base); border: 1px solid var(--surface0); white-space: pre-wrap; overflow-wrap: anywhere; font-size: 11px; max-height: 260px; overflow-y: auto; }
.links { display: flex; flex-direction: column; align-items: stretch; gap: 3px; }
.linkbtn { font-size: 11px; text-align: left; cursor: pointer; background: var(--base); color: var(--text); border: 1px solid var(--surface0); border-radius: 0; padding: 3px 8px; overflow-wrap: anywhere; }
.linkbtn:hover { border-color: var(--text); }
.sess { width: 100%; border-collapse: collapse; font-size: 11px; }
.sess th { text-align: left; color: var(--overlay1); font-weight: 700; padding: 2px 6px 2px 0; border-bottom: 1px solid var(--surface1); }
.sess td { padding: 3px 6px 3px 0; vertical-align: top; }
.sess td.dim { color: var(--overlay1); }
.sess .sid { color: var(--subtext0); }
.cmd { display: flex; align-items: center; gap: 4px; }
.cmd code { font: inherit; font-size: 11px; color: var(--yellow); overflow-wrap: anywhere; }
.copybtn { font-size: 10px; cursor: pointer; flex: 0 0 auto; background: var(--base); color: var(--subtext0); border: 1px solid var(--surface1); border-radius: 0; padding: 2px 7px; min-height: 22px; }
.copybtn:hover { color: var(--text); border-color: var(--text); }
.prlink, .planline a { color: var(--blue); overflow-wrap: anywhere; }
.noteline { margin: 3px 0; overflow-wrap: anywhere; }
.noteline .nts { color: var(--overlay1); font-size: 11px; }
.controls select[multiple] { height: 44px; }
#tiles { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 14px 0; }
#tiles[hidden] { display: none; }
.tile { font-size: 12px; cursor: pointer; background: var(--base); color: var(--subtext0); border: 1px solid var(--surface1); border-radius: 0; padding: 3px 10px; min-height: 26px; }
.tile:hover { border-color: var(--text); }
.tile.active { background: var(--text); color: var(--base); border-color: var(--text); }
.lsec { border: 1px solid var(--surface0); background: var(--mantle); margin: 0 0 10px; }
.lhead { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--mantle); color: var(--text); border: 0; padding: 8px 12px; cursor: pointer; }
.lhead:hover { background: var(--surface0); }
.lname { font-size: 13px; font-weight: 700; overflow-wrap: anywhere; }
.lbar { flex: 1 1 auto; height: 4px; background: var(--surface0); overflow: hidden; }
.lfill { display: block; height: 100%; background: var(--green); }
.lrows { display: flex; flex-direction: column; }
.lsec.closed .lrows { display: none; }
.lrow { display: grid; grid-template-columns: 92px 10ch minmax(0,1fr) 5ch auto; gap: 12px; align-items: baseline; text-align: left; background: none; color: var(--text); border: 0; border-top: 1px solid var(--surface0); padding: 6px 12px; cursor: pointer; }
.lrow:hover { background: var(--base); }
.lid { font-size: 11.5px; color: var(--subtext0); font-weight: 700; }
.ltitle { font-size: 12.5px; font-weight: 600; overflow-wrap: anywhere; }
.lmeta { color: var(--overlay1); font-size: 11px; }
.lrow.blocked .ltitle { color: var(--red); }
.lrow.lchild .lid, .lrow.lchild .ltitle { padding-left: 2ch; }
.lrow.lchild .ltitle { font-weight: 500; }
.lrow > * { grid-row: 1; }
.lrow > .lid { grid-column: 1; } .lrow > .ktag { grid-column: 2; } .lrow > .ltitle { grid-column: 3; } .lrow > .vote-pill { grid-column: 4; text-align: right; } .lrow > .lmeta { grid-column: 5; text-align: right; }
@media (max-width: 720px) { .lrow { grid-template-columns: 7ch minmax(0,1fr) 5ch; } .lrow > .ktag, .lrow > .lmeta { display: none; } .lrow > .ltitle { grid-column: 2; } .lrow > .vote-pill { grid-column: 3; } }
.vote-pill { font: inherit; font-size: 10.5px; padding: 0; border: 0; color: var(--subtext0); cursor: pointer; background: none; }
.vote-pill:hover { color: var(--text); }
.vote-pill.z { color: var(--overlay1); }
.ktag { font-size: 10.5px; }
.k-epic { color: var(--yellow); }
.k-feature { color: var(--blue); }
.k-bug { color: var(--red); }
.k-task { color: var(--green); }
.k-other { color: var(--subtext0); }
.actwhy { color: var(--yellow); font-size: 11px; flex-basis: 100%; overflow-wrap: anywhere; }
.planline { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 3px 0; }
.planline code { font: inherit; font-size: 11px; color: var(--yellow); overflow-wrap: anywhere; }
/* The search bar: the first thing on the page, full width, pinned over the
   filter row; the board scrolls beneath it. The focus key rides inside the
   box and yields while the field holds focus. */
#searchbar { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--mantle); border-bottom: 1px solid var(--surface0); }
#searchbar .slabel { color: var(--overlay1); font-size: 12px; }
#searchbox { flex: 1 1 auto; position: relative; display: flex; }
#f-q { flex: 1 1 auto; width: 100%; font-size: 13px; background: var(--base); color: var(--text); border: 1px solid var(--surface1); border-radius: 0; padding: 5px 44px 5px 10px; min-height: 30px; }
#f-q:focus { border-color: var(--text); outline: none; }
#searchbox input:focus + kbd { display: none; }
kbd { font: inherit; font-size: 10.5px; color: var(--overlay1); border: 1px solid var(--surface1); padding: 1px 5px; line-height: 14px; white-space: nowrap; }
#searchbox kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); cursor: pointer; background: var(--base); }
/* The recent-search list: an anchored dropdown under the bar, shown on
   focus, one row per stored query plus the one clear action. */
#recent { position: absolute; top: 100%; left: 0; right: 0; margin-top: 4px; background: var(--mantle); border: 1px solid var(--surface1); z-index: 900; max-height: 40vh; overflow-y: auto; }
#recent[hidden] { display: none; }
.recentrow { display: flex; width: 100%; align-items: baseline; text-align: left; background: none; color: var(--text); border: 0; border-top: 1px solid var(--surface0); padding: 6px 12px; font: inherit; cursor: pointer; }
.recentrow:first-child { border-top: 0; }
.recentrow:hover { background: var(--surface0); }
.recentrow .rq { flex: 1 1 auto; overflow-wrap: anywhere; }
.recentrow.recentclear { color: var(--overlay1); }
.controls kbd { margin-left: 4px; }
#f-q-clear { flex: 0 0 auto; font-size: 12px; cursor: pointer; background: var(--base); color: var(--subtext0); border: 1px solid var(--surface1); border-radius: 0; padding: 3px 10px; min-height: 30px; }
#f-q-clear:hover { color: var(--text); border-color: var(--text); }
#f-q-clear[hidden] { display: none; }
.controls { transition: background .3s; }
.controls.pulse { background: var(--surface0); }
/* A tapped node id copies itself; the row it sits in still opens. */
.cidcopy { cursor: copy; }
.cidcopy:hover { text-decoration: underline; color: var(--text); }
/* The j/k selection reads as a doubled border, so a blocked card's red edge
   and the selection stay visible at once. */
.card.sel, .lrow.sel { box-shadow: inset 0 0 0 1px var(--text); }
#toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); background: var(--text); color: var(--base); padding: 6px 14px; font-size: 12px; z-index: 1500; opacity: 0; transition: opacity .15s; pointer-events: none; }
#toast.show { opacity: 1; }
#sheet { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--crust); opacity: .92; z-index: 1200; }
#sheet[hidden] { display: none; }
#sheetbox { background: var(--mantle); border: 1px solid var(--surface1); padding: 14px 18px 16px; min-width: 280px; max-width: 92vw; }
#sheetbox h2 { margin: 0 0 10px; font-size: 13px; }
#sheetbox td { padding: 2px 12px 2px 0; font-size: 12px; color: var(--subtext0); }
#sheetbox td.k { color: var(--text); white-space: pre; }
#sheetclose { margin-top: 12px; font-size: 11px; cursor: pointer; background: var(--base); color: var(--subtext0); border: 1px solid var(--surface1); border-radius: 0; padding: 3px 10px; min-height: 26px; }
#sheetclose:hover { color: var(--text); border-color: var(--text); }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } #toast { transition: none; } }
@media (max-width: 720px) { #panel { width: auto; left: 0; } .mark { flex-basis: 100%; } }
</style>
</head>
<body>
<!--fno-nav-->
<noscript><p>JavaScript is off; this page cannot draw the board.</p></noscript>
<div id="searchbar">
  <span class="slabel">find</span>
  <div id="searchbox">
    <input id="f-q" type="search" placeholder="search id, title, label" autocomplete="off" spellcheck="false">
    <kbd id="searchkey" title="focus search (/)">/</kbd>
    <div id="recent" hidden></div>
  </div>
  <button id="f-q-clear" type="button" hidden title="clear search">clear</button>
</div>
<div class="controls" id="controls">
  <span class="mark">Ｆ<b>[no]</b> backlog</span>
  <span class="lbl">view <kbd title="switch kanban and list">tab</kbd></span>
  <button type="button" data-view="kanban">kanban</button>
  <button type="button" data-view="list">list</button>
  <span class="lbl">lanes</span>
  <button type="button" data-lanes="project">project</button>
  <button type="button" data-lanes="epic">epic</button>
  <button type="button" data-lanes="none">none</button>
  <span class="lbl">filters <kbd title="jump to the filters">f</kbd></span>
  <label>project <select id="f-project" multiple size="1"><option value="">any</option></select></label>
  <label>epic <select id="f-epic" multiple size="1"><option value="">any</option></select></label>
  <label>status <select id="f-status" multiple size="1"><option value="">any</option></select></label>
  <label>priority <select id="f-priority" multiple size="1"><option value="">any</option></select></label>
  <label>size <select id="f-size" multiple size="1"><option value="">any</option></select></label>
  <label>kind <select id="f-kind" multiple size="1"><option value="">any</option></select></label>
  <label>lead <select id="f-lead" multiple size="1"><option value="">any</option></select></label>
  <label><input id="f-all" type="checkbox"> all projects</label>
  <button type="button" id="sheetbtn" title="keyboard shortcuts (?)">?</button>
</div>
<div id="note"></div>
<div id="hdr"></div>
<div id="stats"></div>
<div id="tiles" hidden></div>
<div id="main"><div id="board"></div></div>
<aside id="panel" hidden>
  <div id="panelhead"><button id="panelclose" type="button">close</button></div>
  <div id="panelbody"></div>
</aside>
<div id="sheet" hidden>
  <div id="sheetbox">
    <h2>keyboard shortcuts</h2>
    <table><tbody>
      <tr><td class="k">/  ctrl/cmd K</td><td>focus search</td></tr>
      <tr><td class="k">esc</td>  <td>clear search, then close details</td></tr>
      <tr><td class="k">j / k</td><td>move the selection</td></tr>
      <tr><td class="k">enter</td><td>open the selected details</td></tr>
      <tr><td class="k">y</td>    <td>copy the selected id</td></tr>
      <tr><td class="k">tab</td>  <td>switch kanban and list</td></tr>
      <tr><td class="k">f</td>    <td>jump to the filters</td></tr>
      <tr><td class="k">?</td>    <td>this sheet</td></tr>
    </tbody></table>
    <button id="sheetclose" type="button">close</button>
  </div>
</div>
<div id="toast" role="status"></div>
<script>
"use strict";
// The pure board helpers. They compute values and touch no DOM, so the Rust
// tests lift and run them under node (see web.rs lift_js_fn).
function cellHead(cell) {
  return cell.column + " " + cell.total;
}
// A lane's whole count: the sum of its cells' (uncapped) totals.
function laneTotal(lane) {
  return (lane.cells || []).reduce((s, c) => s + (c.total || 0), 0);
}
// One board answer folded into what the page shows. An errors-only answer
// never wipes a good board: the previous lanes stay and the answer carries
// the new error lines plus the time the kept board is from.
function mergeBoard(last, next, now) {
  const failed = next.errors && next.errors.length > 0 && (!next.lanes || next.lanes.length === 0);
  if (failed && last) {
    return Object.assign({}, last, { errors: next.errors, stale_since: last.fetched_at });
  }
  return Object.assign({}, next, { fetched_at: now });
}
// What a session row can do from this page: the attach or resume command to
// copy, or null when the row renders dim with the reason the model sent.
// The page copies; it never launches.
// The upvote command for one node: operator vote, evidence the operator
// names. The snapshot page copies it; the served page posts the same argv.
function voteText(id) {
  return "fno backlog encounter " + id + " --operator --evidence \"REPLACE: what it cost\"";
}
// The toast line for one copied node id.
function copiedToast(id) {
  return "copied " + id;
}
// The recent-search store: one localStorage key per origin (the vault copy
// and the served board each keep their own), capped at ten, newest first.
// The pure half first, so the node tests drive it without a DOM.
const RECENT_KEY = "fno-backlog-recent-searches";
function pushRecent(list, q) {
  return [q].concat(list.filter((s) => s !== q)).slice(0, 10);
}
function loadRecent(raw) {
  try {
    const v = JSON.parse(raw || "[]");
    return Array.isArray(v) ? v.filter((s) => typeof s === "string").slice(0, 10) : [];
  } catch (e) { return []; }
}
// True when the event target swallows typing: a form field or a content
// editable. The board shortcuts never fire from inside one.
function isTypingTarget(target) {
  if (!target || !target.tagName) return false;
  const tag = target.tagName;
  return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || !!target.isContentEditable;
}
// One keydown resolved to a board action, from plain data so the Rust tests
// can drive every shortcut without a DOM. Inside a form field nothing fires -
// Escape still does, because leaving a field or clearing the search is not
// typing. Escape unwinds in order: the sheet, the search text, the details.
function shortcutAction(key, mods, ctx) {
  if (key === "Escape") {
    if (ctx.sheetOpen) return "close-sheet";
    if (ctx.query) return "clear-search";
    if (ctx.panelOpen) return "close-panel";
    return null;
  }
  if (ctx.typing) return null;
  if (key === "/") return "focus-search";
  if ((key === "k" || key === "K") && (mods.meta || mods.ctrl)) return "focus-search";
  if (key === "j") return "sel-next";
  if (key === "k") return "sel-prev";
  if (key === "Enter") return ctx.hasSelection ? "open" : null;
  if (key === "y") return ctx.hasSelection ? "copy" : null;
  if (key === "Tab") return "toggle-view";
  if (key === "f") return "filters";
  if (key === "?") return "sheet";
  return null;
}
// Copy a raw string over plain http or file://, where the clipboard API may
// be absent: fall back to selecting the text in a hidden helper and saying
// so, the same degradation the command rows use.
function copyText(text, btn) {

    const text = await resp.text();
    let ok = resp.ok, notice = text;

      const v = JSON.parse(text);

    seenVersion = next.version;
    if (openId && prevVersion !== undefined && next.version !== prevVersion) {
      openNode(openId);
    }
  }
  for (const b of controls.querySelectorAll("button[data-lanes]")) {
    b.addEventListener("click", () => {
      state.lanes = b.dataset.lanes;
      syncUrl();
      fetchBoard();
    });
  }
  for (const b of controls.querySelectorAll("button[data-view]")) {
    b.addEventListener("click", () => {
      state.view = b.dataset.view;
      syncUrl();
      fetchBoard();
    });
  }
  for (const k of FILTER_KEYS) {
    document.getElementById("f-" + k).addEventListener("change", (ev) => {
      state[k] = [...ev.target.selectedOptions].map((o) => o.value);
      syncUrl();
      fetchBoard();
    });
  }
  let debounce = 0;
  searchInput.addEventListener("input", (ev) => {
    clearTimeout(debounce);
    searchClear.hidden = !ev.target.value;
    if (ev.target.value) hideRecent();
    debounce = setTimeout(() => {
      state.q = ev.target.value.trim();
      recordRecent(state.q);
      syncUrl();
      fetchBoard();
    }, 300);
  });
  document.getElementById("f-all").addEventListener("change", (ev) => {
    state.all = ev.target.checked;
    syncUrl();
    fetchBoard();
  });
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) fetchBoard();
  });
  // The one copied-id surface: a tap or click on any node id anywhere on
  // the page copies it, with a short toast; the row behind it still opens.
  let toastTimer = 0;
  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
  }
  function copyId(id) {
    if (window.isSecureContext && navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(id).then(() => toast(copiedToast(id)), () => copyIdBySelect(id));
    } else {
      copyIdBySelect(id);
    }
  }
  function copyIdBySelect(id) {
    const inp = document.createElement("textarea");
    inp.value = id;
    document.body.appendChild(inp);
    inp.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    inp.remove();
    toast(ok ? copiedToast(id) : "selected " + id + "; copy by hand");
  }
  function bindIdCopy(el, id) {
    el.classList.add("cidcopy");
    el.title = "copy " + id;
    el.addEventListener("click", (ev) => {
      ev.stopPropagation();
      copyId(id);
    });
  }
  // The j/k selection: a flat pass over the visible cards in draw order;
  // j from nothing starts at the first card, k at the last.
  function setSel(id) {
    const prev = gridEl.querySelector(".sel");
    if (prev) prev.classList.remove("sel");
    selId = id;
    if (!id) return;
    const el = gridEl.querySelector('[data-id="' + id + '"]');
    if (el) {
      el.classList.add("sel");
      el.scrollIntoView({ block: "nearest" });
    }
  }
  function moveSel(delta) {
    if (!visibleIds.length) return;
    let i = visibleIds.indexOf(selId);
    if (i < 0) i = delta > 0 ? -1 : visibleIds.length;
    i = Math.max(0, Math.min(visibleIds.length - 1, i + delta));
    setSel(visibleIds[i]);
  }
  function setView(v) {
    state.view = v;
    syncUrl();
    fetchBoard();
  }
  function focusSearch() {
    searchInput.focus();
    searchInput.select();
  }
  function clearSearch() {
    searchInput.value = "";
    searchClear.hidden = true;
    state.q = "";
    hideRecent();
    syncUrl();
    fetchBoard();
    searchInput.focus();
  }
  function openFilters() {
    controls.classList.add("pulse");
    setTimeout(() => controls.classList.remove("pulse"), 1200);
    const first = document.getElementById("f-project");
    if (first) first.focus();
  }
  // The recent-search dropdown: stored per origin in localStorage (the
  // vault copy and the served board each keep their own history), read on
  // focus, rerun on tap, one clear action. Storage can refuse (private
  // mode, disabled storage): every access is guarded and the list then
  // just never appears.
  const recentEl = document.getElementById("recent");
  function lsGet(k) {
    try { return window.localStorage.getItem(k); } catch (e) { return null; }
  }
  function lsSet(k, v) {
    try { window.localStorage.setItem(k, v); } catch (e) { }
  }
  function recentList() {
    return loadRecent(lsGet(RECENT_KEY));
  }
  function recordRecent(q) {
    if (!q) return;
    lsSet(RECENT_KEY, JSON.stringify(pushRecent(recentList(), q)));
  }
  function hideRecent() {
    recentEl.hidden = true;
  }
  function drawRecent() {
    const list = recentList();
    recentEl.textContent = "";
    if (!list.length) {
      recentEl.hidden = true;
      return;
    }
    for (const q of list) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "recentrow";
      const s = document.createElement("span");
      s.className = "rq";
      s.textContent = q;
      b.appendChild(s);
      // Activate on mousedown, not click: the press would blur the input
      // and the hide timer could swallow the click. preventDefault keeps
      // the focus in the input, so no timer race exists.
      b.addEventListener("mousedown", (ev) => {
        ev.preventDefault();
        recordRecent(q);
        searchInput.value = q;
        state.q = q;
        searchClear.hidden = false;
        hideRecent();
        syncUrl();
        fetchBoard();
        searchInput.select();
      });
      recentEl.appendChild(b);
    }
    const clear = document.createElement("button");
    clear.type = "button";
    clear.className = "recentrow recentclear";
    clear.textContent = "clear recent searches";
    clear.addEventListener("mousedown", (ev) => {
      ev.preventDefault();
      lsSet(RECENT_KEY, "");
      hideRecent();
    });
    recentEl.appendChild(clear);
    recentEl.hidden = false;
  }
  // The blur-hide timer cancels on focus: a quick blur-then-refocus (or a
  // row press, which preventDefault keeps in the input) must not hide the
  // list the new focus just drew.
  let recentHideTimer = 0;
  searchInput.addEventListener("focus", () => {
    clearTimeout(recentHideTimer);
    drawRecent();
  });
  searchInput.addEventListener("blur", () => {
    recentHideTimer = setTimeout(hideRecent, 150);
  });
  document.getElementById("sheetclose").addEventListener("click", () => { sheetEl.hidden = true; });
  sheetEl.addEventListener("click", (ev) => {
    if (ev.target === sheetEl) sheetEl.hidden = true;
  });
  document.getElementById("sheetbtn").addEventListener("click", openSheet);
  document.getElementById("searchkey").addEventListener("click", focusSearch);
  searchClear.addEventListener("click", clearSearch);
  function openSheet() { sheetEl.hidden = false; }
  // The keydown entry: resolve the action, then preventDefault everything
  // but the Escape unwind (the browser handles Esc natively in fields).
  document.addEventListener("keydown", (ev) => {
    const action = shortcutAction(ev.key, { meta: ev.metaKey, ctrl: ev.ctrlKey }, {
      typing: isTypingTarget(ev.target),
      query: searchInput.value,
      panelOpen: !panel.hidden,
      sheetOpen: !sheetEl.hidden,
      view: state.view,
      hasSelection: !!selId,
    });
    if (!action) return;
    if (action === "clear-search" || action === "close-panel") return;
    // Enter on a focused button or link is that control's native activate:
    // the board open must never swallow it.
    if (action === "open" && ev.target.closest && ev.target.closest("button, a")) return;
    ev.preventDefault();
    if (action === "focus-search") focusSearch();
    else if (action === "close-sheet") sheetEl.hidden = true;
    else if (action === "sel-next") moveSel(1);
    else if (action === "sel-prev") moveSel(-1);
    else if (action === "open") openNode(selId);
    else if (action === "copy") copyId(selId);
    else if (action === "toggle-view") setView(state.view === "list" ? "kanban" : "list");
    else if (action === "filters") openFilters();
    else if (action === "sheet") openSheet();
  });
  document.getElementById("panelclose").addEventListener("click", closePanel);
  if (!SNAPSHOT) {
    pollTimer = setInterval(() => {
      if (!document.hidden) fetchBoard();
    }, 10000);
  }
  syncControls();
  fetchBoard();
  if (SNAPSHOT && snap.failed) {
    showNoteLine(snap.failed);
  }
  if (openId) openNode(openId);
})();
</script>
</body>
</html>
