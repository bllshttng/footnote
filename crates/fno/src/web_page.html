<!doctype html>
<!--
  fno mux read-only web attach (x-6a14). Served inline by `fno mux serve --web`
  via include_str! - no CDN, no external resource of any kind, so the strict CSP
  below (default-src 'none') can hold and the page works offline / airgapped.

  Renders one pane at a time. Cells arrive already structured (char + fg/bg +
  style flags) in each ServerMsg::Frame, so we paint them straight to a <pre> of
  styled <span> runs - no ANSI reconstruction, no xterm.js. Read-only: the page
  never sends a byte upstream; pane selection only changes which cached frame we
  draw locally.

  NOT SCROLLBACK (x-ce65). A Frame is a composite of the CURRENT VISIBLE GRID
  and the bridge caches only the latest one per pane, so no history reaches this
  page. What it does instead is RETAIN: it diffs consecutive frames, keeps the
  rows that scrolled off the top, and paints them above the live grid. That is
  strictly weaker than scrollback and the UI says so. Its ceiling:
    - it starts empty; history begins when you select the pane, never before
    - it is per-selected-pane; switching panes clears it
    - a burst larger than one screenful between two frames is lost
    - any full-screen repaint (alternate screen, clear, resize) breaks continuity
  The last one is made VISIBLE rather than hidden: two consecutive frames that
  share no overlapping rows get a break rule, never silent concatenation.

  The correct fix is a protocol history request answered from the vt layer's
  existing scrollback. It is unreachable from here: web.rs:381 calls
  `writer.forget()` on the socket write half, and that call IS Locked Decision 5
  (read-only is structural). Restoring a write path to carry a history request
  reverses the decision read-only rests on, which is a live operator question and
  deliberately out of scope. Per-viewer history would also need a new server-side
  read path, since `Frame.scroll_offset` is SHARED state broadcast to every
  viewer - a browser-driven scroll would move the TUI user's viewport.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<!-- No maximum-scale / user-scalable: that pair disables pinch-zoom on iOS, and a
     pane grid is as wide as its TERMINAL (183 columns in the reported specimen),
     so zooming is the operator's only way in on a phone. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; connect-src 'self' ws: wss:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>fno mux (read-only)</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0e14; color: #c5cdd9;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  body { display: flex; flex-direction: column; }
  #bar { flex: 0 0 auto; padding: 6px 10px; font-size: 13px; display: flex;
    align-items: center; gap: 10px; border-bottom: 1px solid #1c2230; }
  #bar.connecting { background: #1a2030; color: #8a93a6; }
  #bar.live { background: #0b0e14; }
  #bar.disconnected { background: #4a3a12; color: #f0c674; }
  #bar.ended { background: #4a1616; color: #f08a8a; }
  #bar.authfailed { background: #4a1616; color: #f08a8a; }
  #status { font-weight: 600; }
  /* Pushed to the far edge, and a 30px box so a thumb can hit it. */
  #fitbtn { margin-left: auto; font: inherit; font-size: 12px; cursor: pointer;
    background: #141a26; color: #9aa4b6; border: 1px solid #232b3a;
    border-radius: 5px; padding: 4px 10px; min-width: 46px; min-height: 30px; }
  #picker { flex: 0 0 auto; display: flex; gap: 6px; overflow-x: auto;
    padding: 6px 10px; border-bottom: 1px solid #1c2230; white-space: nowrap; }
  #picker button { font: inherit; font-size: 12px; cursor: pointer;
    background: #141a26; color: #9aa4b6; border: 1px solid #232b3a;
    border-radius: 5px; padding: 3px 9px; }
  #picker button.active { background: #24406b; color: #fff; border-color: #3763ac; }
  #picker button .dot { display: inline-block; width: 7px; height: 7px;
    border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  .b-working { background: #6cc04a; } .b-blocked { background: #f0c674; }
  .b-done { background: #4a90d9; } .b-idle { background: #4a5568; }
  #screen { flex: 1 1 auto; overflow: auto; }
  pre#term { margin: 0; padding: 8px 10px; font-size: 13px; line-height: 1.15;
    white-space: pre; }
  /* The retained region is dimmed so the live grid stays the thing you read,
     and so nobody mistakes browser-kept lines for terminal scrollback. */
  .kept { opacity: .72; }
  .kept-note, .kept-break { color: #6f7a8f; font-style: italic; }
  .cur { outline: 1px solid #c5cdd9; }
  #overlay { position: fixed; inset: 0; display: none; align-items: center;
    justify-content: center; background: rgba(11,14,20,.85); font-size: 15px;
    text-align: center; padding: 24px; }
  #overlay.show { display: flex; }
</style>
</head>
<body>
  <div id="bar" class="connecting"><span id="status">connecting…</span><span id="sub"></span><button id="fitbtn" type="button" title="fit the grid to the screen width, or show it at full size">fit</button></div>
  <div id="picker"></div>
  <div id="screen"><pre id="term"></pre></div>
  <div id="overlay"></div>
<script>
"use strict";
(() => {
  const $ = (id) => document.getElementById(id);
  const bar = $("bar"), statusEl = $("status"), subEl = $("sub"),
        picker = $("picker"), term = $("term"), overlay = $("overlay"),
        screenEl = $("screen"), fitBtn = $("fitbtn");

  // ---- state ----
  const frames = new Map();   // pane_id -> latest Frame (insertion order = LRU)
  const MAX_PANES = 128;      // LRU cap; mirrors the bridge snapshot bound
  let squads = [];            // from Layout
  let agents = [];            // from Layout
  let current = null;         // selected pane_id
  let upstreamUp = true;
  // Retention (x-ce65), NOT scrollback: rows evicted off the top of the live
  // grid, kept by this browser for the SELECTED pane only. The file header says
  // why the protocol cannot answer this and what the ceiling is.
  const kept = [];            // rendered rows that scrolled off, oldest first
  const MAX_KEPT_ROWS = 1000; // hard cap; the front is dropped past it
  let keptFor = null;         // the pane `kept` belongs to
  let prevRows = null;        // last drawn rows, for the overlap diff
  const KEPT_NOTE = "recent output kept by this browser since you opened this pane, not terminal scrollback";
  const BREAK_RULE = "─".repeat(8) + " break in output " + "─".repeat(8);

  // ---- xterm 256-color palette -> css ----
  const base16 = ["#000000","#cd0000","#00cd00","#cdcd00","#0000ee","#cd00cd",
    "#00cdcd","#e5e5e5","#7f7f7f","#ff0000","#00ff00","#ffff00","#5c5cff",
    "#ff00ff","#00ffff","#ffffff"];
  const cube = [0,95,135,175,215,255];
  function idxColor(n) {
    if (n < 16) return base16[n];
    if (n < 232) { n -= 16; return `rgb(${cube[(n/36|0)%6]},${cube[(n/6|0)%6]},${cube[n%6]})`; }
    const v = 8 + (n - 232) * 10; return `rgb(${v},${v},${v})`;
  }
  function css(color, isFg) {
    if (color === "Default" || color == null) return isFg ? "#c5cdd9" : "#0b0e14";
    if (color.Indexed != null) return idxColor(color.Indexed);
    if (color.Rgb) return `rgb(${color.Rgb[0]},${color.Rgb[1]},${color.Rgb[2]})`;
    return isFg ? "#c5cdd9" : "#0b0e14";
  }
  const esc = (s) => s.replace(/[&<>]/g, (c) => c === "&" ? "&amp;" : c === "<" ? "&lt;" : "&gt;");

  // flags (mirror proto::cell_flags)
  const BOLD=1, ITALIC=2, UNDERLINE=4, INVERSE=8, DIM=16, WIDE_SPACER=32, SELECTED=64;

  function cellStyle(cell) {
    let fg = css(cell.fg, true), bg = css(cell.bg, false);
    const f = cell.flags | 0;
    if (f & (INVERSE | SELECTED)) { const t = fg; fg = bg; bg = t; }
    let s = `color:${fg};background:${bg};`;
    if (f & BOLD) s += "font-weight:bold;";
    if (f & DIM) s += "opacity:.6;";
    if (f & ITALIC) s += "font-style:italic;";
    if (f & UNDERLINE) s += "text-decoration:underline;";
    return s;
  }
  // Two cells share a run only if they render identically.
  const sameStyle = (a, b) =>
    a.flags === b.flags &&
    JSON.stringify(a.fg) === JSON.stringify(b.fg) &&
    JSON.stringify(a.bg) === JSON.stringify(b.bg);

  // One grid row as styled <span> runs, newline-terminated. `showCur` is off for
  // the retention copy: a cursor outline frozen into kept output would read as a
  // live cursor sitting in history.
  function renderRow(fr, r, showCur) {
    let html = "", run = "", runStyle = null, runFlags = null;
    const flush = () => {
      if (run) html += `<span style="${runStyle}">${esc(run)}</span>`;
      run = "";
    };
    for (let cx = 0; cx < fr.cols; cx++) {
      const cell = fr.cells[r * fr.cols + cx];
      if ((cell.flags | 0) & WIDE_SPACER) continue; // right half of a wide glyph
      if (showCur && r === fr.cursor_row && cx === fr.cursor_col) {
        flush(); runFlags = null;
        html += `<span class="cur" style="${cellStyle(cell)}">${esc(cell.c)}</span>`;
        continue;
      }
      if (runFlags === null || !sameStyle(cell, runFlags)) {
        flush(); runFlags = cell; runStyle = cellStyle(cell);
      }
      run += cell.c;
    }
    flush();
    return html + "\n";
  }

  // How far the grid scrolled between two frames: the smallest k where the old
  // frame's rows [k..] equal the new frame's rows [0..n-k]. k === 0 means the
  // grid did not move, so nothing was evicted and redrawing the same frame
  // retains nothing - this must stay idempotent, because a Layout redraw calls
  // draw() with an unchanged frame. k === n means the two frames share no
  // overlap at all: a full-screen repaint, or a burst taller than the grid.
  // Row strings are compared, not cells, because draw() already built them.
  // ponytail: O(n^2) row-string compares, n = rows. At a phone's ~50 rows that
  // is 2.5k compares per frame; a suffix automaton is the upgrade if it ever
  // shows up in a profile.
  function evictedRowCount(prev, next) {
    const n = next.length;
    if (!prev || prev.length !== n) return n; // geometry changed: a break
    for (let k = 0; k < n; k++) {
      let ok = true;
      for (let i = k; i < n; i++) if (prev[i] !== next[i - k]) { ok = false; break; }
      if (ok) return k;
    }
    return n;
  }

  // ---- fit to width (x-ce65), CLIENT SIDE ONLY ----
  // A pane is as wide as its TERMINAL - 183 columns in the reported specimen -
  // and a phone shows roughly 45 of them at 13px. The fix shrinks the TYPE here
  // and never touches the terminal. It cannot do otherwise and must not try:
  // the bridge attaches as a passive observer (rows: 0, cols: 0) precisely so it
  // is excluded from the smallest-client clamp and never shrinks a PTY, and it
  // drops the socket write half besides. A page that asked the server to narrow
  // the pane would collapse it for every native viewer at the same time.
  const BASE_FONT_PX = 13;  // the 1:1 size, and the ceiling when fitting
  const MIN_FONT_PX = 2;    // past this there is nothing left for zoom to rescue
  let fitToWidth = true;
  let advanceRatio = 0;     // character advance width per 1px of font-size
  let lastFitKey = "";

  // Measured, not assumed: the ratio is a property of whichever font in the
  // stack the device actually resolved, and guessing 0.6 puts a 183-column grid
  // off the edge on any face that differs.
  function measureAdvance() {
    const probe = document.createElement("span");
    probe.style.cssText =
      "position:absolute;visibility:hidden;white-space:pre;font-size:100px;";
    probe.textContent = "0".repeat(100);
    term.appendChild(probe);
    const w = probe.getBoundingClientRect().width;
    probe.remove();
    return w > 0 ? w / 100 / 100 : 0.6; // fallback: the usual monospace ratio
  }

  function applyFit(cols) {
    // clientWidth excludes the scrollbar, which the retained region can summon.
    const key = `${cols}x${screenEl.clientWidth}x${fitToWidth ? 1 : 0}`;
    if (key === lastFitKey) return; // a per-frame layout read is not free
    lastFitKey = key;
    let px = BASE_FONT_PX;
    if (fitToWidth && cols > 0) {
      if (!advanceRatio) advanceRatio = measureAdvance();
      const st = getComputedStyle(term);
      const pad = (parseFloat(st.paddingLeft) || 0) + (parseFloat(st.paddingRight) || 0);
      const avail = screenEl.clientWidth - pad;
      const want = Math.floor((avail / cols / advanceRatio) * 10) / 10;
      px = Math.min(BASE_FONT_PX, Math.max(MIN_FONT_PX, want));
    }
    term.style.fontSize = px + "px";
  }

  function refit() {
    const fr = current != null ? frames.get(current) : null;
    lastFitKey = ""; // the container may have changed under an unchanged frame
    applyFit(fr ? fr.cols : 0);
  }

  fitBtn.onclick = () => {
    fitToWidth = !fitToWidth;
    fitBtn.textContent = fitToWidth ? "fit" : "1:1";
    refit();
    if (fitToWidth) screenEl.scrollLeft = 0;
  };
  addEventListener("resize", refit);
  addEventListener("orientationchange", refit);

  function draw() {
    const fr = current != null ? frames.get(current) : null;
    // Retention belongs to one pane. Every path that changes `current` - the
    // picker, LRU eviction, an exited agent, the first paint - lands here, so
    // resetting on the mismatch covers them all without touching each one.
    if (keptFor !== current) { kept.length = 0; prevRows = null; keptFor = current; }
    if (!fr) { term.textContent = current == null ? "" : "…"; return; }
    // Defensive re-guard: never draw a geometry-inconsistent grid (AC5-FR twin).
    if (fr.cells.length !== fr.rows * fr.cols) return;

    const rows = [];
    for (let r = 0; r < fr.rows; r++) rows.push(renderRow(fr, r, false));

    const evicted = evictedRowCount(prevRows, rows);
    if (prevRows && evicted > 0) {
      if (evicted >= prevRows.length) {
        // No overlap: the screen was repainted, or output outran the frame rate.
        // Say so in the output rather than butting unrelated text together.
        kept.push(`<span class="kept-break">${esc(BREAK_RULE)}</span>\n`);
      }
      for (let i = 0; i < Math.min(evicted, prevRows.length); i++) kept.push(prevRows[i]);
      if (kept.length > MAX_KEPT_ROWS) kept.splice(0, kept.length - MAX_KEPT_ROWS);
    }
    prevRows = rows;

    // The live copy differs from the retained one by the cursor alone.
    const live = rows.slice();
    if (fr.cursor_visible && fr.cursor_row < fr.rows) {
      live[fr.cursor_row] = renderRow(fr, fr.cursor_row, true);
    }

    // Follow the tail unless the operator has scrolled up to read something.
    const pinned = screenEl.scrollHeight - screenEl.scrollTop - screenEl.clientHeight < 24;
    applyFit(fr.cols); // before the write: the type size decides scrollHeight
    const head = kept.length ? `<span class="kept-note">${esc(KEPT_NOTE)}</span>\n` : "";
    term.innerHTML =
      (kept.length ? `<span class="kept">${head}${kept.join("")}</span>` : "") + live.join("");
    if (pinned) screenEl.scrollTop = screenEl.scrollHeight;
  }

  function badgeClass(a) {
    if (a.exited) return "b-idle";
    if (a.badge === "Working") return "b-working";
    if (a.badge === "Blocked") return "b-blocked";
    if (a.badge === "Done") return "b-done";
    return "b-idle";
  }

  function renderPicker() {
    // One button per pane we have a frame for, labelled by its agent row when
    // one exists, else "pane N". Selection is local (never sent upstream).
    const byPane = new Map();
    for (const a of agents) if (a.pane_id != null) byPane.set(a.pane_id, a);
    const ids = [...new Set([...frames.keys(), ...byPane.keys()])].sort((x, y) => x - y);
    if (current == null && ids.length) {
      // A pending pane-link want outranks the first-known id: the Layout that
      // reaches here BEFORE any frame would otherwise steal the paint from
      // the wanted pane (renderPicker runs on Layout too, not just frames).
      if (wanted != null && frames.has(wanted)) { current = wanted; wanted = null; }
      else if (wanted == null) current = ids[0];
    }
    picker.innerHTML = "";
    if (!ids.length) {
      const span = document.createElement("span");
      span.textContent = "no panes"; span.style.color = "#5c6577"; span.style.fontSize = "12px";
      picker.appendChild(span); return;
    }
    for (const id of ids) {
      const a = byPane.get(id);
      const btn = document.createElement("button");
      if (id === current) btn.className = "active";
      const label = a ? a.name : `pane ${id}`;
      btn.innerHTML = a ? `<span class="dot ${badgeClass(a)}"></span>${esc(label)}` : esc(label);
      btn.onclick = () => { current = id; renderPicker(); draw(); };
      picker.appendChild(btn);
    }
  }

  // ---- connection banner state machine ----
  function setBar(state, text, sub) {
    bar.className = state; statusEl.textContent = text; subEl.textContent = sub || "";
  }
  function showOverlay(text) { overlay.textContent = text; overlay.classList.add("show"); }

  // ---- message handling ----
  function onMsg(obj) {
    if (obj._bridge) {
      // Bridge-injected upstream status (not a ServerMsg).
      if (obj._bridge.state === "disconnected") {
        upstreamUp = false;
        setBar("disconnected", "reconnecting…", "showing last frame");
      } else if (obj._bridge.state === "connected") {
        upstreamUp = true; setBar("live", "live");
      }
      return;
    }
    if (obj.Frame) {
      const { pane_id, frame } = obj.Frame;
      if (frame.cells.length !== frame.rows * frame.cols) return; // drop malformed
      let dirtyPicker = !frames.has(pane_id);
      frames.delete(pane_id); frames.set(pane_id, frame); // LRU touch: move to newest
      if (frames.size > MAX_PANES) {
        const oldest = frames.keys().next().value; // least-recently-updated
        frames.delete(oldest);
        if (oldest === current) current = null;
        dirtyPicker = true;
      }
      if (upstreamUp) setBar("live", "live");
      if (wanted != null && wantedSince > 0 && Date.now() - wantedSince > 3000) wanted = null;
      if (current == null) {
        // A pasted pane link pins the first paint. Keep waiting for THAT
        // pane's frame - a different pane landing first must not steal the
        // paint (codex P1). Only with no want does the first frame win.
        if (wanted != null && frames.has(wanted)) { current = wanted; wanted = null; dirtyPicker = true; }
        else if (wanted == null) { current = pane_id; dirtyPicker = true; }
      }
      if (dirtyPicker) renderPicker();
      if (pane_id === current) draw();
      return;
    }
    if (obj.Layout) {
      squads = obj.Layout.squads || [];
      agents = obj.Layout.agents || [];
      // An exited agent row is the one pane-death signal on the wire: drop its
      // cached frame so a dead agent stops rendering as a live grid and leaves
      // the picker (a plain non-agent pane's death is invisible without a proto
      // signal, so it ages out via the LRU cap instead).
      for (const a of agents) {
        if (a.exited && a.pane_id != null) {
          frames.delete(a.pane_id);
          if (a.pane_id === current) current = null;
          // A wanted pane that died before painting: stop waiting for it so
          // the page falls back to the first frame to land.
          if (a.pane_id === wanted) wanted = null;
        }
      }
      renderPicker();
      draw();
      return;
    }
    if (obj.Bye) { setBar("ended", "session ended", obj.Bye.reason || ""); showOverlay("session ended\n" + (obj.Bye.reason || "")); return; }
    // Notice / ModeSync / control replies: irrelevant to a read-only viewer.
  }

  // ---- websocket ----
  const token = new URLSearchParams(location.search).get("t") || "";
  // A pasted per-pane link names its pane (x-b80d): pin the first paint to it
  // instead of whichever frame lands first, then clear the want so the operator
  // can still switch panes by hand afterwards. A want that never paints
  // (renumbered or dead pane) is dropped after 3s so the page still opens.
  let wanted = new URLSearchParams(location.search).get("pane");
  let wantedSince = 0;
  if (wanted != null) { wanted = parseInt(wanted, 10); if (Number.isNaN(wanted)) wanted = null; if (wanted != null) wantedSince = Date.now(); }
  function connect() {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(`${proto}://${location.host}/ws?t=${encodeURIComponent(token)}`);
    ws.onopen = () => setBar("connecting", "connecting…", "waiting for first frame");
    ws.onmessage = (ev) => { try { onMsg(JSON.parse(ev.data)); } catch (_) {} };
    ws.onclose = (ev) => {
      // 1008 = policy violation: our token check refused the upgrade. A normal
      // socket close (server/bridge gone) just retries.
      if (ev.code === 1008 || ev.code === 4401) {
        setBar("authfailed", "invalid token", "");
        showOverlay("invalid or missing token");
        return; // do not retry a bad token
      }
      setBar("disconnected", "reconnecting…", "connection lost");
      setTimeout(connect, 1500);
    };
    ws.onerror = () => ws.close();
  }
  connect();
})();
</script>
</body>
</html>
