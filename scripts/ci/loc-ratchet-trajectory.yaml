  - date: 2026-07-27
    pr: null
    branch: feature/x-1386
    delta: 86
    reason: 'one wall-clock bound replaces six hand-rolled copies (x-1386): four of the five pre-existing manifest-matched files shrink (-11, -9, -9, -12, total -41) and the positive delta is the single new scripts/lib/with-timeout.sh plus the frontdoor hook and one comment in eval-sweep-throttle.sh. The five deleted copies each preferred GNU coreutils timeout and then disagreed on the fallback, and measured against a hung child on a coreutils-free PATH only one of the six capped anything: three injection hooks fell through to a bare invocation and ran the full 10s, check-event-schema-parity.sh used a perl alarm that measured 10045ms, and frontdoor-nudge-session-start.sh set an empty prefix so its mux socket probe ran unbounded. Stock macOS ships no timeout(1), so on any host without Homebrew on PATH these guards were decorative, which is the AGENTS.md pitfall about a guard placed on one of N reachable paths, and two of the six copies were not in the plan at all because they were found only by running the uniqueness grep by hand. Of the helper roughly 35 are the function and the rest is the header contract plus three comments that cannot be cut without inviting the defect straight back: set -m spans both background launches because that is what makes the negative-pid kills legal, the watchdog needs its output redirected or it inherits the caller command-substitution pipe and delays even a 50ms success by the full bound (measured), and the watchdog must be group-killed and then reaped or its sleep reparents to pid 1 (the orphan incident eval-sweep-throttle.sh was written to stop, 40 orphaned processes on 2026-07-15) and bash announces Terminated on the caller stderr at the next command boundary. Every one of those three was verified by timed measurement rather than reading, and two of them were caught only because a test went red after the first implementation looked correct. It cannot go off-manifest without gaming the gate: ten hooks already source shared helpers from scripts/lib/, that directory is where a reader looks, and relocating one file to dodge a threshold would leave the include path meaning less than it does now. The alternative of keeping the coreutils preference in front of the bash path was considered and rejected in the plan, because two reachable implementations of one bound is the defect being removed and the bash path caps the hardest measured case in about 2.05s on bash 3.2. No new gate, terminal, loop or merge authority: these are advisory SessionStart and UserPromptSubmit injections that already exited 0 on every failure, plus one CI script whose only change is that a missing library now fails loudly instead of degrading to a silent pass. A new tests/hooks/test_with_timeout.sh (off-manifest, auto-discovered by the smoke runner) pins the cap, the fast path, the absent orphan, the silent stderr and the uniqueness invariant itself, each absence assertion carrying a positive control. The delta grew from 18 to 45 during the sigma review round, and both additions are load-bearing rather than polish. The helper gained a guard that refuses a non-integer bound with rc 2 instead of handing it to sleep: GNU timeout accepted suffixes like 30m and sleep on stock macOS does not, so the one operator-settable bound in the tree (EVAL_SWEEP_STAGE_TIMEOUT, whose sibling knob two lines away defaults to 30m) would have exited the sleep instantly and killed every stage at t equals zero, a misconfiguration indistinguishable from an expired timer. It also gained a sleep-then-kill conjunction so a failed sleep can never fall through to an immediate kill, and a single-pid fallback for a host where set -m did not take effect so the bound cannot silently no-op. The 8 lines in frontdoor-nudge-session-start.sh fix a false negative the working cap newly makes reachable everywhere rather than only where Homebrew supplied the binary: the hook read our own signal status 143 as not-the-Rust-front-door and told the user to install a front door they already have, every session, for as long as the socket stayed wedged. A wedged socket is proof the front door IS present, because fno-py has no mux verb and fails fast with a usage error, so 143 must be distinguished from a real probe failure. That hook was the worst of the six on main, with an empty prefix and therefore no bound at all, and it had the least coverage; it now has a wedged-socket case asserting both a ceiling and a floor. A final 13 lines came from the external codex reviewer, which found that SIGTERM alone is not a bound at all: a child that ignores or traps it leaves the wait with no remaining deadline, so the helper never returns and the caller is stuck rather than merely slow, which is worse than having no cap. Reproduced before fixing, a stub that traps TERM and loops survived a 2s bound while an external guard had to kill the caller. The watchdog now sends TERM, waits one second, then KILLs the group, and a well-behaved child is reaped during the grace sleep so the extra second is never paid on a normal path. This is the last place the bound could be decorative and it cannot be expressed more briefly: the escalation, the group-versus-pid fallback on each signal, and the comment naming why TERM-only was insufficient are each load-bearing. A second review round then took it from 58 to 90. The escalation had made the return two-valued, 143 on the TERM path and 137 on the KILL path, while the one caller that inspects the status recognized only 143, so a TERM-immune wedged socket nagged the user to install a front door they already had. The helper now collapses a fired bound to 124, following the GNU timeout convention, so no caller reads a signal number and the frontdoor comparison is one value; measured, that stub is now bounded at 4s and silent. The same round found that wait returns the instant the direct child dies, which cancelled the pending escalation, so a group member that outlived TERM while holding the caller capture pipe kept the command substitution open forever, an unbounded hang worse than the slow path this helper replaced; the group is now KILLed after wait on the fired-bound path only, because an unconditional group kill would also reap a daemon the command legitimately started and turn a successful call into a side effect. The watchdog kill gained the same single-pid fallback the child kills already had, without which a host where set -m did not take leaves the watchdog alive and the following wait blocks for the FULL bound on an otherwise fast call. Every one of those three is a path on which the bound was still decorative or actively harmful, which is the whole subject of this node, and each carries the comment naming the measurement that found it.'
  - date: 2026-07-27
    pr: null
    branch: feature/x-7d45
    delta: 337
    reason: 'launch-time headroom picking at the loop iteration boundary (x-7d45 task 3.2): the whole delta lands in crates/fno-agents/src/loop_dispatch.rs, the only manifest-matched file in the feature - the repaired usage probe, the register duplicate guard, the one active-account resolver, `fno providers doctor`, `fno providers pick`, the spawn-seam wiring and the error-taxonomy fix all live in cli/src/fno, off the glob. Of the 338 added lines, 181 are implementation plus comments and 157 are co-located #[cfg(test)] tests - nearly half the delta is tests, matching the module convention this crate already follows rather than splitting them off-manifest to game the ratchet. The delta grew from 124 to 199 during cross-model review of the PR, which found two P1 defects in the first cut of this file and both fixes are load-bearing rather than polish. First, the block called the picker unconditionally, so a cross-session target or megawalk loop changed which account it billed on an install where providers.quota.pick_on_launch was the documented default false; the fix passes --if-armed so the verb itself honors the knob, keeping ONE implementation of the opt-in in Python rather than a second copy here that could disagree about whether a run may change billing. Second, the block set only CLAUDE_CONFIG_DIR, so an inherited ANTHROPIC_API_KEY, CLAUDE_CODE_OAUTH_TOKEN or routed ANTHROPIC_BASE_URL still outranked it and the worker could authenticate or bill through a different route while the receipt named the picked account - a receipt that lies, the precise failure this node exists to stop; the fix consumes the COMPLETE overlay the verb now emits (the shared SCRUB_AUTH_VARS list as KEY= meaning clear-this, then the pin) and calls env_remove for the empty-valued keys, so the scrub list also keeps one source of truth in Python. That widened interpret_pick from a single-line parse to a multi-line one, and the added tests pin the new halves: the empty-value scrub grammar is carried through in order, a disarmed picker reads as an ordinary not-picked rather than a pick, and output that pins no config dir is refused outright so a drifted verb can never leave the child with a scrubbed environment and no account. A third defect, found in self-review of the shipped head rather than by a reviewer, added the last ~78 lines and is the one with the widest blast radius: a loop launched against a non-Anthropic endpoint pins ANTHROPIC_BASE_URL and ANTHROPIC_AUTH_TOKEN in its static env (a GLM/zai run is exactly this shape, and is how this machine has been operating), and the overlay clears both while pinning CLAUDE_CONFIG_DIR - so an armed pick would have moved a routed run onto a claude account mid-flight while its receipt claimed only to have picked an account. That is the same half-composed route the Python seam refuses when --account meets --route, and it is now refused here too: pick_would_undo_a_route declines whenever the overlay clear-list names a variable the static env sets. It DERIVES the check from that list instead of restating the variable names, so there is no second copy in Rust to drift, and it is a pure function with three tests (a pinned route blocks, an unrouted loop still picks, and the value-carrying pin itself never counts as a conflict) rather than a condition buried in the dispatch call where nothing could exercise it. The final ~31 lines came from merging origin/main, which renamed the surface this feature extends (`fno providers` -> `fno config accounts`, `ProviderRecord.cli` -> `.harness`) and in doing so broke a LIVE caller in this file: it does not merely mention the verb, it shells it, and `fno providers pick` now exits 2. Because every failure on this path is deliberately advisory so a stale binary cannot wedge the loop, the break would have degraded silently forever instead of failing loudly once - the feature would simply never have picked, on the one path that exists to keep an unattended run alive, which is the exact shape of the pitfall AGENTS.md added about a rename whose surviving callers no rg sweep found. The argv is therefore a named constant, PICK_ARGV, and a cross-language test in cli/tests/unit/test_launch_pick.py reads it out of this source and asserts it resolves to a real command with real options, with a positive control so a CLI that exited 0 on everything could not make the assertion vacuous. Naming the argv is what makes it checkable from outside Rust; prose can drift through a rename unnoticed, a failing test cannot. A final ~5 lines fix a receipt gap a third review round found: the loop announced a pick only when the overlay carried CLAUDE_CONFIG_DIR, but since the api_key fix above any value-carrying key is a valid pin, so a claude api_key account could move billing with no `account picked` line at all - an unannounced billing change, the one thing this feature must never do. The receipt now names whichever key carried the pin. The sigma panel then caught that fix leaking a credential, which is the last ~24 lines: for a claude api_key account the pin IS ANTHROPIC_API_KEY, so naming the key AND its value wrote the secret to the loop's stderr on every iteration, breaking the contract this module states in its own header that no token or credential material is ever logged, emitted, or persisted. The receipt still fires for every pick, which is the property that fix added and must keep, but it echoes the value only for CLAUDE_CONFIG_DIR - a filesystem path - and otherwise names the key and stops. A test pins the branch condition so a later edit cannot put the value back into the log. The change closes the one gap the rest of the feature structurally cannot reach: a claude process reads CLAUDE_CONFIG_DIR once at launch, so no in-session credential swap exists and every account switch must happen at a process boundary; the Python spawn seam covers `fno agents spawn`, but the external loop execs `claude --print` through its driver libs and never crosses that seam, so an autonomous run still died on an exhausted account with nothing to pick up. The implementation is the minimum that closes it: one const naming the single env var a pick contributes, a pure `interpret_pick` that maps (exit status, stdout, stderr) to either a config dir or the reason it declined, a `pick_account_dir` that shells `fno providers pick --print-env` and hands the result to it, and one guarded block in ShelloutDispatcher::run that adds the picked dir to the child env. It cannot move off the manifest because ShelloutDispatcher::run IS the seam every driver crosses - it already passes static env through to the `bash -c` it spawns, and every driver harness process is a child of that bash, so this is the one place where all four driver libs (claude-code, hermes, openclaw, opencode) inherit the decision at once. The alternative placement, driver_invoke, would be four copies of one decision in four shell files, which is precisely the decorative-guard shape this repo corpus names; a test asserts no driver lib grew its own picker call and carries a positive control (scanned >= 4) so a drifted glob cannot report that coverage vacuously. Rust shells the verb rather than reimplementing the predicate, so headroom, combo order and launchability keep exactly one implementation and it is in Python. Structurally incapable of wedging the loop: `pick_account_dir` returns Err for every failure mode - a spawn failure from an absent or stale `fno`, a non-zero exit, unparseable stdout - and the single caller logs the reason and proceeds on today environment, so the dispatch path is byte-identical to before whenever the picker does not produce a usable answer. An operator-pinned CLAUDE_CONFIG_DIR in the static env short-circuits the call entirely, mirroring the rule that an explicit --account is never second-guessed. The three interpret_pick tests each pin a distinct property a later edit would otherwise silently revert: a refusal must surface its reason rather than collapsing to a bare failure (exhausted and not-set-up are different operator actions), and unparseable stdout must be declined rather than half-read into an env var, which is how a drifted verb would otherwise pin a worker to a garbage path. No new terminal, no new allow path, no completion or merge authority: this changes which credential an iteration launches with, never whether the loop may stop. Cumulative control-plane LOC stays far ahead of baseline (debt repaid).'
