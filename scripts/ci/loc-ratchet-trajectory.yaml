ritten by shelling a heredoc is not parsed. plans-dir.sh exists so the two halves share ONE answer about where plans belong, resolving through `fno plan path`, the verb that already owns the plansDirectory to config.plans_dir precedence chain. Wired on BOTH hooks.json and codex-hooks.json: the repo pitfalls corpus names a guard on one of N reachable paths as decorative, and worktree-write-protect.sh is codex-only today. No loop, completion, dispatch, or merge authority changes: both guards are PreToolUse, exit 0 on every path, and only decide whether one write proceeds. The delta grew from an initial +286 to +438 entirely on findings from four sigma panel rounds, and every added line closes a defect that was reproduced first. The carve-out could DISABLE the gate it carves out of: plansDirectory accepts any path including a dot, and with the plans dir an ancestor of the checkout a plain source write on canonical main was approved, with a tracked in-repo plans dir the milder version of the same hole - so a safety predicate now requires the plans dir to be neither an ancestor of the cwd nor a tracked directory inside it, and fails closed. A plans dir that did not exist yet was judged OUTSIDE ITSELF, because resolving a path to its deepest existing ancestor lands on the plans dir parent: the guard blocked the correct save with a message naming that same directory as the right destination, and the carve-out silently never fired, so the bug this PR exists to fix returned on first use in every fresh clone or worktree - a lexical containment test answers that, skipped for dotdot paths, with the physical test still catching symlinks. Both guards read the WRONG cwd, anchoring relative targets and the repo-anchored plans-dir probe to the cwd the harness happened to spawn the hook in rather than the session cwd, which on a worktree or multi-repo dispatch names another project entirely. A partially-sourced helper silently disabled the per-path canonical check, because bash defines functions as it parses and the guard checked only the first of four names, after which the loop hit 127 and skipped every target - fail-open on exactly the resolver failure the carve-out treats as fail-closed. A markdown target test keeps the roughly half-second CLI resolve off the source-edit path. Tests went 21 to 30 and the additions are the load-bearing part: the panel proved the original E-section VACUOUS by mutation, since E1/E2 ran from a non-git temp dir where the location gate returns before any verdict, so restricting the carve-out to patch payloads left 21/21 green while reinstating the bug for every Write, and the fake fno ignored argv so dropping the required --slug also stayed green while the real resolver would fail forever and both guards would fail open. Every new test is mutation-verified individually. Neither hook wiring was asserted anywhere, so deleting either registration left the suite green and the guard decorative on that harness; the hooks-json test now pins both. A second panel round then took it to +408, and the largest part of that is a SHAPE correction rather than more special-casing. The round-1 answer to the absent-plans-dir defect was a lexical containment test layered on the physical one, and the panel found its seam: a symlink leading out of an existing plans dir satisfied the lexical prefix and carved itself out. The real defect was a namespace mismatch, since cd -P cannot enter a directory that does not exist, so an absent plans dir stayed logical while a real target resolved physical and the two could never match; resolving any path deepest EXISTING ancestor physically and re-appending the missing tail makes containment ONE comparison in ONE namespace, and the lexical shortcut is deleted rather than patched. Three more, each reproduced: the safety predicate compared against the session cwd rather than the checkout root, so a session one directory deep put a tracked in-repo plans dir outside the checkout and reopened the hole round 1 had just closed; only the negative guard received the round-1 cwd fix, leaving the positive guard resolving the plans dir from whatever cwd the harness spawned it in, which reinstates this PR own headline bug on a worktree or multi-repo dispatch and proves that sharing a resolver is not the same as sharing an anchor; and the round-1 fallback in the per-path loop was dead code, since the unconditional call above it had already exited on that verdict, so it is removed and the gap it aimed at is fixed properly by having _target_directory fall back to dirname, without which a half-sourced helper routes every target into a silent skip and leaves the degraded mode WEAKER than the guard was before the helper existed. Tests went 30 to 45. The panel found SEVEN mutants surviving the round-1 suite; each now has a case and each case was verified to kill its mutant, and two of the author own tests were themselves vacuous - F1 used a .py target so the markdown pre-filter short-circuited before the safety predicate was ever called, and H1 put every dotdot intermediate on disk where cd -P folds it correctly either way. Two guards remain unkillable by design and are documented as such rather than claimed as covered, since the slash-root refusal and the four-name declare check are each belt-and-braces where another mechanism independently enforces the same outcome. A third round took it to +433 on one HIGH and two supporting fixes. Round 2 closed the DIRECTORY-symlink form of the containment bypass and the FILE form was still open, which is the ordinary shape rather than an exotic one because the plans dir is normally an Obsidian vault where symlinked notes are unremarkable: fno_physical_path walks up while not-a-directory, so an existing symlink to a file fails that test and is peeled into the not-yet-created tail where nothing dereferences it, and a plans dir holding a link to a tracked source file therefore satisfied containment, took the carve-out, and approved a write onto the shared branch. Reproduced both ways, since the symlink approved from canonical main while writing the same real file directly blocked. The path itself is now dereferenced with the bounded readlink walk fno_resolve_dir already carried, so a link resolves the same whether it sits at the leaf or at an ancestor, and a path that does not exist has no link to follow so the absent-plans-dir case is untouched. The positive guard also had no completeness check on its sourced helper, and since sourcing a truncated file still exits 0 while a missing containment test reads as not-under-the-plans-dir, it would DENY a correct save while naming that same directory as the destination, contradicting its own fail-open contract; the sibling guard already had that check. And the third arm of the frontmatter grammar was unpinned, so dropping it and blocking every node-plus-slug document left the suite green. Tests went 45 to 49 with each new case verified to kill its mutant, the harness is now runnable from any cwd (three repo-relative paths in a file that computes REPO_ROOT precisely so it need not), and the panel independently confirmed the two documented survivors are genuinely redundant while finding a third of the same family. Cumulative control-plane LOC remains above baseline (initiative still in debt).'
