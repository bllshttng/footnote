  # ── loop-check target-stream events (Task 1.1) ──────────────────
  # Emitted by the Rust `fno-agents loop-check` verb and (for
  # loop_check_binary_missing) by the bash stop-hook shim. Source is always
  # "hook" (the stop hook fires them). These are target-stream events distinct
  # from the Branch B fno-agents daemon stream (KNOWN_EVENT_KINDS in lib.rs).
  # The event writer is named `append_loop_event` (not .emit / .emit_fields) to
  # avoid triggering the agents-schema parity scan.

  - name: loop_check
    description: "Appended on every stop-hook fire. Carries the 4-component fingerprint, fire count, decision, intent, and external-read summary."
    sources: [hook]
    data:
      required: [session_id, fingerprint, fires, consecutive_unchanged, decision, intent, pr_state, ci, reviewed]
      properties:
        session_id:
          type: string
          description: "Target session identifier from the manifest."
        fingerprint:
          type: string
          description: "4-component fingerprint: HEAD sha | pr_state | ci_conclusion | latest_review_or_comment_ts."
        fires:
          type: integer
          description: "Total stop-hook fires for this session (including this one)."
        consecutive_unchanged:
          type: integer
          description: "Consecutive OBSERVATIONS of an identical fingerprint (including this one). Not a fire count: fires closer together than the debounce gap (FNO_LOOPCHECK_MIN_FIRE_GAP_SECS, default 300s) collapse into a single observation, so reaching N implies at least (N-1)*gap seconds of unchanged world. A changed fingerprint breaks the streak at any spacing. Reaches N -> backstop."
        streak_window_secs:
          type: integer
          description: "Elapsed seconds from the oldest COUNTED fire in the streak to now; 0 when no prior fire was counted. Makes consecutive_unchanged falsifiable from the log - without it a streak count cannot be distinguished from a rapid burst."
        decision:
          type: string
          enum: [allow, block]
          description: "The decision made this fire."
        intent:
          type: string
          enum: [promise, aborted, watching, backstop, none]
          description: "Intent detected in the transcript. 'watching' = the agent declared an armed async watcher and the fire idled non-terminally (x-e2c8)."
        intent_source:
          type: string
          enum: [payload, transcript]
          description: "Optional. Which channel produced the intent read: 'payload' = last_assistant_message from the Stop-hook stdin JSON (race-free, primary); 'transcript' = bounded fallback scan over the transcript file (payload absent: tool-call-only turn, old shim, or non-Claude harness). A fleet of 'transcript' sources after shim rollout signals a harness regression."
        pr_state:
          type: string
          description: "GitHub PR state: OPEN, MERGED, CLOSED, or none (no PR)."
        ci:
          type: string
          description: "CI conclusion: SUCCESS, FAILURE:<name>, PENDING, skipped, none, unknown."
        reviewed:
          type: boolean
          description: "True when every bot in config.review.required_bots has a completed review pass AND no blocking inline finding is unaddressed (step 2)."
        fp_read_failed:
          type: boolean
          description: "Optional. True when the fingerprint pre-read gh call hard-failed this fire (outage). The fingerprint was carried forward from the prior event; step 2 makes these fires transparent to the consecutive-unchanged streak."
        review_skipped:
          type: boolean
          description: "Optional (done-path fires). True when Reads 3+4 were skipped: per-session no_external or the repo declared required_bots: [] (AC3-UI observability)."
        unaddressed_blocking:
          type: integer
          description: "Optional (done-path fires). Count of blocking inline findings (codex P1 / gemini critical|high) whose thread lacks a qualifying ack."
    consumers: [operator]

  - name: termination
    description: "Emitted when the loop-check verb produces an allow decision that ends the session. Carries the TerminationReason enum value and (for Budget) the axis."
    sources: [hook]
    data:
      required: [session_id, reason, message]
      properties:
        session_id:
          type: string
          description: "Target session identifier."
        reason:
          type: string
          enum: [DonePRGreen, DoneUnreviewed, DoneAdvisory, DoneDelivery, DoneBatched, NoWork, Budget, NoProgress, Interrupted, Aborted]
          description: "TerminationReason enum value."
        axis:
          type: string
          enum: [wall_clock, cost]
          description: "Budget axis (wall_clock or cost). Present only when reason=Budget."
        message:
          type: string
          description: "Human-readable termination message."
    consumers: [operator, megawalk]

  - name: mail_escalation
    description: "Send-time human escalation for mail that needs a human now: a --kind question (unconditional, Locked Decision 7) or a live-miss to an operator-attended recipient (declared at registration). Surfaces in the needs-me mux overlay so a human at the mux sees the nudge even when the OS notification was missed, debounced, or unavailable. Emitted from the shared escalation helper under the same per-(sender,recipient) debounce as the notifier; one event per non-debounced escalation."
    sources: [target]
    data:
      required: [reason, sender, recipient, summary]
      properties:
        reason:
          type: string
          enum: [question, attended-miss]
          description: "'question' = a --kind question send (unconditional escalation, never autonomous-answered); 'attended-miss' = a send to an operator-attended session that fell to the durable floor (live-miss only)."
        sender:
          type: string
          description: "Sender handle/project of the escalated mail."
        recipient:
          type: string
          description: "Recipient the escalation is about (canonical handle or project)."
        summary:
          type: string
          description: "First line of the mail body, truncated at emit so the overlay row stays bounded."
        msg_id:
          type: string
          description: "Optional. The mail message id (msg-<id>) when the escalation site has it, for overlay-to-thread correlation."
    consumers: [operator]

  - name: operator_question
    description: "An agent asked the operator something and needs an answer to proceed. Captured AT ASK TIME rather than derived later from transcript shape: session_truth classifies from the tail (records[-1]), so a question survives only while it is the last assistant turn, and in a mail-driven mesh where fno mail send injects user-shaped text the agent answers the mail and its own earlier question stops existing for the detector. A fact recorded when it is true does not evaporate. Deliberately NOT a carveout --kind question: the word is wrong for a question, and routing questions through that verb would raise carve-out volume, which is the thing the last-resort rewrite exists to lower. Folded by `fno outstanding` and rendered in the SessionStart block; the field names match what a future needs.rs fold arm (NeedKind::Decision) would read unchanged."
    sources: [target, hook, subagent, daemon, test]
    data:
      required: [question_id, question]
      properties:
        question_id:
          type: string
          description: "Stable id for this question (q-<hex>), the handle `fno outstanding clear` takes."
        question:
          type: string
          description: "The question text as asked, truncated at emit so the render stays bounded."
        session_id:
          type: string
          description: "Optional. The asking session, so the SessionStart block can separate 'yours' from 'everyone's'."
        cwd:
          type: string
          description: "Optional. The asking session's working dir, so a cross-project question names its project."
        node:
          type: string
          description: "Optional. The backlog node the question is about, when the asking session has one bound."
    consumers: [operator]

  - name: operator_question_closed
    description: "An operator_question was answered or withdrawn. Explicit close only: there is no auto-expiry and no transcript-derived auto-resolution, because peek.Record carries role and text but no timestamp, so answering 'is there a user turn newer than this question' would need a new timestamped reader in every harness arm. An explicit clear costs nothing and never lies about whether an answer actually arrived. A question going quiet with age is the exact failure being fixed, so age never closes one. Append-only with a last-writer-wins fold: a double close is a no-op, not an error."
    sources: [target, hook, subagent, daemon, test]
    data:
      required: [question_id]
      properties:
        question_id:
          type: string
          description: "The operator_question this closes."
        answer:
          type: string
          description: "Optional. The answer text, recorded so the decision survives the session that made it."
        closed_by:
          type: string
          description: "Optional. Session id that closed it, which need not be the session that asked."
    consumers: [operator]

  - name: agent_raw_inject
    description: "Provenance record for an UNWRAPPED injection: a payload delivered to a live session without the <fno_mail> envelope, so the transcript no longer carries the agent-authored marker. Emitted at the transport (the mail-inject binary and the mux pane send), keyed on 'payload does not start with <fno_mail', so it covers fno mail send --raw, a direct fno-agents mail-inject, and any future caller. Moves x-f26c's greppability property from the transcript to the ledger: an unwrapped injection has no envelope to grep, so this event is the audit trail. Best-effort; an events-write failure never breaks an injection."
    sources: [daemon]
    data:
      required: [target_session, payload, harness, lane]
      properties:
        sender:
          type: string
          description: "Optional. Sender mail handle when the invoking layer knows it; absent for a direct binary call. Equals target_session on a self-injection (AC27)."
        target_session:
          type: string
          description: "Recipient session the payload was injected into (full UUID or handle)."
        payload:
          type: string
          description: "The injected text, verbatim when short (a slash command) and truncated for the event line when long. Leading-slash is the marker a human reads as 'invocation, not a typed ruling'."
        harness:
          type: string
          description: "Recipient harness: claude, codex, etc."
        lane:
          type: string
          description: "The live lane used: control.sock (claude), codex-daemon, or mux-pane."
        target_cwd:
          type: string
          description: "Optional. Recipient working dir, for the authorship join (did the sender author that sha?)."
        target_head:
          type: string
          description: "Optional. Recipient repo HEAD, same join. Records facts only; carries no computed self-review verdict."
        confirmed:
          type: boolean
          description: "Optional. The transport's own answer, recorded after the send so the record never asserts an injection a stalled pane or an absent daemon never performed. False covers both a clean refusal (nothing sent) and a payload that landed past the confirm budget - the transport returns one bool for both."
    consumers: [operator]

  - name: loop_check_gh_error
    description: "Emitted when a gh read fails during a loop-check fire. The fire returns block so the loop retries; this event is the forensic trail."
    sources: [hook]
    data:
      required: [session_id, read, stderr_tail]
      properties:
        session_id:
          type: string
          description: "Target session identifier."
        read:
          type: string
          description: "Which gh read failed: pr_view, pr_checks, pr_reviews, pr_reviews_parse, pulls_comments, pulls_comments_parse, pr_commits, pr_commits_parse, etc."
        stderr_tail:
          type: string
          description: "Last few lines of gh stderr, or empty string if unavailable."
    consumers: [operator]

  - name: loop_check_config
    description: "Emitted once on the first loop-check fire of a session, recording the resolved CLAUDE_CODE_STOP_HOOK_BLOCK_CAP so a run force-ended by the harness override (blocks meeting the cap, then silence) is distinguishable from a budget end (a terminal budget decision)."
    sources: [hook]
    data:
      required: [session_id, block_cap, block_cap_source]
      properties:
        session_id:
          type: string
          description: "Target session identifier."
        block_cap:
          type: integer
          description: "The resolved consecutive Stop-hook block cap (CLAUDE_CODE_STOP_HOOK_BLOCK_CAP; Claude Code default 9)."
        block_cap_source:
          type: string
          enum: [env, default]
          description: "Whether block_cap came from the environment (operator override) or the harness default."
    consumers: [operator]

  - name: loop_check_watch_idle
    description: "Emitted when a loop-check fire idles a session non-terminally on a verified async wait after the agent declared a <watching> tag (x-e2c8). The claim lease was extended to cover the watch window; the session parks until its harness-tracked watcher fires. On codex this event doubles as the daemon's watch registration."
    sources: [hook]
    data:
      required: [session_id, pr, blocker, lease_ms]
      properties:
        session_id:
          type: string
          description: "Target session identifier."
        pr:
          type: integer
          description: "PR number the session is watching."
        blocker:
          type: string
          enum: [ci, review]
          description: "The async blocker being waited on: 'ci' (checks pending) or 'review' (a bot review outstanding)."
        declared_timeout:
          type: string
          description: "Optional. The raw timeout attribute from the <watching> tag (e.g. '30m'), or empty when absent."
        reason:
          type: string
          description: "Optional. The raw reason attribute from the <watching> tag."
        lease_ms:
          type: integer
          description: "The claim-lease window (ms) the fire renewed to cover the watch: declared timeout clamped to [5m,2h] plus slack."
    consumers: [operator]

  - name: loop_advisory_mode
    description: "Emitted each fire when the loop-check verb runs in advisory mode (gh binary absent, attended session). The verb still runs promise+budget checks but cannot read PR state."
    sources: [hook]
    data:
      required: [session_id, attended]
      properties:
        session_id:
          type: string
          description: "Target session identifier."
        attended:
          type: boolean
          description: "True when the manifest declared attended=true."
    consumers: [operator]

  - name: loop_check_binary_missing
    description: "Emitted by the bash stop-hook SHIM when the fno-agents binary cannot be found via any resolution path. The shim allows exit rather than creating an unrecoverable block loop."
    sources: [hook]
    data:
      required: [session_id]
      properties:
        session_id:
          type: string
          description: "Target session identifier (best-effort; may be empty if manifest unreadable)."
    consumers: [operator]

  - name: loop_check_legacy_manifest
    description: "Emitted once when the loop-check verb encounters a pre-wedge state file whose status field is COMPLETE, BLOCKED, or ABORTED. The verb allows exit for back-compat."
    sources: [hook]
    data:
      required: [session_id, status]
      properties:
        session_id:
          type: string
          description: "Target session identifier."
        status:
          type: string
          enum: [COMPLETE, BLOCKED, ABORTED]
          description: "Legacy status value found in the manifest."
    consumers: [operator]

  - name: loop_unit_dispatched
    description: "Emitted by the unified loop runtime (fno-agents loop run) before each unit dispatch."
    sources: [loop]
    data:
      required: [session_id, unit_id, iteration]
      properties:
        session_id:
          type: string
          description: "Correlation key for the dispatched session (matches data.session_id in the termination event)."
        unit_id:
          type: string
          description: "Identifier of the unit being dispatched (e.g. ab-XXXXXXXX for a backlog node)."
        iteration:
          type: integer
          description: "1-based iteration counter across all units in this walk."
        title:
          type: string
          description: "Optional human-readable title of the unit."
    consumers: [operator, megawalk]

  - name: node_failed
    description: "Synthesized when a dispatched session exits without a TerminationReason event: either immediately by the per-unit watchdog, or when dead-row GC reaps a convention-named target/reconcile worker that never terminated (x-5c08). Group-2 walk and dispatcher policy count both toward the same consecutive-failure streak."
    sources: [loop, daemon]
    data:
      required: [session_id, unit_id, iteration, exit_code]
      properties:
        session_id:
          type: string
          description: "Correlation key for the session that exited without a termination event."
        unit_id:
          type: string
          description: "Identifier of the unit whose session exited unexpectedly."
        iteration:
          type: integer
          description: "Walk iteration at which this failure occurred."
        exit_code:
          type: integer
          description: "Exit code returned by the session. When the process died by signal N rather than a clean exit, this field carries 128+N (the shell convention: e.g. SIGTERM=15 -> 143, SIGKILL=9 -> 137)."
        short_id:
          type: string
          description: "Daemon worker short id when the failure was reconstructed from dead-row GC."
        reason:
          type: string
          description: "Machine-readable reconstruction reason when the failure came from a later lifecycle seam."
    consumers: [operator, megawalk]

  - name: walk_paused
    description: "Emitted by the unified loop runtime (run_loop) when walk policy requests a pause before loop_terminated(NoProgress). Carries the policy name and detail so operators can diagnose why the walk stopped early. Always followed by loop_terminated{reason: NoProgress} in the same walk. The legacy walker_paused kind (megawalk.py) maps to this."
    sources: [loop]
    data:
      required: [policy, detail, iterations_used, units_closed]
      properties:
        policy:
          type: string
          enum: [consecutive_failures, p0_failed]
          description: "Short tag identifying the walk policy that triggered the pause. consecutive_failures: streak of 3+ non-Done closes. p0_failed: a p0-priority unit closed with a non-Done reason."
        detail:
          type: string
          description: "Human-readable detail. For consecutive_failures: space-separated unit IDs in the streak. For p0_failed: the unit ID."
        iterations_used:
          type: integer
          description: "Walk iteration count at pause time."
        units_closed:
          type: integer
          description: "Number of units that reached the close step before the pause."
    consumers: [operator, megawalk]

  - name: node_closed
    description: "Emitted by the unified loop runtime after EVERY queue.close() call, including resume-guard closes (no dispatch occurred), normal termination closes, and per-unit cap parks. Provides per-unit close visibility in the event stream so TUI and progress-line consumers see close outcomes without polling queue state. The legacy node_complete and node_parked kinds (megawalk.py) map to this."
    sources: [loop]
    data:
      required: [unit_id, session_id, reason, close, detail, iterations_used]
      properties:
        unit_id:
          type: string
          description: "Identifier of the unit that was closed (e.g. ab-XXXXXXXX)."
        session_id:
          type: string
          description: "Correlation key for the session associated with this unit."
        reason:
          type: string
          description: "TerminationReason string from the evidence that drove the close (e.g. DonePRGreen, Budget, NoProgress)."
        close:
          type: string
          enum: [closed, parked, refused]
          description: "What the queue did: closed (node marked done), parked (deferred for retry), refused (queue rejected the close)."
        detail:
          type: string
          description: "Detail string from the Parked or Refused outcome; empty string for Closed."
        iterations_used:
          type: integer
          description: "Walk iteration count at close time."
    consumers: [operator, megawalk]

  - name: loop_terminated
    description: "The loop runtime's walk-level terminal event. Distinct from `termination` (a session's terminal event emitted by loop-check)."
    sources: [loop]
    data:
      required: [reason, iterations_used, units_closed]
      properties:
        reason:
          type: string
          enum: [DonePRGreen, DoneAdvisory, DoneDelivery, NoWork, Budget, NoProgress, Interrupted, Aborted]
          description: "Walk-level TerminationReason value."
        iterations_used:
          type: integer
          description: "Total iteration count consumed across all units in this walk."
        units_closed:
          type: integer
          description: "Number of units that reached the close step during this walk."
        axis:
          type: string
          enum: [iterations, wall_clock, cost]
          description: "Budget axis. Present only when reason=Budget."
        session_id:
          type: string
          description: "Optional session correlation key (populated when termination is triggered mid-unit)."
    consumers: [operator, megawalk]

  - name: delegated
    description: "Emitted by handoff.sh when a target session successfully delegates its remaining pipeline to a fresh successor session. Records the full lineage chain: node, from/to session pair, boundary type, and generation number. The terminal-session resolution rule (sec 2.5) follows these events to judge promise/completion for megawalk pre-advance verification."
    sources: [target]
    data:
      required: [node_id, from_session, to_session, boundary, generation]
      properties:
        node_id:
          type: string
          description: "The backlog graph node ID being delegated (e.g. ab-XXXXXXXX)."
        from_session:
          type: string
          description: "Session ID of the parent (delegating) session."
        to_session:
          type: string
          description: "Agent name of the spawned successor (e.g. tgt-1a2b3c4d-g2). Used by megawalk lineage resolution."
        child_session:
          type: string
          description: "Short session ID returned by fno agents spawn for the spawned child. May be empty if the registry row was confirmed by name lookup rather than by short-id."
        boundary:
          type: string
          description: "Pipeline boundary at which the handoff occurred (e.g. blueprint-do, wave)."
        generation:
          type: integer
          description: "Generation number of the successor session (parent is N-1; first handoff produces generation 2)."
        harness:
          type: string
          description: "Owning harness of the delegating (parent) lineage (codex/claude/gemini). Namespaces the successor name (tgt-<node>-<harness>-gN) and scopes the generation count per (node, harness) so two harnesses cannot collide on one registry name (x-3e70). Absent on pre-change events."
    consumers: [hooks/megawalk-stop-hook.sh, operator]

  - name: handoff_failed
    description: "Emitted by handoff.sh when the ordered succession protocol fails after any state mutation. Signals that the parent session has re-acquired its node claim and restored its target-state.md so it can continue in-session. The reason field indicates the failure stage."
    sources: [target]
    data:
      required: [node_id, session_id, reason]
      properties:
        node_id:
          type: string
          description: "The backlog graph node ID for which the handoff was attempted."
        session_id:
          type: string
          description: "Session ID of the parent session that attempted the handoff."
        reason:
          type: string
          description: "Machine-readable failure reason (e.g. spawn_failed, verify_timeout, release_failed, restore_failed)."
        detail:
          type: string
          description: "Optional human-readable detail about the failure (truncated to 200 chars)."
    consumers: [operator]

  - name: handoff_probe_unreadable
    description: "Emitted by handoff.sh when the context-probe.sh exits non-zero (transcript missing, unparseable, or jq unavailable) during precondition evaluation for a pressure boundary. The parent treats this as no-pressure and continues in-session. Observability signal so operators can detect silently-broken context monitoring."
    sources: [target]
    data:
      required: [node_id, session_id]
      properties:
        node_id:
          type: string
          description: "The backlog graph node ID for which the probe was attempted."
        session_id:
          type: string
          description: "Session ID of the parent session."
        probe_exit:
          type: integer
          description: "Exit code returned by context-probe.sh."
        transcript_path:
          type: string
          description: "Transcript path that was probed (best-effort; may be empty if manifest was unreadable)."
    consumers: [operator]

  - name: advance_dispatched
    description: "Emitted by `fno backlog advance` (merge-triggered auto-continue) when it dispatches a fresh background /target no-merge worker for the next now-unblocked node after a PR merge. Also emitted by advance_dependents when it dispatches a now-unblocked direct blocked_by dependent: cross-project into its own work-map repo (cross_project=true, G1) or same-project into its own project root (cross_project=false, RC1/x-33b2; work-map resolved, recorded cwd as fallback). Surfaced in the next SessionStart reconcile reminder line."
    sources: [backlog]
    data:
      required: [node_id]
      properties:
        node_id:
          type: string
          description: "The next backlog node dispatched (e.g. ab-XXXXXXXX)."
        short_id:
          type: string
          description: "Short id of the spawned claude bg worker (from the spawn receipt)."
        agent_name:
          type: string
          description: "Spawned agent name (target-<full-node-id>-<slug>)."
        closed_node_id:
          type: string
          description: "The just-merged node whose close triggered this advance (keying for AC1-RACE)."
        cross_project:
          type: boolean
          description: "True when this dispatch followed a blocked_by edge into a DIFFERENT project (G1 advance_dependents), spawned with --cwd the dependent's own work-map root. False for a same-project dispatch: either the next-node advance, or a same-project direct dependent spawned with --cwd its own project root (RC1/x-33b2; work-map resolved, recorded cwd as fallback)."
        mission:
          type: string
          description: "The epic id whose epic advance / mission drain dispatched this child (x-9608 K1). Present only on a mission dispatch; omitted on the merge-advance and next-node paths."
    consumers: [operator]

  - name: advance_skipped
    description: "Emitted by `fno backlog advance` (and advance_dependents / epic advance) when it deliberately dispatches nothing. The reason discriminates disabled / no-work / walker-live / already-claimed / next-error / claim-error plus the dependent-path reasons unmapped-project / no-project / no-cwd / dependents-error / closed-project-unknown and the epic-advance-path reasons lane-cap / children-error. Pure skips stay quiet to the user; dispatched/failed outcomes are the loud ones."
    sources: [backlog]
    data:
      required: [reason]
      properties:
        reason:
          type: string
          enum: [disabled, walker-live, no-work, already-claimed, next-error, claim-error, unmapped-project, no-project, no-cwd, dependents-error, closed-project-unknown, quota-deferred, lane-cap, children-error]
          description: "Why advance dispatched nothing this run. The dependent-path reasons (advance_dependents): unmapped-project = a cross-project dependent's project is not in config.work.workspaces (refused, not guessed); no-project = the dependent carries no project; no-cwd = a same-project dependent has no recorded cwd (fail-closed rather than guess canonical main, RC1/x-33b2); dependents-error = the graph read for direct dependents failed; closed-project-unknown = the closed node's project could not be resolved, so same- vs cross-project cannot be told apart and nothing is dispatched (fail-closed, RC2/x-33b2); quota-deferred = the node's resolved provider has no quota headroom and defer_dispatch is on (x-5d3e), so it stays ready until the reset. The epic-advance-path reasons (epic advance, x-9608 K1): lane-cap = the child's project is at its per-project config.parallel.max_lanes concurrency cap this pass; children-error = the ready-leaf-children read for the epic failed."
        node_id:
          type: string
          description: "The candidate next node, when a reason references one (already-claimed, quota-deferred, lane-cap, unmapped-project)."
        closed_node_id:
          type: string
          description: "The just-merged node whose close triggered this advance."
        mission:
          type: string
          description: "The epic id whose epic advance / mission drain produced this skip (x-9608 K1). Present only on a mission skip."
        provider:
          type: string
          description: "The resolved provider record id whose quota drove a quota-deferred skip (x-5d3e)."
        retry_at:
          type: number
          description: "Unix epoch seconds of the provider's window reset on a quota-deferred skip (x-5d3e)."
        detail:
          type: string
          description: "Optional human-readable detail (e.g. the next-error message), truncated."
    consumers: [operator]

  - name: advance_failed
    description: "Emitted by `fno backlog advance` when the worker spawn failed after the dispatch reservation was acquired. advance releases the node's dispatch reservation and the host op (reconcile/post-merge) still completes; the next SessionStart reconcile retries (AC2-FR). Surfaced loudly in the next reconcile reminder."
    sources: [backlog]
    data:
      required: [node_id, error]
      properties:
        node_id:
          type: string
          description: "The node whose worker spawn failed."
        error:
          type: string
          description: "Failure detail (truncated to 200 chars)."
        closed_node_id:
          type: string
          description: "The just-merged node whose close triggered this advance."
        mission:
          type: string
          description: "The epic id whose epic advance / mission drain attempted this child (x-9608 K1). Present only on a mission dispatch failure."
    consumers: [operator]

  - name: mission_activated
    description: "Emitted by `fno backlog advance --epic <id>` (x-9608 K1) on the first epic advance of an epic mission: the epic node is marked mission_active=true (a durable graph field K2's drain loop reads) and converge pass 1 begins. Emitted once per activation - a re-run of an already-active mission runs the idempotent converge pass without re-emitting this. A mission is an epic node plus its transitive children (the parent edge is the mission key; mission_id is untouched)."
    sources: [backlog]
    data:
      required: [epic_id]
      properties:
        epic_id:
          type: string
          description: "The epic (container) node id marked active."
    consumers: [operator]

  - name: mission_deactivated
    description: "Emitted by `fno backlog advance --epic <id>` (x-9608 K1) when a mission is deactivated: an explicit `--stop` (reason=stop), or an epic advance on an epic whose children are all already done (reason=complete). The durable mission_active field is cleared. The cascade-close path (a mission's last child merging) also clears mission_active but does not emit this event - the child's close events carry that."
    sources: [backlog]
    data:
      required: [epic_id, reason]
      properties:
        epic_id:
          type: string
          description: "The epic (container) node id deactivated."
        reason:
          type: string
          enum: [stop, complete]
          description: "stop = explicit `--epic <id> --stop`; complete = an epic advance found every child already done (mission finished)."
        epic_closed:
          type: boolean
          description: "On reason=complete, whether the epic node itself is already closed (completed_at set). False flags a stranded all-done epic for reconcile self-heal."
    consumers: [operator]

  - name: dispatch_failover
    description: "Emitted by an autonomous launcher (`fno backlog advance`, `fno dispatch`, or the shell dispatcher `dispatch-node.sh`) when config.dispatch.on_exhaustion='failover' and the shared route selector chose a cutover instead of a defer: the node launched on the next healthy record in the active combo, which may be on another harness (claude->codex). Emitted only AFTER the spawn succeeds - a routing decision is not a completed cutover. From `backlog advance` it is paired with the following advance_dispatched (the receipt of the switch, not a competing decision); `fno dispatch` and the shell dispatcher report their launch in their own verdict line and emit this receipt alone. A whole-combo exhaustion, an unresolvable destination, or an explicit pin falls back to a quota-deferred skip instead."
    sources: [backlog]
    data:
      required: [node_id, from, to]
      properties:
        node_id:
          type: string
          description: "The node being dispatched onto the failover provider."
        from:
          type: string
          description: "The exhausted provider record id advance would have deferred on."
        to:
          type: string
          description: "The next non-exhausted provider record id selected from the active combo."
        harness_to:
          type: string
          description: "The failover provider's harness (cli), when it differs from claude (a cross-harness failover, e.g. codex). Empty/omitted for a same-harness account switch."
        window:
          type: string
          description: "The headroom state of the window that triggered the cutover (exhausted, or low for a proactive dispatch.cutover_low_after_minutes cutover)."
        reason:
          type: string
          description: "The route selector's reason for the cutover (e.g. exhausted-cutover, low-cutover)."
    consumers: [operator]

  - name: dispatch_claim_observed
    description: "Emitted at the shared target-dispatch claim seam after the family-2 claim classifier and truth-status probe agree on what occupies the node. Stale/suspect observations are also printed and notified so a successor is never minted or blocked silently (x-5c08)."
    sources: [backlog]
    data:
      required: [node_id, claim_verdict, holder, truth_status, action]
      properties:
        node_id:
          type: string
        claim_verdict:
          type: string
          enum: [ours, foreign_live, dead_predecessor, free]
        claim_state:
          type: [string, "null"]
        holder:
          type: string
        truth_status:
          type: string
          enum: [working, waiting, suspect, stalled, unknown]
        action:
          type: string
          enum: [blocked, redispatch, dispatch, auto-deferred, defer-failed]
    consumers: [operator]

  - name: dispatch_dead_failure_limit
    description: "Emitted before the shared target-dispatch seam refuses another worker because the node's durable failure streak reached active_backlog.failure_limit. A successful refusal auto-defers the node with a visible reason; a failed defer still blocks birth (x-5c08)."
    sources: [backlog]
    data:
      required: [node_id, consecutive_failures, failure_limit, action]
      properties:
        node_id:
          type: string
        consecutive_failures:
          type: integer
        failure_limit:
          type: integer
        action:
          type: string
          enum: [auto-deferred, defer-failed]
    consumers: [operator]

  - name: quota_deferred
    description: "Emitted by an autonomous dispatcher (mux grab / active-backlog tick) when a ready node is NOT dispatched because its resolved provider has no quota headroom (EXHAUSTED, or LOW with a reset inside the defer horizon). Quota-aware dispatch (x-5d3e). The node is left untouched in ready; the first tick after retry_at dispatches it. Advisory + opt-in (config.accounts.quota.defer_dispatch); p0 and explicit human verbs never defer."
    sources: [backlog]
    data:
      required: [node_id, provider, headroom]
      properties:
        node_id:
          type: string
          description: "The ready node held back this tick."
        provider:
          type: string
          description: "The resolved provider record id whose quota drove the defer."
        headroom:
          type: string
          enum: [exhausted, low]
          description: "The headroom state that triggered the defer."
        retry_at:
          type: number
          description: "Unix epoch seconds of the binding window's reset; the tick after this dispatches the node."
    consumers: [operator]

  - name: dispatch_substrate_fallback
    description: "Emitted by an autonomous dispatcher (dispatch-node.sh / /target bg) when the resolved harness has no bg substrate, so dispatch falls BACK to headless (a one-shot that runs to completion, not a detached thread). Provider-aware dispatch (x-567d, epic AC1-EDGE): the downgrade is loud, never silent. bg is claude-only; every other harness resolves to headless via the harness-capability map."
    sources: [backlog]
    data:
      required: [harness, from, to]
      properties:
        harness:
          type: string
          description: "The resolved harness (codex/gemini/agy/opencode) whose lack of a bg substrate triggered the fallback."
        from:
          type: string
          description: "The substrate the dispatcher wanted (always 'bg')."
        to:
          type: string
          description: "The substrate it fell back to (always 'headless')."
    consumers: [operator]

  - name: dispatch_no_autonomous_substrate
    description: "Emitted by an autonomous dispatcher (dispatch-node.sh / /target bg) when the configured harness resolves to NO autonomous substrate (an unknown/misconfigured config.dispatch.harness). The dispatch hard-fails loudly naming the config key; every requested node stays ready/re-dispatchable and nothing is launched. Provider-aware dispatch (x-567d, epic AC2-ERR): never a silent fall-through to a claude default."
    sources: [backlog]
    data:
      required: [reason, config_key]
      properties:
        reason:
          type: string
          description: "Why no autonomous substrate resolved (e.g. 'resolve rc=2: unknown harness')."
        config_key:
          type: string
          description: "The config key to fix (config.dispatch.harness)."
    consumers: [operator]

  - name: quota_required_bot_exhausted
    description: "Emitted at the pre-promise checkpoint (x-5d3e US5) when a config.review required-bot's provider snapshot is EXHAUSTED with a known reset. Surfaces the coming review-gate wedge immediately (with the reset time) instead of the gate hanging silently for hours. Advisory + read-only; in attended mode the skill also raises a <help> tag with the same facts."
    sources: [backlog, target]
    data:
      required: [bot, provider, headroom]
      properties:
        bot:
          type: string
          description: "The required-bot GitHub login whose provider is exhausted."
        provider:
          type: string
          description: "The provider record id backing that bot."
        headroom:
          type: string
          enum: [exhausted]
          description: "Always exhausted (the only state that warns here)."
        retry_at:
          type: number
          description: "Unix epoch seconds of the provider's window reset."
    consumers: [operator]

  - name: think_spawned
    description: "Emitted by a dispatch trigger (x-6a10 born-with-why birth, or x-122a A2 lifecycle: work-start / retro-at-done) when an away/headless session spawns a fire-and-forget context-carrying /think bg worker for the node. The node is then stamped with the spawned think's session pointer."
    sources: [backlog]
    data:
      required: [node_id, think_session]
      properties:
        node_id:
          type: string
          description: "The freshly-filed node a /think was spawned for."
        trigger:
          type: string
          enum: [birth, work-start, retro, conversational]
          description: "Which dispatch moment fired: birth (A1), work-start or retro (A2 lifecycle, x-122a), or conversational (C explicit verb, x-0a9c)."
        think_session:
          type: string
          description: "Short id of the spawned claude /think bg worker (from the spawn receipt)."
        presence:
          type: string
          enum: [away, attended]
          description: "Presence classification that routed to an autonomous spawn: 'away' (headless), or 'attended' when an operator opted in via config.think_spawn.attended=spawn (x-5d51 B)."
        resolved:
          type: boolean
          description: "Whether the origin transcript pointer resolved to a real .jsonl (false => seeded from the stored triple)."
        output_path:
          type: ["string", "null"]
          description: "Durable sidecar (briefs_dir()/think-<id>.md) the worker is told to write its /think doc to, also stamped on the node (x-5d51 B); null when the path could not be resolved."
        agent_name:
          type: string
          description: "Spawned agent name (think-<node-id>-<slug>)."
    consumers: [operator]

  - name: think_offered
    description: "Emitted by the node-birth path (x-6a10) when an attended operator is present: a single copy-pasteable /think <node-id> handoff line is surfaced rather than an autonomous spawn."
    sources: [backlog]
    data:
      required: [node_id]
      properties:
        node_id:
          type: string
          description: "The freshly-filed node a /think handoff was offered for."
        trigger:
          type: string
          enum: [birth, work-start, retro, conversational]
          description: "Which dispatch moment fired: birth (A1), work-start or retro (A2 lifecycle, x-122a), or conversational (C explicit verb, x-0a9c)."
        presence:
          type: string
          enum: [attended]
          description: "Presence classification (always 'attended' for an offer)."
        resolved:
          type: boolean
          description: "Whether the origin transcript pointer resolved (false => bare /think line, AC2-ERR)."
        offer_line:
          type: string
          description: "The single copy-pasteable handoff line surfaced to the operator."
    consumers: [operator]

  - name: think_skipped
    description: "Emitted by a dispatch trigger (x-6a10 birth, x-122a A2 lifecycle) when it deliberately spawns/offers nothing. The reason discriminates no-origin / bulk-intake / cap-exceeded / already-claimed / claim-error / spawn-failed / no-node-id / unresolved-pointer (A2 relevance filter) / daily-cap (A2 per-day ceiling) / not-design-warranting (a bug or size-S node too small for a design fan-out). A gate-off evaluation emits NOTHING (no-op); this fires only when the gate is on."
    sources: [backlog]
    data:
      required: [reason]
      properties:
        reason:
          type: string
          enum: [no-origin, bulk-intake, cap-exceeded, already-claimed, claim-error, spawn-failed, no-node-id, unresolved-pointer, daily-cap, not-design-warranting]
          description: "Why the dispatch spawned/offered nothing this evaluation."
        trigger:
          type: string
          enum: [birth, work-start, retro, conversational]
          description: "Which dispatch moment fired: birth (A1), work-start or retro (A2 lifecycle, x-122a), or conversational (C explicit verb, x-0a9c)."
        node_id:
          type: string
          description: "The candidate node, when the reason references one."
        presence:
          type: string
          enum: [attended, away]
          description: "Presence classification, when one was reached before the skip."
        resolved:
          type: boolean
          description: "Origin-resolution flag, when the seed was assembled before the skip."
        detail:
          type: string
          description: "Optional human-readable detail (e.g. the spawn error), truncated."
    consumers: [operator]

  - name: pr_watch_dispatched
    description: "PR-state watcher handed one PR off successfully: 'review' fires the headless /fno:pr check skill; 'merge' routes the post-merge ritual (warm inject or a direct `fno pr ritual` run -- NOT a headless claude skill). Per-merge attribution lives in post_merge_dispatch_receipt."
    sources: [daemon]
    data:
      required: [kind, pr]
      properties:
        kind:
          type: string
          enum: [review, merge]
          description: "Which hand-off succeeded: 'review' for the /fno:pr check skill fire, 'merge' for the post-merge ritual dispatch."
        pr:
          type: integer
          description: "GitHub PR number."
        route:
          type: string
          enum: [warm, cold]
          description: "Merge dispatches only: whether the ritual was injected into a live session ('warm') or run directly by the daemon ('cold')."

  - name: post_merge_dispatch_receipt
    description: "One lifecycle record for a post-merge ritual hand-off attempt. Reserved BEFORE any injection or ritual run, then accepted/failed/deferred after. Attribution and correlation only -- route selection never reads it, so it is not a dedup guard."
    sources: [daemon]
    data:
      required: [dispatch_id, attempt_id, phase, pr, detector, route, outcome]
      properties:
        dispatch_id:
          type: string
          description: "Deterministic correlation key: the sanitized mergeCommit.oid, or the repo-scoped 'pr-<n>' fallback when GitHub omits the SHA. Crash retries share it."
        attempt_id:
          type: string
          description: "Unique key for one reserve/action/result attempt. A retry after a crash gets a new attempt_id under the same dispatch_id."
        phase:
          type: string
          enum: [reserved, accepted, failed, deferred]
          description: "Lifecycle position: 'reserved' precedes the action; the rest record its result."
        pr:
          type: integer
          description: "GitHub PR number."
        node_id:
          type: string
          description: "Backlog node the merged PR belongs to, when known."
        repo_slug:
          type: string
          description: "owner/repo of the merged PR, when known."
        detector:
          type: string
          description: "Which detector observed the merge. 'pr-watch' is the sole detector after the cutover."
        route:
          type: string
          enum: [warm, cold, defer]
          description: "The single decision function's verdict for this attempt."
        delivering_session_id:
          type: string
          description: "The session that SHIPPED the PR (latest pre-dispatch phase=ship provenance). Omitted when the node carries none."
        delivering_harness:
          type: string
          description: "Harness of the shipping session."
        borrowed_session_id:
          type: string
          description: "The live session the ritual was injected into. Warm routes only; often differs from the shipping session."
        borrowed_harness:
          type: string
          description: "Harness of the borrowed session."
        outcome:
          type: string
          description: "delivered | queued | completed | failed | pending, or the defer reason (e.g. auto-run-disabled)."
        detail:
          type: string
          description: "Bounded diagnostic: the warm miss reason or the ritual receipt tail."

  - name: pr_watch_skipped
    description: "PR-state watcher skipped a candidate PR this tick without firing (no local checkout, or a live node/walker claim owns it)."
    sources: [daemon]
    data:
      required: [pr, reason]
      properties:
        pr:
          type: integer
          description: "GitHub PR number."
        reason:
          type: string
          description: "Why this PR was skipped: 'no-checkout' (repo_dir missing/absent), 'claimed' (live node: or walker: claim)."

  - name: pr_watch_dispatch_failed
    description: "A headless claude skill fired by the PR-state watcher returned an error (rc != 0, is_error:true, or non-JSON stdout). The PR will be retried on the next tick."
    sources: [daemon]
    data:
      required: [pr, retries]
      properties:
        pr:
          type: integer
          description: "GitHub PR number."
        retries:
          type: integer
          description: "Consecutive failure count for this PR after this failure (1-based)."

  - name: pr_watch_parked
    description: "PR-state watcher stopped polling a PR because it was closed, exceeded max age, or exhausted retries."
    sources: [daemon]
    data:
      required: [pr, reason]
      properties:
        pr:
          type: integer
          description: "GitHub PR number."
        reason:
          type: string
          description: "Why the PR was parked: 'closed', 'max-age', 'retries-exhausted', or decide()'s park reason."

  - name: pr_watch_tick
    description: "Heartbeat emitted at the end of every PR-state watcher poll interval, including quiet ticks with no actionable PRs."
    sources: [daemon]
    data:
      required: [open_prs, acted]
      properties:
        open_prs:
          type: integer
          description: "Total number of open-PR candidates discovered from the graph this tick."
        acted:
          type: integer
          description: "Number of PRs for which a skill was successfully dispatched this tick."

  - name: recovery_nudge
    description: "Session auto-recovery (x-f47c) injected a resume nudge into a footnote-launched bg session that was idle-but-incomplete after an abnormal turn termination."
    sources: [daemon]
    data:
      required: [short_id, nudge_count]
      properties:
        short_id:
          type: string
          description: "The 8-hex jobId of the recovered bg session."
        nudge_count:
          type: integer
          description: "How many nudges this session has now received (1-based; capped by config.recovery.max_nudges)."

  - name: recovery_skipped
    description: "Session auto-recovery looked at an idle-stale bg session and deliberately did NOT act on it: waiting on a human, an unreachable socket, or a node-bound stuck worker surfaced once as held-by-design (the socket nudge cannot reach a bypassPermissions recipient, x-d93d)."
    sources: [daemon]
    data:
      required: [short_id, reason]
      properties:
        short_id:
          type: string
          description: "The 8-hex jobId of the bg session that was spared."
        reason:
          type: string
          description: "Why it was skipped: needs-input | socket-unreachable | send-failed | held-by-design | no-notify-channel."
        error:
          type: string
          description: "The send failure detail; present only when reason=send-failed."

  - name: recovery_capped
    description: "Session auto-recovery reached the per-session cap (config.recovery.max_nudges); no further actions fire for this session. Emitted once on the transition, not every tick."
    sources: [daemon]
    data:
      required: [short_id, nudges]
      properties:
        short_id:
          type: string
          description: "The 8-hex jobId of the bg session that hit the cap."
        nudges:
          type: integer
          description: "The action count at which the cap was reached (== config.recovery.max_nudges)."

  - name: recovery_close_notify
    description: "Session auto-recovery surfaced a finished-but-lingering node-bound /target worker once for the operator to close (run retro, then /stop). x-a76d: the operator wants finished sessions off the view, not resumed over the held socket. Emitted once per session."
    sources: [daemon]
    data:
      required: [short_id]
      properties:
        short_id:
          type: string
          description: "The 8-hex jobId of the finished-but-open bg session surfaced to close."

  - name: human_touch
    description: "A human steered an agent-managed node (W4 touch telemetry). Emitted at exactly three choke points: mux keystroke injection into an agent pane (source=inject, coalesced per pane), answer-queue submission (source=answer), and a manual merge (source=merge: tty `fno pr merge` or reconcile closing an out-of-band merge). Observing never counts; steering always counts. Emit is fire-and-forget non-fatal: a failed emit must never touch the steering path."
    sources: [daemon, target, backlog, test]
    data:
      required: [graph_node_id, source, resolution]
      properties:
        graph_node_id:
          type: string
          description: "Node the steering targeted; ALWAYS present, null when resolution=failed (provenance missing) - both validators accept a present-null required field. Null events are counted, not dropped - dropped events are the silent failure."
        source:
          type: string
          enum: [inject, answer, merge]
          description: "Which steering choke point fired."
        resolution:
          type: string
          enum: [ok, failed]
          description: "ok when graph_node_id resolved (pane FNO_NODE provenance / graph pr_number match / reconcile record); failed otherwise."

  - name: verifier_verdict
    description: "Ship-gate verifier advisory verdict (W6 x-f063): the plan-AC check ran against the ship diff at finalize time. Advisory only - no code path may gate a ship on it (Locked Decision #6). One event per ship; `fno scoreboard --calibration` joins these to per-node outcomes to measure the verifier's false-positive rate before anyone proposes flipping it to a gate. error = the verifier itself failed (spawn/timeout/parse); not_applicable = doc ship, no plan bound, or no ACs to check."
    sources: [target, test]
    data:
      required: [graph_node_id, verdict, source]
      properties:
        graph_node_id:
          type: [string, "null"]
          description: "Node the ship belongs to; null when the manifest carried none (present-null required field, same convention as human_touch)."
        verdict:
          type: string
          enum: [pass, concerns, fail, error, not_applicable]
          description: "The verifier's judgment of plan ACs vs the origin/main...HEAD diff."
        source:
          type: string
          enum: [ship-gate]
          description: "Execution site; ship-gate is the only emitter today."
        pr_number:
          type: [integer, "null"]
          description: "PR the ship landed as (best-effort gh lookup; null offline)."
        session_id:
          type: string
          description: "Target session that shipped; joins to the ledger row."

  - name: skill_eval_finding
    description: "Observer harness (x-57a5): one scored corpus item for a sweep or replay run. Corpus construction is a read-time fold over already-captured signals (ledger/graph/events) - this event is the observer's own new activity, not retroactive instrumentation of history. One event per (run_id, corpus_item_id) pair; a replay batch tags skill_ref so a before/after comparison is a filter over this event type."
    sources: [observer, test]
    data:
      required: [run_id, skill_id, skill_version, corpus_item_id, dimension, verdict, evidence, cost_usd]
      properties:
        run_id:
          type: string
          description: "obs-<skill_id>-<UTC-timestamp>, minted once per sweep/replay-batch; correlates every finding in a run to its terminal skill_eval_run_complete."
        skill_id:
          type: string
          description: "Skill under evaluation, e.g. fno:blueprint or fno:review - same id fno scoreboard --by-skill (x-4829) emits."
        skill_version:
          type: string
          description: "Best-effort git hash of the skill's SKILL.md at the corpus item's timestamp, or 'unknown' - x-4829's convention, reused verbatim."
        corpus_item_id:
          type: string
          description: "The historical session's real session_id - no new ID scheme is minted for corpus items."
        dimension:
          type: string
          enum: [structural_validity, collision_free, shipped_outcome, finding_precision, first_try_green, converged]
          description: "Which rubric dimension this finding scores. structural_validity/collision_free/shipped_outcome are blueprint dimensions (replay scores the first two only, per Review Amendment A1); finding_precision is the review dimension (sweep-only, per Review Amendment A2); shipped_outcome/first_try_green/converged are the PR-anchored target dimensions (x-6ff0, sweep-only)."
        verdict:
          type: string
          enum: [pass, degraded, fail]
          description: "pass = clean signal; degraded = ambiguous (execution-attributable postmortem, or a discrepancy-path resolution); fail = a clear miss (plan-attributable postmortem, reverted/bounced, or a declined-and-never-contradicted finding)."
        evidence:
          type: string
          description: "<=500 chars: what specifically drove the verdict (earned-specificity discipline - no vague attribution)."
        cost_usd:
          type: number
          description: "Spend attributable to producing this finding: 0 for a sweep item (read-only fold), the headless spawn's cost for a replay item."
        skill_ref:
          type: [string, "null"]
          description: "Git ref under test; absent/null for a retrospective sweep against HEAD, present for a replay batch against a candidate branch."
        tool_fault:
          type: boolean
          description: "True when this finding records a REPLAY tool fault (spawn crash/timeout/unparseable output) rather than a skill-quality verdict. Downstream (x-0ca7) MUST exclude tool_fault=true findings from skill failure rankings (AC2-ERR: a tool fault is never conflated with a skill-quality fail). Absent = a genuine skill-quality verdict."

  - name: skill_eval_run_complete
    description: "Observer harness (x-57a5): the terminal event for one sweep or replay batch - the trigger x-0ca7's loop tick scans for. Never emitted when the corpus is insufficient (<10 attributable runs); an insufficient run reports its state on stdout only, with no terminal event, since there is nothing to complete."
    sources: [observer, test]
    data:
      required: [run_id, skill_id, skill_version, corpus_size, pass_count, degraded_count, fail_count, cost_usd, coverage_pct, failure_ranking]
      properties:
        run_id:
          type: string
          description: "Same run_id minted at sweep/replay-batch start; correlates to every skill_eval_finding in this run."
        skill_id:
          type: string
          description: "Skill evaluated, e.g. fno:blueprint or fno:review."
        skill_version:
          type: string
          description: "Best-effort git hash of the skill's SKILL.md, or 'unknown' - x-4829's convention."
        corpus_size:
          type: integer
          description: "Count of attributable corpus items actually scored in this run (post coverage-gap exclusion)."
        pass_count:
          type: integer
          description: "Findings with verdict=pass across the run."
        degraded_count:
          type: integer
          description: "Findings with verdict=degraded across the run."
        fail_count:
          type: integer
          description: "Findings with verdict=fail across the run."
        cost_usd:
          type: number
          description: "Total spend for the run: 0 for a sweep, the sum of per-item headless-spawn costs for a replay batch."
        coverage_pct:
          type: integer
          description: "Attributable-and-scored fraction of the window's total rows, 0-100 - the same coverage-honesty rule fno scoreboard already enforces, carried into this event since x-0ca7's original proposal did not have one."
        failure_ranking:
          type: array
          description: "[{dimension, fail_count}] sorted by fail_count descending - only the dimensions actually scorable in this run (a replay batch's ranking carries structural_validity/collision_free only, per Review Amendment A1)."
        skill_ref:
          type: [string, "null"]
          description: "Git ref under test; absent/null for a retrospective sweep against HEAD, present for a replay batch."

  - name: loop_tick
    description: "A standing loop (x-ce71 substrate) ran one tick. The proposer (x-0ca7) is the first live loop to emit this; fno loops ls reads it for the last-tick column. Emitted whether or not the tick did anything (paused / no-work ticks still record)."
    sources: [skill_diff, test]
    data:
      required: [name]
      properties:
        name:
          type: string
          description: "The loop's config.loops.<name> key, e.g. skill_diff_proposer."
        level:
          type: string
          description: "The loop's resolved level at tick time (report|assisted|unattended)."
        outcome:
          type: string
          description: "One word: paused | no-work | noop | proposed | no-diff-helps | report."

  - name: skill_diff_proposed
    description: "Skill-diff proposer (x-0ca7): a cited diff to a skill's files was opened as a PR through the normal review gate. One per (run_id, skill_id) - the idempotency key the next tick scans for."
    sources: [skill_diff, test]
    data:
      required: [run_id, skill_id, pr_number, branch, cited_finding_ids, added_lines, removed_lines]
      properties:
        run_id:
          type: string
          description: "The observer run_complete run_id this diff responds to."
        skill_id:
          type: string
          description: "Skill the diff targets, e.g. fno:blueprint."
        skill_version_observed:
          type: string
          description: "Skill SKILL.md hash the observer scored against (from run_complete), or 'unknown'."
        skill_version_proposed_against:
          type: string
          description: "Skill SKILL.md hash the proposer actually diffed against at run time (AC9-FR: may differ if the file drifted since the observer's snapshot)."
        pr_number:
          type: [integer, "null"]
          description: "The opened PR number; null if gh lookup failed after a successful push."
        branch:
          type: string
          description: "The feature branch the diff landed on."
        cited_finding_ids:
          type: array
          description: "Every finding_id cited across the surviving hunks (citation invariant: non-empty)."
        added_lines:
          type: integer
          description: "Lines added across the diff (bloat-tracker input)."
        removed_lines:
          type: integer
          description: "Lines removed/modified across the diff (0 = additive-only)."
        justification:
          type: [string, "null"]
          description: "Present when the diff was additive-only over threshold (AC4-UI); null otherwise."

  - name: skill_diff_no_diff_helps
    description: "Skill-diff proposer (x-0ca7): the proposer concluded no diff helps (local-maxima ceiling AC7-EDGE, or every hunk dropped as uncited AC2-ERR) and filed a backlog node instead of opening a PR. Records the idempotency key so the run_id is not reprocessed."
    sources: [skill_diff, test]
    data:
      required: [run_id, skill_id, reason]
      properties:
        run_id:
          type: string
          description: "The observer run_complete run_id."
        skill_id:
          type: string
          description: "Skill evaluated."
        reason:
          type: string
          description: "Why no diff was proposed: local_maxima | all_hunks_uncited | synth_no_diff | redaction_refused."
        filed_node_id:
          type: [string, "null"]
          description: "The backlog node filed (architectural finding), or null if filing failed (retried next tick)."

  - name: skill_diff_noop
    description: "Skill-diff proposer (x-0ca7): an observer run had zero actionable findings (AC6-EDGE). A lightweight record so the run_id is not reprocessed on the next tick - no diff, no PR, no node."
    sources: [skill_diff, test]
    data:
      required: [run_id, skill_id]
      properties:
        run_id:
          type: string
          description: "The observer run_complete run_id closed as a no-op."
        skill_id:
          type: string
          description: "Skill evaluated."
        reason:
          type: string
          description: "zero_findings | zero_failures."

  - name: skill_diff_eval_closed
    description: "Skill-diff proposer (x-0ca7): a proposer-authored PR merged and the observer re-ran over the same corpus slice, producing a before/after delta - the receipt that the loop actually closed (Locked Decision 7 / AC10-FR)."
    sources: [skill_diff, test]
    data:
      required: [pr_number, skill_id, run_id_before]
      properties:
        pr_number:
          type: integer
          description: "The merged proposer PR."
        skill_id:
          type: string
          description: "Skill the diff targeted."
        run_id_before:
          type: string
          description: "The observer run that motivated the diff."
        run_id_after:
          type: [string, "null"]
          description: "The post-merge re-eval run; null if the re-run has been scheduled but not yet completed."
        score_delta:
          type: [number, "null"]
          description: "fail_count(before) - fail_count(after) on the top dimension; null until run_id_after lands. STRUCTURAL only on replay pairs (Review Amendment A1)."

  - name: gate_escape
    description: "A human resolved what a gate should have (an oob-merge past an unmet required-bot gate, a spawn-cap bypass, a hand-rebase, a wedge unblock). The autonomy-debt counter (x-f894): retro ranks escapes by reason so the roadmap knows which reliability fix pays first. Telemetry fails OPEN - a failed emit never blocks the host op. Tier-1 (reconcile auto) emits reason=dead-bot; the manual catch-all is `fno event emit --type gate_escape --data '{\"reason\":\"other\",\"detail\":\"...\"}'`."
    sources: [backlog, target, daemon, hook, test]
    data:
      required: [reason]
      properties:
        reason:
          type: string
          enum: [dead-bot, zero-coverage, flake, stale-base, wedge, spawn-cap, other]
          description: "Which intervention. Small, summable enum; fail-closed on unknown so a typo is loud, not a silent 'other'."
        pr:
          type: integer
          description: "PR the escape rode on (attribution; optional). Dedup key with reason."
        graph_node_id:
          type: string
          description: "Node the escape rode on (attribution; optional)."
        detail:
          type: string
          description: "Free text, especially for reason=other; retro flags an empty detail as low-signal (optional)."
        dedup_key:
          type: string
          description: "PR-less dedup bucket (reason:session:day) for a spawn-cap/manual escape with no `pr`. Collapses a looped intervention to one count (x-91b5); not consumed by retro (optional)."
    consumers: [fno retro run]

  - name: executor_resolved
    description: "The /do three-tier executor resolver (skills/do/scripts/resolve-executor.sh) decided a task's executor. Best-effort telemetry: routing is byte-identical whether or not this emits (x-64cb). Folded into `fno backlog triage health` as tier distribution + inference share + warn-fallback count + override-after-inference rate."
    sources: [target, test]
    data:
      required: [resolved, tier]
      properties:
        task:
          type: string
          description: "Task id being resolved (e.g. '1.2'); empty when the caller did not pass TASK_ID."
        plan_path:
          type: string
          description: "Plan the task belongs to; empty when the caller did not pass PLAN_PATH."
        resolved:
          type: string
          description: "The resolved executor name (do | impeccable) after alias-normalization and the fail-closed check."
        tier:
          type: string
          enum: [task-block, plan-frontmatter, surface-inference, default]
          description: "Which resolution tier decided (documented contract; producer is a fixed case in resolve-executor.sh)."
        warn_fallback:
          type: boolean
          description: "True when an unknown executor triggered the WARN fail-closed to 'do'."
    consumers: [fno backlog triage health]

  - name: triage_applied
    description: "A `fno backlog triage apply` mutation committed to the graph. Best-effort telemetry emitted after locked_mutate_graph (x-64cb): triage semantics are unchanged whether or not this emits. Makes _validate_proposal's silent drops a first-class number. Folded into `fno backlog triage health` as per-category apply counts + validation drop rate."
    sources: [backlog, target, test]
    data:
      required: [applied, proposed, dropped]
      properties:
        applied:
          type: object
          description: "Per-category applied counts: priority_changes, dependencies, duplicates_flagged, deferred."
        priority_moves:
          type: array
          description: "Per-node priority transitions [{id, from, to}] that landed."
          items:
            type: object
        proposed:
          type: integer
          description: "Total proposal entries seen across all categories (the drop-rate denominator)."
        dropped:
          type: integer
          description: "Entries dropped by _validate_proposal (unknown id, cycle, invalid priority, missing reason). Today's silent fail-open becomes a visible number."
    consumers: [fno backlog triage health]

# ---------------------------------------------------------------------------
# x-2901: daemon kinds present in KNOWN_EVENT_KINDS but previously undocumented
# here. schema.yaml is now the single cross-language name registry (the
# events-v3.json kind enum was retired), so the parity gate asserts every
# KNOWN_EVENT_KINDS entry appears here. Documented sources: [daemon] keeps the
# python collision-exclusion bucket honest (_collect_event_types drops
# daemon/subagent-only names); the real envelope source varies (dispatch_deferred
# emits from megawalk, active_backlog_task_crashed from active-backlog).
# ---------------------------------------------------------------------------

  - name: active_backlog_task_crashed
    description: "The active-backlog dispatch task panicked/exited unexpectedly; the daemon logged it and continues."
    sources: [daemon]
    data:
      required: []
      properties:
        error:
          type: string

  - name: active_backlog_mission_retired
    description: "A mission drain loop retired: its epic mission was deactivated (operator --stop) or all children are done, so the daemon stops ticking that mission (x-a4dc K2)."
    sources: [daemon]
    data:
      required: []
      properties:
        mission:
          type: string

  - name: daemon_exe_fingerprint_unavailable
    description: "The daemon could not read its own executable fingerprint (staleness self-check degraded to fail-open)."
    sources: [daemon]
    data:
      required: []
      properties: {}

  - name: dispatch_deferred
    description: "A cross-harness dispatch was deferred because the node is owned by a different harness (dispatch-posture guard)."
    sources: [daemon]
    data:
      required: []
      properties:
        node_id:
          type: string
        owner_harness:
          type: string
        dispatcher_harness:
          type: string

  - name: screen_state_change
    description: "A scrape sweep observed an agent's on-screen verdict change (badge set or cleared). Consumed by the mux subscribe overlay."
    sources: [daemon]
    data:
      required: []
      properties:
        name:
          type: string
        state:
          type: string
        rule:
          type: string
        seq:
          type: integer
        cleared:
          type: boolean

  - name: startup_reconcile_done
    description: "The daemon's startup reconcile sweep completed successfully."
    sources: [daemon]
    data:
      required: []
      properties:
        count:
          type: integer

  - name: startup_reconcile_failed
    description: "The daemon's startup reconcile sweep raised an error; the daemon continues fail-open."
    sources: [daemon]
    data:
      required: []
      properties:
        error:
          type: string

  # ── a2a status breakpoints: task-boundary protocol family (x-dbaf) ──────────
  # Four task-boundary events carrying the extended envelope in `protocol_family`
  # below (routable fields at envelope level, not smeared into `data`). The
  # public contract is schemas/events-protocol-v1.json; docs/protocol/a2a-status-events.md.
  - name: task_started
    description: "The do-phase orchestrator is about to dispatch a task to its executor. A tick (pulled from events.jsonl, never pushed)."
    sources: [target, subagent, test]
    data:
      required: []
      properties:
        title:
          type: string
          description: "Task title, truncated to the reason/title cap."
        executor:
          type: string
          description: "Resolved executor (do | tdd | impeccable | ...)."
        wave:
          type: string
          description: "Wave id the task belongs to, when the plan declares waves."
    consumers: [x-05da peek, third-party observers]

  - name: task_done
    description: "An executor returned and its result was parsed. Carries the return-contract outcome at envelope level. A tick (pulled, never pushed)."
    sources: [target, subagent, test]
    data:
      required: []
      properties:
        commit:
          type: string
          description: "Commit sha the task produced, when it committed."
        concerns:
          type: integer
          description: "Count of DONE_WITH_CONCERNS findings, 0 when none."
    consumers: [x-05da peek, third-party observers]

  - name: blocked
    description: "A task returned RESULT: BLOCKED, or an in-session <help> distress was emitted. The one event that requests action; PUSHED to the parent handle when spawn lineage exists."
    sources: [target, subagent, test]
    data:
      required: []
      properties:
        reason:
          type: string
          description: "Why it blocked, truncated to the reason cap."
        evidence:
          type: string
          description: "Pointer to evidence (path/url), truncated to the reason cap."
    consumers: [parent handle via mail bus, x-05da peek]

  - name: run_summary
    description: "The loop reached terminal (finalize path). Carries per-run task counts + termination reason. Emitted natively in Rust. PUSHED to the parent handle when spawn lineage exists."
    sources: [target, hook, test]
    data:
      required: [tasks_started, tasks_done, tasks_failed]
      properties:
        tasks_started:
          type: integer
        tasks_done:
          type: integer
        tasks_failed:
          type: integer
        termination_reason:
          type: string
          description: "The loop's TerminationReason (DonePRGreen | NoProgress | Budget | ...)."
        pr_url:
          type: string
          description: "The run's PR url, when one exists."
    consumers: [parent handle via mail bus, x-05da peek, third-party observers]

  - name: builder_step
    description: "An attempt-grained builder crumb inside a fix loop: tried X, found Y, fixed with Z, outcome. The high-signal subset between task_started and task_done - a successor session (or human) reads the tail to avoid repeating a failed approach. Advisory (never gate-bearing); a failed emit degrades warn-once and never blocks the build. Legacy-tolerant envelope (NOT the x-dbaf family): payload lives entirely in data (envelope keys frozen, x-0f7f)."
    sources: [target, subagent]
    data:
      required: [tried, outcome]
      properties:
        tried:
          type: string
          description: "What the attempt did, truncated to ~500 chars by the emit instruction."
        found:
          type: string
          description: "What broke / what the evaluator found (optional)."
        fix:
          type: string
          description: "The change made in response (optional)."
        outcome:
          type: string
          enum: [worked, failed, abandoned]
          description: "Result of the attempt. Enum is documented for the emit instruction and the consumer's outcome match; only the two required fields are validator-enforced (advisory crumb)."
    consumers: [target resume, self-handoff successor, postmortem]

  # ── approval / effect lifecycle family (x-4530) ─────────────────────────
  # Three types, one per durable transition kind. The vocabulary stays distinct:
  # requested, approved, declined, executing, acknowledged, failed, blocked, and
  # unknown are separately auditable. Approval is not execution, execution is not
  # acknowledgment, and acknowledgment is not an aggregate delivery verdict --
  # only the delivery evaluator may declare that.
  #
  # Emitted from a transactional outbox: the store commits the state change and
  # the owed event together, so a failed append is repaired from the committed
  # record without re-crossing the adapter boundary.
  #
  # The `decision` and `state` enums below are ADVISORY at the validator layer,
  # matching the `outcome` crumb further down: both validators check required
  # fields and envelope shape, not per-type data enums, unless a type opts into a
  # hardcoded check. Real enforcement is at the only emitter -- fno.approvals'
  # DecisionKind and EffectState are typed enums, so an out-of-vocabulary value
  # cannot be constructed. Promote to a hardcoded check in BOTH validators (and
  # add invalid corpus fixtures) if a second, untyped emitter ever appears.

  - name: approval_requested
    description: "One exact consequential effect was proposed for decision. Not an approval."
    sources: [approvals, test]
    data:
      required: [request_digest, work_order_id, attempt_id, effect_id, effect_class, destination, action_digest, expires_at]
      properties:
        request_digest:
          type: string
          description: "Digest over every bound field; changing any field yields a new digest."
        request_id:
          type: string
        principal_id:
          type: string
          description: "Principal the request was raised for; not an authorization."
        work_order_id:
          type: string
        attempt_id:
          type: string
        effect_id:
          type: string
        effect_class:
          type: string
        destination:
          type: string
        action_digest:
          type: string
        expires_at:
          type: string
        event_id:
          type: string
          description: "Stable identity minted when the store owed this event. Outbox delivery is at-least-once, so consumers dedupe on it."
    consumers: [fno approvals ls]

  - name: approval_decided
    description: "An authorized principal approved or declined one exact request digest. Approval alone never satisfies execution or delivery evidence."
    sources: [approvals, test]
    data:
      required: [request_digest, decision, deciding_principal_id, work_order_id, attempt_id, effect_id]
      properties:
        request_digest:
          type: string
        decision:
          type: string
          enum: [approved, declined]
        deciding_principal_id:
          type: string
        work_order_id:
          type: string
        attempt_id:
          type: string
        effect_id:
          type: string
        authority_source:
          type: string
          description: "The independent policy source consulted. Transports never widen it."
        transport:
          type: [string, "null"]
          description: "Where the decision arrived from. Informational, never authoritative."
        event_id:
          type: string
          description: "Stable identity minted when the store owed this event. Outbox delivery is at-least-once, so consumers dedupe on it."
    consumers: [fno approvals show]

  - name: effect_state_changed
    description: "One durable effect-attempt transition. `unknown` means the external outcome is ambiguous, never that it failed or succeeded."
    sources: [approvals, test]
    data:
      required: [idempotency_key, state, request_digest, work_order_id, attempt_id, effect_id]
      properties:
        idempotency_key:
          type: string
        state:
          type: string
          enum: [prepared, executing, acknowledged, failed, blocked, unknown]
        previous_state:
          type: string
          enum: [prepared, executing, acknowledged, failed, blocked, unknown]
          description: "The state left behind. ABSENT on the first event for an attempt, because creating one has no previous state; present on every later transition."
        request_digest:
          type: string
        work_order_id:
          type: string
        attempt_id:
          type: string
        effect_id:
          type: string
        external_ref:
          type: [string, "null"]
          description: "Destination-side acknowledgment reference, when the destination gave one."
        reconciliation_ref:
          type: [string, "null"]
        event_id:
          type: string
          description: "Stable identity minted when the store owed this event. Outbox delivery is at-least-once, so consumers dedupe on it."
    consumers: [delivery evaluation, fno approvals show]

  # ── generic delivery evidence family ────────────────────────────────────
  # These events serialize immutable source facts and derived verdicts. They
  # do not execute effects, grant authority, or mutate approval/effect state.

  - name: delivery_evidence_observed
    description: "One immutable, attempt-bound runtime fact observed by an evidence adapter. The declared company-work evidence slot remains the binding authority."
    sources: [target, test]
    data:
      required: [version, evidence, producer, observed_at, source_revision, fresh_until, adapter_version, fact_revision]
      properties:
        version:
          type: string
          enum: [delivery-evidence-fact.v1]
        evidence:
          type: object
          description: "Canonical EvidenceRef projection containing evidence ID, work order, attempt, subject, and four-state source result."
        producer:
          type: string
        observed_at:
          type: string
          format: rfc3339-utc
        source_revision:
          type: string
        fresh_until:
          type: string
          format: rfc3339-utc
        adapter_version:
          type: string
        fact_revision:
          type: string
          description: "Coherent snapshot revision shared by facts evaluated together."
    consumers: [delivery evaluation]

  - name: delivery_verdict_evaluated
    description: "The pure delivery evaluator retained aggregate and per-requirement results for one attempt. This derived event is not an evidence producer."
    sources: [target, test]
    data:
      required: [evaluator_version, work_order_node_id, attempt_id, aggregate, fact_revision, required_requirements, requirements, diagnostics]
      properties:
        evaluator_version:
          type: string
          enum: [delivery-evaluator.v1]
        session_id:
          type: [string, "null"]
          description: "Target session that selected this verdict for terminal delivery."
        work_order_node_id:
          type: string
        attempt_id:
          type: string
        aggregate:
          type: string
          enum: [passed, failed, blocked, unknown]
        fact_revision:
          type: [string, "null"]
        required_requirements:
          type: array
          description: "Exact ordered deliverable/evidence bindings that the requirement rows must cover."
        requirements:
          type: array
          description: "Complete ordered per-requirement verdict rows; aggregate never hides them."
        diagnostics:
          type: array
    consumers: [fno-agents loop-check, finalize handoff]

  - name: king_context_nudge
    description: "Emitted by hooks/context-nudge.sh (Stop) when a crowned session ends a turn past king_used_pct_trigger. The arming proof the hook's predecessor (arm-handoff-precompact.sh, gated on a pid dead ~1s after init) could never produce: `fno event audit` answers whether the nudge ever fired in a real reign."
    sources: [hook]
    data:
      required: [used_pct, trigger, crown_level, crown_scope]
      properties:
        used_pct:
          type: integer
          description: "Measured context-window usage percent at the turn boundary."
        trigger:
          type: integer
          description: "config.target.handoff.king_used_pct_trigger (default 40)."
        crown_level:
          type: integer
          description: "The king's crown altitude (0 VP, 1 Director, 2 IC)."
        crown_scope:
          type: string
          description: "The scope the crown rules over (project/epic/node id)."
        session_id:
          type: string
          description: "The crowned session's id."
    consumers: [operator]

  - name: session_context_nudge
    description: "Emitted by hooks/context-nudge.sh (Stop) when any non-crowned session ends a turn past used_pct_trigger (default 50). The every-session generalization of king_context_nudge: the probe already ran for every session at the old crown gate and was discarded, so this stops wasting that reading. `fno event audit` distinguishes a king nudge (king_context_nudge) from a general-session nudge."
    sources: [hook]
    data:
      required: [used_pct, trigger]
      properties:
        used_pct:
          type: integer
          description: "Measured context-window usage percent at the turn boundary."
        trigger:
          type: integer
          description: "config.target.handoff.used_pct_trigger (default 50)."
        session_id:
          type: string
          description: "The session's id."
    consumers: [operator]

  - name: king_orphan_block
    description: "Emitted by hooks/context-nudge.sh (Stop) when a crowned session ends a turn with workers it spawned still live and no resolution recorded. Names the workers and the three legal resolutions; a carveout carrying the scope (structured field) satisfies it and stops the block."
    sources: [hook]
    data:
      required: [crown_level, crown_scope, workers, count]
      properties:
        crown_level:
          type: integer
        crown_scope:
          type: string
        workers:
          type: string
          description: "Comma-separated names of the live spawned workers."
        count:
          type: integer
        session_id:
          type: string
    consumers: [operator]

  - name: carveout_resolved
    description: "Emitted by `fno carveout resolve --reason`. A carve-out removed from the ledger with no node filed leaves no trace anywhere else, so the reason is the only record that the work was dispositioned rather than dropped. Required when the ledger row is retired without becoming tracked work: the backlog has no delete verb, so a junk node is permanent and a reasoned resolve is the cheaper correction."
    sources: [backlog]
    data:
      required: [carveout_ids, reason]
      properties:
        carveout_ids:
          type: string
          description: "Comma-separated carve-out ids removed by this call."
        reason:
          type: string
          description: "Why these rows were retired without filing a node."
        removed:
          type: integer
          description: "How many rows were actually removed (may be fewer than requested)."
    consumers: [operator]

# Size cap per Failure Modes (Boundaries): the system rejects events whose
# data payload exceeds 64KB. Validators enforce this at validate() time.
limits:
  max_data_bytes: 65536
  data_size_encoding: compact-json-ascii-v1

# ── a2a status-breakpoint protocol family (x-dbaf) ──────────────────────────
# The four types above carry an EXTENDED envelope: routable fields live at
# envelope level (an observer routes 'notify me when MY worker blocks' on them),
# only type-specific payload stays in `data`. This section is the validator's
# source of truth for the family; the self-contained public artifact is
# schemas/events-protocol-v1.json (kept in sync by test_protocol_family.py).
#
# Rule: additionalProperties:false at envelope level for this family ONLY;
# legacy types keep today's tolerance.
protocol_family:
  version: 1                       # `v` on the wire; additive-only within v:1
  types: [task_started, task_done, blocked, run_summary]
  envelope:
    # Every top-level key a family event may carry. additionalProperties:false
    # rejects anything outside this whitelist.
    allowed: [ts, v, type, source, from, model, host, project, node, task, run, parent, outcome, data]
    # Always required, on top of the base [ts, type, source, data].
    required: [v, run]
  # `outcome` (return-contract enum) is present ONLY on these types, and required
  # there; forbidden on task_started/blocked. (Key is `present_on`, not `on`:
  # YAML 1.1 parses a bare `on:` key as the boolean True.)
  outcome:
    enum: [SUCCESS, DONE_WITH_CONCERNS, FAILED, BLOCKED]
    present_on: [task_done, run_summary]
