name: smoke-setup
description: >
  Provision a runner for `fno doctor test smoke`. Shared by the clean and dirty
  ambient lanes so the two cannot drift on what a smoke run is given.

# Why a composite action rather than two copies of these steps: the dirty lane
# started life as a hand-copied subset of the clean job, and the copy was
# missing the Rust front build. The lane then went red for a setup reason
# rather than a real leak, which is the failure this whole change exists to
# prevent - a job that is red for the wrong reason gets ignored exactly as fast
# as one that is always green. One definition, two callers, no drift.

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Install PyYAML for bundler + marketplace lint
      # The skill-bundler parser opts into PyYAML when the manifest declares
      # references: or agents: blocks (nested shapes the stdlib fallback
      # parser can't handle). The marketplace-readiness lint similarly
      # imports yaml for frontmatter validation. Install at system level so
      # the freshness check + lint scripts (run outside the cli venv) can
      # import yaml from the same python3 that setup-python installed. This
      # stays in the yml (not the smoke runner): the runner only ASSERTS
      # python3-yaml and names it if missing, the CI/local install divergence
      # is deliberate (locally you install pyyaml once, by hand).
      shell: bash
      run: python3 -m pip install --upgrade pyyaml

    - name: Assert yq (dotted-key config reads)
      # scripts/lib/config.sh reads dotted keys (auto_merge.*) through yq and
      # has NO fallback: without it every nested lookup returns the default
      # and any harness asserting configured behavior fails for an unrelated
      # reason. ubuntu-latest happens to ship yq, so this dependency was
      # satisfied incidentally and declared nowhere; assert it so a runner
      # image change fails with one clear line instead of a cascade.
      shell: bash
      run: |
        command -v yq >/dev/null 2>&1 || {
          echo "yq missing: scripts/lib/config.sh cannot read dotted config keys" >&2
          exit 1
        }
        yq --version

    - name: Install stable Rust toolchain (for journey tests)
      # Journey tests (e2e, emission-schema, backstop-subprocess) and the
      # claims compat matrix invoke the REAL fno-agents binary, which the
      # smoke runner builds mid-run. Provision the toolchain + cargo cache
      # here (CI-runner concern); the debug build itself lives in the runner
      # so local runs build it too.
      uses: dtolnay/rust-toolchain@stable

    - name: Install pinned rustfmt toolchain (for the format-on-edit hook test)
      # tests/hooks/test_format_on_edit.sh drives hooks/format-on-edit.sh,
      # which shells to `rustfmt +1.94.1` (rust-ci.yml's RUSTFMT_TOOLCHAIN,
      # kept in lockstep). Without this toolchain the test SKIPs (exit 77),
      # and smoke counts a SKIP as a FAILURE (see test_cmd.py's discovery
      # notes) - so the toolchain must actually be present, not merely
      # tolerated. Component-only + minimal profile, same as rust-ci.yml.
      shell: bash
      run: rustup toolchain install 1.94.1 --component rustfmt --profile minimal --no-self-update

    - name: Cache Cargo registry + build artifacts (journey tests)
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          crates/fno-agents/target
          crates/fno/target
        key: ${{ runner.os }}-cargo-journey-${{ hashFiles('crates/fno-agents/Cargo.lock', 'crates/fno/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-journey-

    - name: Build the fno-agents front (verb-surface ratchet)
      # `fno doctor lint verb-ratchet` still cross-checks the fno-agents client
      # against its source and fails closed when it is unreachable, so the smoke
      # job supplies it by explicit path (FNO_AGENTS_FRONT) rather than adding
      # it to PATH, where it could shadow another step's entry point.
      shell: bash
      run: |
        # The repo .cargo/config.toml sets build-dir to the cargo-home build
        # base ({cargo-cache-home}/build/{workspace-path-hash}); a toolchain
        # that honors it puts the final binary THERE, and the FRONT export
        # below would point at a path that was never written. Pin the classic
        # layout per build so the binary lands where the export reads.
        cargo clean -p fno-agents --manifest-path crates/fno-agents/Cargo.toml
        CARGO_BUILD_BUILD_DIR="$PWD/crates/fno-agents/target" cargo build --manifest-path crates/fno-agents/Cargo.toml
        test -x "$PWD/crates/fno-agents/target/debug/fno-agents"
        echo "FNO_AGENTS_FRONT=$PWD/crates/fno-agents/target/debug/fno-agents" >> "$GITHUB_ENV"

    - name: Build the fno mux binary
      # The cache above restores crates/fno/target across runs; a lockfile-hash
      # miss falls back to an older prefix match (restore-keys), which can hand
      # back a `fno` binary built from a stale commit. Individual smoke tests
      # (e.g. tests/mux-restart-spares-live-panes.sh) only build it when the
      # path is missing, not when it is merely old, so a stale restore silently
      # ships a binary that predates the source it is meant to test. Clean and
      # rebuild every run, the same discipline the fno-agents front already
      # gets above.
      shell: bash
      run: |
        cargo clean -p fno --manifest-path crates/fno/Cargo.toml
        CARGO_BUILD_BUILD_DIR="$PWD/crates/fno/target" cargo build --manifest-path crates/fno/Cargo.toml --bin fno
        test -x "$PWD/crates/fno/target/debug/fno"
