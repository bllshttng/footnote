name: pr-node-closure

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: pr-node-closure-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-pr-node-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PR node closure
        id: closure
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_REF: ${{ github.head_ref }}
        # shell: bash sets pipefail, so the script's exit code fails the step
        # while tee still captures the remedy text for the annotation step.
        shell: bash
        run: bash scripts/ci/check-pr-node-closure.sh 2>&1 | tee closure.log

      - name: Annotate with the remedy
        if: failure() && steps.closure.outcome == 'failure'
        run: |
          cat closure.log >> "$GITHUB_STEP_SUMMARY"
          echo "::error::PR node closure: the PR body needs the exact closure line (Fixes <id> [<id> ...]). Generate ONE line with: fno do pr closure-trailer <node-id> [--extra <id> ...], then EDIT the PR body: replace every closure line with that one line (the gate reads only the last). Do not rerun this failed run."

  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run self-test
        run: bash scripts/ci/check-pr-node-closure-selftest.sh
