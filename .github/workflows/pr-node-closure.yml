name: pr-node-closure

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: pr-node-closure-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-pr-node-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PR node closure
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_REF: ${{ github.head_ref }}
        run: bash scripts/ci/check-pr-node-closure.sh

  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run self-test
        run: bash scripts/ci/check-pr-node-closure-selftest.sh
