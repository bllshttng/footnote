name: plan-rung-authority

# check-plan-rung-authority.sh keeps "is this plan ready?" answered in exactly
# one place. It used to be answered in seven, across three languages, over four
# vocabularies, with two of the answers using opposite failure policies - and
# the whole defect class started as one reasonable-looking `grep '^status:'`,
# which is why this needs a machine and not a reviewer.
#
# Paths span every language that could grow a second classifier: the Python
# authority itself, the shell callers that delegate to `fno plan rung`, and the
# Rust sources that must keep answering by delegation rather than by parsing.
on:
  push:
    branches: [main]
    paths: &rung_paths
      - cli/src/fno/graph/ladder.py
      - cli/src/fno/plan/_status.py
      - cli/src/fno/plan/cli.py
      - crates/**
      - skills/**
      - scripts/**
      - hooks/**
      - .github/workflows/plan-rung-authority.yml
  pull_request:
    paths: *rung_paths

concurrency:
  group: plan-rung-authority-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-plan-rung-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: One readiness authority (Python table, shell verb, Rust delegation)
        run: bash scripts/ci/check-plan-rung-authority.sh
