name: internal-refs

# The check-no-internal-refs guard blocks four leak classes: `internal/`
# vault-path literals and node IDs / session URLs in shipped prose (docs/,
# agents/, commands/, and top-level AGENTS.md / README.md / CLAUDE.md /
# GEMINI.md), plus competitor product names ANYWHERE in the tree, code
# included. That last class is repo-wide, so the guard must run on every
# change; the script is a few seconds of bash, so this workflow is
# deliberately unconditional rather than path-filtered. cli-ci still avoids
# the full matrix on docs-only edits; this job is the cheap always-on net.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: internal-refs-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-no-internal-refs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: No internal refs or competitor names in the tree
        run: bash scripts/ci/check-no-internal-refs.sh
