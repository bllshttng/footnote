name: skill-local-evals

# skills/<name>/evals/ is a dead convention (zero consumers; the bank is the
# sole eval location). This minimal guard runs ONLY the check on the exact
# paths it scans, mirroring internal-refs.yml, so a recreated
# skills/<name>/evals/ cannot land silently - the deletion made in the
# king-reign-hygiene PR stays durable rather than performative.
on:
  push:
    branches: [main]
    paths: &skill_paths
      - skills/**
      - scripts/ci/check-no-skill-local-evals.sh
      - .github/workflows/skill-local-evals.yml
  pull_request:
    paths: *skill_paths

concurrency:
  group: skill-local-evals-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-no-skill-local-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: No skills/<name>/evals/ dead convention
        run: bash scripts/ci/check-no-skill-local-evals.sh
