name: skill-limitations

on:
  push:
    branches: [main]
    paths: &skill_limitations_paths
      - "skills/**"
      - "scripts/ci/check-skill-limitations.sh"
      - "tests/ci/test-skill-limitations.sh"
      - "tests/fixtures/skill-limitations/**"
      - ".github/workflows/skill-limitations.yml"
  pull_request:
    paths: *skill_limitations_paths

concurrency:
  group: skill-limitations-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-skill-limitations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gate negative controls and positive control
        run: bash tests/ci/test-skill-limitations.sh

      - name: Require every shipped skill to disclose a limitation
        run: bash scripts/ci/check-skill-limitations.sh
