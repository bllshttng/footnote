name: release-binaries

# Build standalone platform binaries (the `fno` front door and all three
# `fno-agents` binaries) into one tarball per platform. Build-only: this
# workflow publishes nothing. It runs on manual dispatch (an inspection
# build) or as a reusable workflow called from release.yml, which owns every
# publish leg behind the `release` environment approval, and from
# main-binaries.yml, which feeds the bin-cache `fno update` downloads from.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "Release version to stamp (PEP 440); empty builds the checked-out source version"
        type: string
        default: ""
      ref:
        description: "Commit to build; empty builds the caller's ref"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: binary ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.runs-on }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: macos-arm64, runs-on: macos-14, rust-target: aarch64-apple-darwin }
          # macos-x64 is cross-compiled on the Apple Silicon runner (the native
          # Intel macos-13 image is retired). rustup adds the x86_64 target and
          # the universal macOS SDK links it; packaging only archives the files,
          # so nothing here executes the x86_64 binaries.
          - { name: macos-x64, runs-on: macos-14, rust-target: x86_64-apple-darwin }
          - { name: linux-x64, runs-on: ubuntu-latest, rust-target: x86_64-unknown-linux-musl }
          - { name: linux-arm64, runs-on: ubuntu-24.04-arm, rust-target: aarch64-unknown-linux-musl }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          # Full history: build.rs bakes in the last commit that touched
          # crates/. A shallow clone has one commit, so the binaries would
          # report HEAD and `fno update` would judge them stale forever.
          fetch-depth: 0

      - name: Stamp release version
        if: inputs.version != ''
        # Workspace-only stamp (never committed): the built binaries report the
        # release version, not main's. The script is taken from THIS workflow's
        # commit, never the released checkout: the nightly ships the newest
        # green rust-ci sha, which can be weeks old and carry a stamp script
        # that predates the PEP 440 -> semver Cargo conversion, writing a PEP
        # 440 version into Cargo.toml where cargo refuses to parse it.
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "${{ github.sha }}"
          git show "${{ github.sha }}:scripts/release/sync-version.sh" > scripts/release/sync-version.sh
          bash scripts/release/sync-version.sh "${{ inputs.version }}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.rust-target }}

      - name: Install musl tools (linux)
        if: startsWith(matrix.target.name, 'linux')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build the fno-agents binaries
        working-directory: crates/fno-agents
        run: cargo build --release --target ${{ matrix.target.rust-target }} --bins

      - name: Build the fno front-door binary
        working-directory: crates/fno
        run: cargo build --release --target ${{ matrix.target.rust-target }} --bin fno

      - name: Package tarball
        shell: bash
        run: |
          # tar's -C is cumulative: a second relative -C resolves from inside
          # the first, so the fno leg chdir'd into
          # crates/fno-agents/target/.../crates/fno/target/... and failed to
          # open. Anchor both dirs at the workspace.
          tar -czf "fno-agents-${{ matrix.target.name }}.tar.gz" \
            -C "$PWD/crates/fno-agents/target/${{ matrix.target.rust-target }}/release" \
              "fno-agents" "fno-agents-daemon" "fno-agents-worker" \
            -C "$PWD/crates/fno/target/${{ matrix.target.rust-target }}/release" "fno"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target.name }}
          path: fno-agents-${{ matrix.target.name }}.tar.gz
