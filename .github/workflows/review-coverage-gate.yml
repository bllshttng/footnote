name: review-coverage-gate

# The CI-side refresher for the `fno/review-coverage` commit status (the
# context the repo ruleset requires on merges to main).
#
# The green marker can only come from a machine that actually ran the review:
# the enforced predicate is a head-pinned LOCAL attestation in events.jsonl,
# which this workflow cannot see. So this job INVALIDATES, never certifies -
# it never posts success on its own judgment, with two deliberate exceptions.
# The first is the `coverage-override` label, the 3am release valve, where
# the label event itself is the human decision and the actor is recorded in
# the description. The second, narrower than the first, is the patch-id
# carry on synchronize: it re-posts a verdict a publisher already wrote onto
# a head whose code is PROVABLY IDENTICAL (git patch-id over the compare
# API), and it invents nothing - see scripts/ci/coverage-carry.sh.
#
# What fires when:
#   synchronize - the head is new, so no local attestation can exist for it
#     yet. Post failure "head moved; re-run the review verb at HEAD" so a
#     previously-green status can never survive onto a commit nobody reviewed
#     - UNLESS the coverage-override label is applied (durable shared state a
#     push does not revoke, re-read first), OR the previous head already
#     carried a publisher verdict whose code is provably identical to the new
#     head (scripts/ci/coverage-carry.sh, checked after the override).
#   labeled/unlabeled (ANY label) - the override arm. It re-reads the LIVE
#     label rather than trusting the label this event carries: held posts
#     success (naming the actor when they are the one who applied the
#     override), absent invalidates the override's OWN green, re-reading the
#     head first so a verdict a publisher wrote survives the spent label's
#     removal. Reading the live label is what makes an unrelated label event
#     harmless AND healing - `cancel-in-progress` groups by PR, so a second
#     label event seconds later kills the override's own run, and an arm that
#     switched on `github.event.label.name` alone would leave the valve shut
#     with nobody to re-open it.
#
# The override label is read by EVERY writer of this status (the Rust
# publishers in loopcheck.rs re-read it before each post), so a cancelled
# labeled run here heals on the next write from any of them rather than
# silently revoking the valve.
#   opened/reopened/ready_for_review - no status change. The context starts
#     absent, which a required-check reads as pending: exactly right for a
#     PR no review verb has run on yet.
#   workflow_dispatch - manual re-stamp for the PR named in its required `pr`
#     input; same invalidate-only stance. The input exists because
#     `github.sha` on a dispatch is the default-branch tip, and a failure
#     status there red-marks a commit on main no review verb can answer for.
#
# FORK PRs ARE SKIPPED, AND THAT IS ACCEPTED. A `pull_request` event from a
# fork gets a read-only GITHUB_TOKEN whatever `permissions:` says, so a fork
# PR can never post the context and can never be merged while the ruleset is
# applied. This repo takes no external PRs; the `coverage-override` label is
# the release valve if that ever changes and a fork contribution must land.
# (Same trade as stacked-base-guard.yml, recorded here so the next person
# does not discover it during an incident.)
#
# The local publishers - the stop-hook emitter, the standalone
# `fno-agents review-coverage` verb, and `fno pr merge` - are what post
# success. This workflow is the half they cannot do: reacting to pushes made
# from somewhere other than the reviewing machine.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number whose head to invalidate the coverage status on"
        required: true

concurrency:
  group: >-
    review-coverage-gate-${{ github.event.pull_request.number ||
    github.event.inputs.pr || github.sha }}
  cancel-in-progress: true

permissions:
  statuses: write
  pull-requests: read
  contents: read

jobs:
  refresh:
    # Fork guard, same as stacked-base-guard: a read-only token cannot POST,
    # and a skipped run is the honest outcome - not a red one it can never
    # make green.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only the synchronize arm needs the carry script on disk; every other
      # arm posts from API reads alone. Guarded so no other arm pays for a
      # checkout it does not use. The BASE version, not the PR's - a PR
      # cannot edit its own gate script and self-green - at sparse depth 1
      # to keep the job inside its five-minute budget.
      - name: Checkout the carry script (base ref, synchronize only)
        if: github.event.action == 'synchronize'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          sparse-checkout: scripts/ci
      - name: Invalidate or re-evaluate the coverage status
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name || '' }}
          ACTOR: ${{ github.actor }}
          PR_INPUT: ${{ github.event.inputs.pr || '' }}
          # A PR event names its own head. A dispatch does NOT: `github.sha`
          # there is the default-branch tip, and stamping a failure on it
          # red-marks a commit on main that no review verb can ever answer for.
          # The dispatch arm resolves the head from its `pr` input instead.
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          ctx=fno/review-coverage
          # This job has no checkout and gh does not fall back to
          # GITHUB_REPOSITORY without a git repo, so every gh call names the
          # repository explicitly or dies client-side.
          # A failed POST fails the step on purpose: a release valve that
          # silently fails to open reads as open. The one exception is the
          # transient 5xx, which GitHub's own status page says to resubmit:
          # three attempts with a backoff before a failure counts.
          post() {
            local attempt
            for attempt in 1 2 3; do
              if gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
                -f state="$1" -f context="$ctx" -f description="$2" >/dev/null; then
                return 0
              fi
              echo "status post attempt $attempt failed; retrying after a backoff" >&2
              sleep 5
            done
            return 1
          }
          case "$EVENT:$ACTION" in
            pull_request:synchronize|pull_request:labeled|pull_request:unlabeled)
              # A queued run can outlive its PR. A status posted on a MERGED
              # head is read by the post-merge audit, where a late invalidate
              # would false-red a merge that passed every gate, and nothing
              # can repair it (the branch is gone). Re-read the live state.
              # Retries the same 3x/5s backoff as the reads below it: this is
              # the first gh call in the step, so an un-retried transient 5xx
              # here would abort the run earlier than any of its siblings.
              pr_state_read() {
                local attempt out
                for attempt in 1 2 3; do
                  if out="$(gh pr view "${{ github.event.pull_request.number }}" \
                    -R "${GITHUB_REPOSITORY}" --json state --jq .state)"; then
                    printf '%s' "$out"
                    return 0
                  fi
                  echo "review-coverage-gate: PR-state read attempt ${attempt} failed; retrying after a backoff" >&2
                  sleep 5
                done
                return 1
              }
              state="$(pr_state_read)"
              if [ "$state" != "OPEN" ]; then
                echo "PR is ${state}; no status change"
                exit 0
              fi
              ;;
          esac
          # The description our context currently carries on this head, via
          # the COMBINED endpoint (one entry per context, the latest - no
          # same-second tie to break; the same read the post-merge audit
          # uses). Empty means no status yet. Retries the same 3x/5s backoff
          # as coverage-carry.sh's status_read and the audit's coverage_field
          # before giving up, so a transient 5xx does not abort this run one
          # call earlier than either sibling would. A read that still fails
          # after retrying fails the run (set -e): an unreadable description
          # must never masquerade as "no status", or the invalidate arms
          # would clobber a green verdict on the same transient class post()
          # retries for.
          # No `-R` here: gh api has no repo flag, and the URL path already
          # names the repository (pr view above needs -R; api never did).
          current_desc() {
            local attempt out
            for attempt in 1 2 3; do
              if out="$(gh api \
                "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/status" \
                --jq "[.statuses[] | select(.context == \"$ctx\")] | first | .description // \"\"")"; then
                printf '%s' "$out"
                return 0
              fi
              echo "review-coverage-gate: status read attempt ${attempt} failed; retrying after a backoff" >&2
              sleep 5
            done
            return 1
          }
          # The LIVE label state, read by NAME. A grep over the raw JSON blob
          # also sees each label's description and colour, so an unrelated
          # label described "coverage-override" would re-stamp success on a
          # head nobody reviewed. Retries the same 3x/5s backoff as
          # current_desc() above: this read runs first on every label event
          # and every synchronize, so an un-retried transient 5xx here aborts
          # the run one call earlier than current_desc()'s own hardening.
          override_held() {
            local attempt out
            for attempt in 1 2 3; do
              if out="$(gh pr view "${{ github.event.pull_request.number }}" \
                -R "${GITHUB_REPOSITORY}" --json labels \
                --jq '[.labels[].name] | index("coverage-override") != null')"; then
                printf '%s' "$out"
                return 0
              fi
              echo "review-coverage-gate: label read attempt ${attempt} failed; retrying after a backoff" >&2
              sleep 5
            done
            return 1
          }
          case "$EVENT:$ACTION" in
            pull_request:labeled|pull_request:unlabeled)
              # Every label event re-reads the LIVE label, not just the one
              # this event carries. `cancel-in-progress` groups by PR, so an
              # unrelated label added seconds after the override CANCELS the
              # override's own run; if that run were the only thing that could
              # stamp the valve, the valve would silently fail to open - the
              # one failure mode a release valve must not have. Any label event
              # re-converges the status on the label that is actually there.
              held="$(override_held)"
              if [ "$held" = "true" ]; then
                if [ "$LABEL" = "coverage-override" ]; then
                  post success "coverage-override label applied by ${ACTOR}"
                  echo "override: posted success naming ${ACTOR}"
                else
                  # A different label moved. The actor here labelled something
                  # else, so the description must not name them as the waiver.
                  post success "coverage-override label still applied"
                  echo "override still held; re-stamped success"
                fi
              else
                # Withdrawal invalidates the LABEL's green, never a verdict a
                # publisher wrote. At 3am the operator labels, the worker
                # then reviews for real, the publisher greens the head, and
                # the operator removes the spent label - posting failure
                # there blocks a covered PR until someone re-reviews. Re-read
                # what the head carries; only the override's own green dies
                # with the override.
                cur="$(current_desc)"
                case "$cur" in
                  coverage-override*)
                    post failure "coverage-override withdrawn by ${ACTOR}; run the review verb at HEAD"
                    echo "override withdrawn: invalidated the override green"
                    ;;
                  *)
                    echo "no override held; head carries '${cur:-no status}' - no change"
                    ;;
                esac
              fi
              ;;
            pull_request:synchronize)
              # The override label is durable: a push does not revoke it. The
              # operator's fix commit after a 3am override keeps the valve
              # they are still holding, so the label is re-read before the
              # head is invalidated.
              held="$(override_held)"
              if [ "$held" = "true" ]; then
                post success "coverage-override label still applied (head moved to ${HEAD_SHA:0:8})"
                echo "synchronize: override still held; re-stamped success at ${HEAD_SHA:0:8}"
              else
                # The same guard as withdrawal, for the delayed run: a
                # publisher may have reviewed this new head and posted a
                # covered verdict before this queued run got its turn.
                # Invalidation must not clobber a real verdict, only hold
                # the line where none exists yet.
                cur="$(current_desc)"
                case "$cur" in
                  covered*|"no review lane"*)
                    echo "synchronize: head ${HEAD_SHA:0:8} already carries a publisher verdict - no change"
                    ;;
                  *)
                    # The base-ref checkout cannot find the carry script on
                    # any PR that has not yet merged it to main (this one
                    # included) - by design, since a PR must never be able to
                    # edit its own gate script and self-green. That absence,
                    # like any other failure to run the script, degrades to
                    # no-carry rather than aborting the step under set -e.
                    if [ -f scripts/ci/coverage-carry.sh ]; then
                      decision="$(bash scripts/ci/coverage-carry.sh \
                        --repo "$GITHUB_REPOSITORY" --context "$ctx" \
                        --before "$BEFORE_SHA" --head "$HEAD_SHA" --base "$BASE_REF")" || decision="no-carry script-failed"
                    else
                      decision="no-carry script-missing"
                    fi
                    case "$decision" in
                      carry\ *)
                        read -r _ origin pid desc <<<"$decision"
                        post success "$desc"
                        echo "synchronize: carried the verdict from ${origin:0:8} (patch-id ${pid}) onto ${HEAD_SHA:0:8}"
                        ;;
                      *)
                        post failure "head moved to ${HEAD_SHA:0:8}; re-run the review verb at HEAD"
                        echo "synchronize: invalidated at ${HEAD_SHA:0:8} (${decision})"
                        ;;
                    esac
                    ;;
                esac
              fi
              ;;
            workflow_dispatch:)
              if [ -z "$PR_INPUT" ]; then
                echo "workflow_dispatch needs a 'pr' input; refusing to stamp a status on a commit no PR names" >&2
                exit 1
              fi
              HEAD_SHA="$(gh pr view "$PR_INPUT" -R "${GITHUB_REPOSITORY}" \
                --json headRefOid --jq .headRefOid)"
              if [ -z "$HEAD_SHA" ]; then
                echo "could not resolve the head of PR ${PR_INPUT}" >&2
                exit 1
              fi
              post failure "manual invalidate at ${HEAD_SHA:0:8}; run the review verb at HEAD"
              echo "dispatch: invalidated PR ${PR_INPUT} at ${HEAD_SHA:0:8}"
              ;;
            *)
              echo "$EVENT:$ACTION: no status change (invalidate-only)"
              ;;
          esac
