name: review-coverage-gate

# The CI-side refresher for the `fno/review-coverage` commit status (the
# context the repo ruleset requires on merges to main).
#
# The green marker can only come from a machine that actually ran the review:
# the enforced predicate is a head-pinned LOCAL attestation in events.jsonl,
# which this workflow cannot see. So this job INVALIDATES, never certifies -
# it never posts success on its own judgment, with one deliberate exception:
# the `coverage-override` label, the 3am release valve, where the label event
# itself is the human decision and the actor is recorded in the description.
#
# What fires when:
#   synchronize - the head is new, so no local attestation can exist for it
#     yet. Post failure "head moved; re-run the review verb at HEAD" so a
#     previously-green status can never survive onto a commit nobody reviewed
#     - UNLESS the coverage-override label is applied: the override is durable
#     shared state that a push does not revoke, so it is re-read first.
#   labeled/unlabeled with `coverage-override` - the override arm: label
#     present posts success naming the actor; withdrawn invalidates the
#     override's OWN green, re-reading the head first so a verdict a
#     publisher wrote survives the spent label's removal. Any other label is
#     a no-op: re-posting failure would clobber a green marker a worker
#     legitimately published on that same sha.
#
# The override label is read by EVERY writer of this status (the Rust
# publishers in loopcheck.rs re-read it before each post), so a cancelled
# labeled run here heals on the next write from any of them rather than
# silently revoking the valve.
#   opened/reopened/ready_for_review - no status change. The context starts
#     absent, which a required-check reads as pending: exactly right for a
#     PR no review verb has run on yet.
#   workflow_dispatch - manual re-stamp; same invalidate-only stance.
#
# FORK PRs ARE SKIPPED, AND THAT IS ACCEPTED. A `pull_request` event from a
# fork gets a read-only GITHUB_TOKEN whatever `permissions:` says, so a fork
# PR can never post the context and can never be merged while the ruleset is
# applied. This repo takes no external PRs; the `coverage-override` label is
# the release valve if that ever changes and a fork contribution must land.
# (Same trade as stacked-base-guard.yml, recorded here so the next person
# does not discover it during an incident.)
#
# The local publishers - the stop-hook emitter, the standalone
# `fno-agents review-coverage` verb, and `fno pr merge` - are what post
# success. This workflow is the half they cannot do: reacting to pushes made
# from somewhere other than the reviewing machine.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: review-coverage-gate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  statuses: write
  pull-requests: read

jobs:
  refresh:
    # Fork guard, same as stacked-base-guard: a read-only token cannot POST,
    # and a skipped run is the honest outcome - not a red one it can never
    # make green.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Invalidate or re-evaluate the coverage status
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name || '' }}
          ACTOR: ${{ github.actor }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ctx=fno/review-coverage
          # This job has no checkout and gh does not fall back to
          # GITHUB_REPOSITORY without a git repo, so every gh call names the
          # repository explicitly or dies client-side.
          # A failed POST fails the step on purpose: a release valve that
          # silently fails to open reads as open. The one exception is the
          # transient 5xx, which GitHub's own status page says to resubmit:
          # three attempts with a backoff before a failure counts.
          post() {
            local attempt
            for attempt in 1 2 3; do
              if gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
                -f state="$1" -f context="$ctx" -f description="$2" >/dev/null; then
                return 0
              fi
              echo "status post attempt $attempt failed; retrying after a backoff" >&2
              sleep 5
            done
            return 1
          }
          case "$EVENT:$ACTION" in
            pull_request:synchronize|pull_request:labeled|pull_request:unlabeled)
              # A queued run can outlive its PR. A status posted on a MERGED
              # head is read by the post-merge audit, where a late invalidate
              # would false-red a merge that passed every gate, and nothing
              # can repair it (the branch is gone). Re-read the live state.
              state="$(gh pr view "${{ github.event.pull_request.number }}" \
                -R "${GITHUB_REPOSITORY}" --json state --jq .state)"
              if [ "$state" != "OPEN" ]; then
                echo "PR is ${state}; no status change"
                exit 0
              fi
              ;;
          esac
          # The description our context currently carries on this head, via
          # the COMBINED endpoint (one entry per context, the latest - no
          # same-second tie to break; the same read the post-merge audit
          # uses). Empty means no status yet. A FAILED read fails the run
          # (set -e), exactly like the label read below: an unreadable
          # description must never masquerade as "no status", or the
          # invalidate arms would clobber a green verdict on a transient
          # 5xx - the same transient class post() retries for.
          current_desc() {
            gh api -R "${GITHUB_REPOSITORY}" \
              "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/status" \
              --jq "[.statuses[] | select(.context == \"$ctx\")] | first | .description // \"\""
          }
          case "$EVENT:$ACTION" in
            pull_request:labeled)
              if [ "$LABEL" = "coverage-override" ]; then
                post success "coverage-override label applied by ${ACTOR}"
                echo "override: posted success naming ${ACTOR}"
              else
                echo "label '${LABEL}' is not the override; no status change"
              fi
              ;;
            pull_request:unlabeled)
              if [ "$LABEL" = "coverage-override" ]; then
                # Withdrawal invalidates the LABEL's green, never a verdict a
                # publisher wrote. At 3am the operator labels, the worker
                # then reviews for real, the publisher greens the head, and
                # the operator removes the spent label - posting failure
                # there blocks a covered PR until someone re-reviews. Re-read
                # what the head carries; only the override's own green dies
                # with the override.
                cur="$(current_desc)"
                case "$cur" in
                  coverage-override*)
                    post failure "coverage-override withdrawn by ${ACTOR}; run the review verb at HEAD"
                    echo "override withdrawn: invalidated the override green"
                    ;;
                  *)
                    echo "override withdrawn; head carries '${cur:-no status}' - no change"
                    ;;
                esac
              else
                echo "label '${LABEL}' is not the override; no status change"
              fi
              ;;
            pull_request:synchronize)
              # The override label is durable: a push does not revoke it. The
              # operator's fix commit after a 3am override keeps the valve
              # they are still holding, so the label is re-read before the
              # head is invalidated.
              # Read the label by NAME, the same jq the Python and Rust
              # siblings use. A grep over the raw JSON blob also sees each
              # label's description and colour, so an unrelated label
              # described "coverage-override" would re-stamp success on a
              # head nobody reviewed.
              held="$(gh pr view "${{ github.event.pull_request.number }}" \
                    -R "${GITHUB_REPOSITORY}" --json labels \
                    --jq '[.labels[].name] | index("coverage-override") != null')"
              if [ "$held" = "true" ]; then
                post success "coverage-override label still applied (head moved to ${HEAD_SHA:0:8})"
                echo "synchronize: override still held; re-stamped success at ${HEAD_SHA:0:8}"
              else
                # The same guard as withdrawal, for the delayed run: a
                # publisher may have reviewed this new head and posted a
                # covered verdict before this queued run got its turn.
                # Invalidation must not clobber a real verdict, only hold
                # the line where none exists yet.
                cur="$(current_desc)"
                case "$cur" in
                  covered*|"no review lane"*)
                    echo "synchronize: head ${HEAD_SHA:0:8} already carries a publisher verdict - no change"
                    ;;
                  *)
                    post failure "head moved to ${HEAD_SHA:0:8}; re-run the review verb at HEAD"
                    echo "synchronize: invalidated at ${HEAD_SHA:0:8}"
                    ;;
                esac
              fi
              ;;
            workflow_dispatch:)
              post failure "manual invalidate at ${HEAD_SHA:0:8}; run the review verb at HEAD"
              echo "dispatch: invalidated at ${HEAD_SHA:0:8}"
              ;;
            *)
              echo "$EVENT:$ACTION: no status change (invalidate-only)"
              ;;
          esac
