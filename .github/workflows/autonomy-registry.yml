name: autonomy-registry

# Ratchet on every spawn-shaped call site, Python and shell, so a tenth
# autonomous door cannot be added silently (x-aaaf wave 3.3, AC6-CON). A new
# site fails CI until it is recorded in the baseline naming the fno autonomy
# status spawner it belongs to, or why it is not autonomous. Pure stdlib +
# bash, so no uv or fno setup is needed.

on:
  pull_request:
    paths:
      - cli/src/**
      - hooks/**
      - scripts/**
      - skills/**
      - .github/workflows/autonomy-registry.yml
  push:
    branches: [main]
    paths:
      - cli/src/**
      - hooks/**
      - scripts/**
      - skills/**

concurrency:
  group: autonomy-registry-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: autonomy registry ratchet
        run: bash scripts/ci/check-autonomy-registry.sh
