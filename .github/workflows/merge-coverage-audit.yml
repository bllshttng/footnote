name: merge-coverage-audit

# The audit that notices the gate going missing (AC6) and the merge that
# slipped through it (AC7). Runs on every push to main:
#
#   1. apply-merge-ruleset.sh --check - the ruleset still exists, still
#      requires both contexts, and still has an empty bypass list. A required
#      check protects the branch; this run is the only thing protecting the
#      required check from being deleted or weakened in the GitHub UI.
#   2. Every merge commit in the push's range carries a success
#      fno/review-coverage status on its merged head (the second parent) -
#      the positive marker that a covered verdict existed, never the absence
#      of a refusal. Override merges pass and are reported by name.
#
# A red run here means either the gate was weakened or a merge landed
# uncovered; both are operator-visible facts worth a red main.
on:
  push:
    branches: [main]

permissions:
  contents: read
  statuses: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The audit walks first-parent history between the previous push
          # and the new head; a shallow clone cannot answer that.
          fetch-depth: 0
      - name: Audit the merge coverage gate
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # On the first push (or a force-flushed history) `before` is all
          # zeroes; fall back to a window shallow enough to stay meaningful.
          since="${BEFORE}"
          if [ -z "$since" ] || [ "${since:0:7}" = "0000000" ]; then
            since="$(git rev-parse HEAD~20)"
            echo "push carried no usable before-sha; auditing the last 20 commits instead"
          fi
          bash scripts/ci/check-merge-coverage-audit.sh --since "$since"
