name: pr-body-length

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: pr-body-length-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-pr-body-length:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PR body length
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/ci/check-pr-body-length.sh

  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run self-test
        run: bash tests/ci/test_pr_body_length.sh
