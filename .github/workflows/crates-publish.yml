name: crates-publish

# Validate that `fno-agents` and `fno` still PACKAGE: on PRs touching either
# crate it runs `cargo publish --dry-run` only (no upload). Publishing lives
# in release.yml's `publish` job, behind the `release` environment approval -
# crates.io uploads are permanent (a version cannot be re-uploaded), so the
# one click is the only path.

# Cancel a PR's superseded dry-run on re-push (Actions minute conservation).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - crates/fno-agents/**
      - crates/fno/**
      - .github/workflows/crates-publish.yml

permissions:
  contents: read

jobs:
  dry-run:
    name: cargo publish --dry-run (${{ matrix.crate }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # crate = the crates.io name; dir = the crate directory.
        include:
          - crate: fno-agents
            dir: crates/fno-agents
          - crate: fno
            dir: crates/fno
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Dry-run package + verify
        # Explicit --manifest-path (never a cwd/glob resolution) so the stale
        # untracked pre-rename crate dir can never be packaged by mistake (AC5-FR).
        run: cargo publish --dry-run --manifest-path "${{ matrix.dir }}/Cargo.toml"
