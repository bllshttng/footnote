name: disposable-rm

# check-disposable-rm.sh: the two files that delete fno-owned disposable state
# under the preflight mutex or at worktree scale must not call bare `rm`. On a
# machine whose rm is wrapped to a trash tool, a bare rm moves the path instead
# of unlinking it: non-atomic work inside the lock section, or gigabytes
# relocated instead of reclaimed. Allowlist of files, never a repo-wide ban.
on:
  push:
    branches: [main]
    paths: &disposable_rm_paths
      - scripts/ci/preflight.sh
      - hooks/worktree-remove.sh
      - scripts/ci/check-disposable-rm.sh
      - tests/ci/test-check-disposable-rm.sh
      - .github/workflows/disposable-rm.yml
  pull_request:
    paths: *disposable_rm_paths

concurrency:
  group: disposable-rm-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-disposable-rm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bare rm in disposable-delete files
        run: bash scripts/ci/check-disposable-rm.sh

      - name: Gate self-test
        run: bash tests/ci/test-check-disposable-rm.sh
