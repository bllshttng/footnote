name: rust-ci

# W7 moved: the heavy `cargo test + schema parity` job lives in cli-ci.yml
# now, gated behind every smoke-pytest shard. This workflow keeps coverage that
# is not a duplicate heavy suite: formatting, the warnings ratchet, the PR
# stress trials, and dependency audit.

# PR re-pushes share a group keyed by head_ref and cancel their own running
# run. Main pushes share a group keyed by ref, so a new main push supersedes
# only the queued main run and never cancels the running one.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - crates/**
      - schemas/**
      - cli/src/fno/events/schema.yaml
      - scripts/ci/preflight.sh
      - scripts/tests/stress-rust-e2e-concurrency.sh
      - cli/src/fno/config/__init__.py
      - cli/src/fno/pr/_reviews.py
      - cli/src/fno/review_capability.py
      - cli/src/fno/agents/spawn_defaults.py
      - cli/src/fno/agents/spawn_gate.py
      - cli/src/fno/agents/registry.py
      - cli/src/fno/agents/store_fallback.py
      - cli/src/fno/agents/mux_spawn.py
      - .github/workflows/rust-ci.yml

jobs:
  fmt:
    name: cargo fmt --check (pinned)
    if: github.event_name == 'pull_request'
    # Pinned-toolchain rustfmt gate (ab-abff720d). The crate had package-wide
    # rustfmt drift with no gate to catch it, so plain `cargo fmt` polluted
    # every contributor's diff. The version is PINNED (not @stable) so a future
    # stable rustfmt that changes formatting cannot fail this gate on untouched
    # code -- the committed format and the gate's format move together only
    # when this pin is bumped deliberately. Keep RUSTFMT_TOOLCHAIN in lockstep
    # with the version used for the next package-wide sweep.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The toolchain whose rustfmt produced the committed formatting. Bump
      # this and re-run `cargo +<ver> fmt` over the crate together, never apart.
      RUSTFMT_TOOLCHAIN: "1.94.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pinned rustfmt toolchain
        # rustup ships on ubuntu-latest runners. Pin the exact toolchain via
        # rustup (not a floating dtolnay @stable) so the gate is deterministic.
        run: |
          rustup toolchain install "$RUSTFMT_TOOLCHAIN" --component rustfmt --profile minimal --no-self-update
          rustup run "$RUSTFMT_TOOLCHAIN" rustfmt --version

      - name: cargo fmt --check (fno-agents)
        working-directory: crates/fno-agents
        run: cargo "+$RUSTFMT_TOOLCHAIN" fmt --all --check

      - name: cargo fmt --check (fno)
        working-directory: crates/fno
        run: cargo "+$RUSTFMT_TOOLCHAIN" fmt --all --check

  warnings:
    name: cargo check --all-targets (deny warnings)
    # The ratchet the node asked for: rustc warnings fail CI, so the count can
    # never climb back. A dedicated job, not RUSTFLAGS on the `test` job - a
    # flag change re-fingerprints every dependency, and sharing that job's
    # cache key would rebuild its whole dep tree on every run. `cargo check`
    # here (no codegen, no test execution), so the failure means exactly one
    # thing: a warning.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry + build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/build
            crates/fno-agents/target
            crates/fno/target
          # Key prefix deliberately OUTSIDE the `test` job's `cargo-` restore
          # prefix (same rule the `stressonly` key records below): the test job
          # builds check-only artifacts that the big job must never restore.
          # It still WARMS from the big cache via its own restore-keys - the
          # asymmetry is the point.
          key: ${{ runner.os }}-warncheck-${{ hashFiles('crates/fno-agents/Cargo.lock', 'crates/fno/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-warncheck-
            ${{ runner.os }}-cargo-

      - name: cargo check --all-targets (fno-agents)
        working-directory: crates/fno-agents
        run: cargo check --all-targets --locked

      - name: cargo check --all-targets (fno)
        working-directory: crates/fno
        run: cargo check --all-targets --locked

  stress:
    name: rust e2e concurrency stress (20 trials)
    # Pull requests only, like the `fmt` job above. The push trigger at the top
    # of this file carries no `paths:` filter, so without this the 20 trials -
    # about 24 minutes - would run on EVERY commit to main, which contradicts
    # the path-triggered rationale below and buys nothing: the same trials
    # already ran on the PR that produced that commit.
    if: github.event_name == 'pull_request'
    # The determinism claim this workflow's --test-threads=1 steps make is a
    # claim about REPEATED runs, so something has to repeat them. That used to
    # ride the cli-ci smoke shard, where the 20-trial default cost 756s of a
    # 1800s cap and killed the shard at 30 minutes. The denominator belongs
    # here instead: this workflow is path-triggered on crates/**, on
    # preflight.sh and on the harness itself, so the trials run exactly when
    # the thing they measure can have changed, and they run beside the other
    # jobs rather than serially inside someone else's budget.
    #
    # The cap is SET from measurement, not raised to absorb slack. Two
    # components: the trials, measured 2026-08-25 at a flat 35.9s each, so 20
    # of them are about 12 minutes; and a cold build of the three test
    # binaries, which the cargo test + schema parity job in cli-ci.yml shows
    # costs the larger half of its own 20-minute run. That is roughly 24
    # minutes on a cold cache, and 35
    # leaves room for a slow runner without leaving room for the suite to grow
    # unnoticed. If this job approaches the cap, cut trials or split the
    # binaries across two jobs; do not raise it.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # REPORTS, does not gate. The step publishes its trial count to the run
    # summary and always exits 0; graduate by making it assert failures=0, and
    # only once the comparison below says something. `continue-on-error` stays
    # as a second belt against a step that dies before its own reporting runs.
    #
    # WHAT THIS HARNESS HAS AND HAS NOT SHOWN, measured 2026-08-25 on this
    # runner. Read this before citing a trial count as evidence of anything.
    #
    # Baseline, origin/main plus this harness and nothing else, 20 trials: ZERO
    # real test failures. Branch, 40 trials across two runs: two. One
    # `persistence`, one daemon_e2e `registry_list_refuses_over_a_broken_
    # registered_lane`, both genuine non-zero exits rather than a missing
    # marker. Two events against twenty trials of baseline separates nothing -
    # a zero in twenty is consistent with rates well above five percent - so
    # the honest reading is that this harness has NOT demonstrated the
    # serialization reduced flakiness. It has not shown the reverse either.
    #
    # The reason it cannot, yet: this harness runs three binaries in parallel
    # with `--test-threads=1` inside each, and the failures that motivated the
    # work came from `cargo test --all-targets`, which is far more parallel
    # than that. So the profile reproduced here is not the profile that broke.
    # Closing the question means reproducing THAT one.
    #
    # One thing it did settle cleanly. Its `daemons_left` counter reads
    # 2, 4, 6 ... 40 across the baseline's twenty trials, exactly two leaked
    # daemons per trial, and 0 on every trial of the branch. That reproduces
    # the ~40 orphans the original killed job cleaned up, and it is what the
    # reap fix closed.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry + build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/build
            crates/fno-agents/target
            crates/fno/target
          # A key of its OWN, and one that is NOT a prefix match for the shared
          # one. This job builds three test binaries where the `test` job builds
          # forty-six, and it finishes about seven minutes earlier, so a shared
          # key means this small tree wins the save race and the big job
          # restores a cache missing most of its artifacts. The first attempt at
          # this comment claimed a dedicated key fixed that while still naming
          # it `<os>-cargo-stress-...`, which the `test` job's own
          # `restore-keys: <os>-cargo-` matches as a prefix - the same failure,
          # one indirection later. `stressonly` sorts outside that prefix.
          #
          # The asymmetry is deliberate: this job still warms from the big
          # cache, and the big job can no longer restore this one.
          key: ${{ runner.os }}-stressonly-${{ hashFiles('crates/fno-agents/Cargo.lock', 'crates/fno/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-stressonly-
            ${{ runner.os }}-cargo-

      - name: Stress the process-backed e2e binaries
        # The exit code is not enough on its own. The script stands down with a
        # zero exit on a dirty tree (it cannot pin a sha), which is right where
        # it is auto-discovered by the local smoke suite and wrong here, where a
        # silent stand-down would publish a green job that ran no trials. So the
        # gate is the POSITIVE summary line, naming the trial count this job
        # exists to run. It reads STRESS_TRIALS, and 20 is already its default;
        # naming it here is what makes the contract greppable.
        env:
          STRESS_TRIALS: "20"
        run: |
          cargo clean -p fno-agents --manifest-path crates/fno-agents/Cargo.toml
          cargo clean -p fno --manifest-path crates/fno/Cargo.toml
          # No pipeline and no `pipefail`. Both were here, under the runner's
          # default `bash -e`, which made a failing harness fatal at the pipe:
          # the `rc=` capture and the whole summary block below never ran, so
          # this job published ZERO evidence on exactly the runs it exists to
          # report - and `continue-on-error` rendered that silence as a green
          # check. A redirect plus `|| rc=$?` keeps the exit code exact and
          # keeps `-e` out of it.
          rc=0
          bash scripts/tests/stress-rust-e2e-concurrency.sh > stress.log 2>&1 || rc=$?
          cat stress.log
          # This job REPORTS. Its only output is the run summary, and it exits 0
          # whatever happened, because every non-zero path here is
          # infrastructure noise rather than a verdict: the harness exits 2 when
          # a cargo build fails, exits 0 with no summary on a dirty tree, and
          # exits 1 on a failed trial - which is the number being published, not
          # a reason to red a PR. An earlier version failed on a missing summary
          # and turned all three into a red merge-readiness signal.
          #
          # What replaces that guard is an explicit NOT-MEASURED line. A reader
          # who sees nothing learns nothing; a reader who sees "not measured"
          # knows the difference between that and a clean twenty trials.
          summary="$(grep '^stress_summary ' stress.log || true)"
          if [ -n "$summary" ]; then
            echo "$summary" >> "$GITHUB_STEP_SUMMARY"
            grep '^stress_trial .*=fail' stress.log >> "$GITHUB_STEP_SUMMARY" || true
          else
            # `|| true`: no marker line is the ordinary case here, and a
            # failing substitution would abort the step under `-e` at the one
            # point whose whole job is to report that nothing was measured.
            reason="$(grep -E '^stress_(skipped|setup)=' stress.log | tail -1 || true)"
            echo "stress_not_measured exit=$rc ${reason:-reason=unknown}" >> "$GITHUB_STEP_SUMMARY"
          fi
          cat "$GITHUB_STEP_SUMMARY"

  audit:
    name: cargo audit (RUSTSEC advisories)
    # Scans Cargo.lock against the RustSec advisory DB. Vulnerabilities fail
    # the job; informational findings (unmaintained, yanked) warn but stay
    # green. Known expected warning: `serial` 0.4.0 (RUSTSEC-2017-0008) via
    # portable-pty 0.8 -- clears when the dep-refresh node ab-e784d8ff bumps
    # portable-pty to 0.9 (which swaps serial for the maintained serial2).
    # No cron trigger: advisories on untouched deps surface on the next
    # crates/** push, which is frequent enough here. Runs locally as
    # `cargo audit` from crates/fno-agents (cargo install cargo-audit).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install cargo-audit (prebuilt)
        # Prebuilt binary install; compiling cargo-audit from source costs
        # ~5 min of CI per run.
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit (fno-agents)
        working-directory: crates/fno-agents
        run: cargo audit

      - name: cargo audit (fno)
        working-directory: crates/fno
        run: cargo audit
