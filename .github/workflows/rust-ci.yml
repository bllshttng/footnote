name: rust-ci

# W7: Run Rust tests + schema parity check. This is the job that finally
# makes flock_interop.rs (the Phase 6 kill criterion) gate on every main head.
#
# Also runs scripts/check-event-schema-parity.sh with the built binary so
# Rust-side schema drift is caught when crates/** or schema files change.

# Cancel a PR's superseded runs on re-push (Actions minute conservation). Keyed by head_ref so PR re-pushes share a
# group; non-PR events use a unique run_id, so every main commit keeps its own
# run.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - crates/**
      - schemas/**
      - cli/src/fno/events/schema.yaml
      - scripts/check-event-schema-parity.sh
      - scripts/ci/check-registry-schema-parity.sh
      - scripts/ci/check-provider-vocabulary-parity.sh
      - tests/ci/test_provider_vocabulary_parity.sh
      - scripts/ci/check-session-identity-parity.sh
      - tests/ci/test_session_identity_parity.sh
      - scripts/ci/check-spawn-lineage-parity.sh
      - tests/ci/test_spawn_lineage_parity.sh
      - scripts/ci/check-proto-version-bump.sh
      - scripts/ci/check-reviewer-descriptor-parity.sh
      - scripts/ci/check-review-app-parity.sh
      - scripts/ci/preflight.sh
      - scripts/tests/stress-rust-e2e-concurrency.sh
      - cli/src/fno/config/__init__.py
      - cli/src/fno/pr/_reviews.py
      - cli/src/fno/review_capability.py
      - cli/src/fno/agents/spawn_defaults.py
      - cli/src/fno/agents/spawn_gate.py
      - cli/src/fno/agents/registry.py
      - cli/src/fno/agents/store_fallback.py
      - cli/src/fno/agents/mux_spawn.py
      - .github/workflows/rust-ci.yml

jobs:
  fmt:
    name: cargo fmt --check (pinned)
    if: github.event_name == 'pull_request'
    # Pinned-toolchain rustfmt gate (ab-abff720d). The crate had package-wide
    # rustfmt drift with no gate to catch it, so plain `cargo fmt` polluted
    # every contributor's diff. The version is PINNED (not @stable) so a future
    # stable rustfmt that changes formatting cannot fail this gate on untouched
    # code -- the committed format and the gate's format move together only
    # when this pin is bumped deliberately. Keep RUSTFMT_TOOLCHAIN in lockstep
    # with the version used for the next package-wide sweep.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The toolchain whose rustfmt produced the committed formatting. Bump
      # this and re-run `cargo +<ver> fmt` over the crate together, never apart.
      RUSTFMT_TOOLCHAIN: "1.94.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pinned rustfmt toolchain
        # rustup ships on ubuntu-latest runners. Pin the exact toolchain via
        # rustup (not a floating dtolnay @stable) so the gate is deterministic.
        run: |
          rustup toolchain install "$RUSTFMT_TOOLCHAIN" --component rustfmt --profile minimal --no-self-update
          rustup run "$RUSTFMT_TOOLCHAIN" rustfmt --version

      - name: cargo fmt --check (fno-agents)
        working-directory: crates/fno-agents
        run: cargo "+$RUSTFMT_TOOLCHAIN" fmt --all --check

      - name: cargo fmt --check (fno)
        working-directory: crates/fno
        run: cargo "+$RUSTFMT_TOOLCHAIN" fmt --all --check

  test:
    name: cargo test + schema parity
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The PROTO_VERSION guard below needs a merge-base between the base
          # tip and the PR head; the default shallow fetch cannot compute one.
          fetch-depth: 0

      - name: PROTO_VERSION monotonic bump guard
        # Runs before the Rust build so a version collision fails in seconds
        # instead of after a full cargo test. PR_HEAD_SHA is load-bearing (this
        # checkout is the merge ref, which cannot show the PR's own bump); the
        # script header explains why and what this check does not close.
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.base_ref }}
        run: bash scripts/ci/check-proto-version-bump.sh

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry + build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/fno-agents/target
            crates/fno/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('crates/fno-agents/Cargo.lock', 'crates/fno/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Python (for flock_interop.rs cross-language test)
        # flock_interop.rs spawns a real python3 subprocess to verify that
        # Rust flock and Python fcntl.flock serialize correctly. ubuntu-latest
        # ships with Python 3 on PATH; this step ensures a known version and
        # installs the fno package so the parity check can also run.
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv + sync cli
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "latest"

      - name: Install fno Python package
        working-directory: cli
        run: uv sync

      - name: Install PyYAML for the bare python3 (verify_evidence_parity)
        # verify_evidence.rs shells to a bare-PATH `python3 -c "import yaml,..."`
        # for byte-parity with the deleted bash oracle. `uv sync` installs pyyaml
        # only into cli/.venv, which the cargo-test step does not activate, so the
        # resolved python3 lacks `yaml` and every valid fixture is falsely flagged
        # "settings.yaml unparseable". Install pyyaml onto the setup-python
        # interpreter (the one which_python3() resolves) so the parity check sees
        # the same parser its frozen goldens were captured with.
        run: python3 -m pip install "pyyaml>=6"

      - name: cargo test --lib --bins (fno-agents)
        working-directory: crates/fno-agents
        run: cargo test --lib --bins

      - name: cargo test --tests --test-threads=1 (fno-agents real-process integration)
        working-directory: crates/fno-agents
        run: >-
          cargo test
          --test active_backlog_drain
          --test agy_ask_unit
          --test claude_ask_dispatch
          --test claude_ask_parity
          --test claude_bg_create
          --test codex_ask_dispatch
          --test codex_ask_parity
          --test codex_ask_sigint
          --test codex_ask_unit
          --test daemon_e2e
          --test finalize_e2e
          --test flock_interop
          --test gemini_ask_sigint
          --test gemini_ask_unit
          --test generic_completion
          --test kill_criteria_parity
          --test loop_check
          --test loop_runtime
          --test loop_target
          --test loopcheck_decisions
          --test loopcheck_hook_payload
          --test loopcheck_missing_manifest
          --test opencode_serve_journey
          --test provider_contract
          --test review_coverage_paths
          --test review_coverage_verb
          --test run_outcome
          --test run_state
          --test spawn_routing
          --test verify_evidence_parity
          -- --test-threads=1

      - name: cargo test --lib --bins (fno mux)
        working-directory: crates/fno
        run: cargo test --lib --bins

      - name: cargo test --tests --test-threads=1 (fno mux real-process integration)
        # The mux e2e tests spawn real PTYs and Unix sockets; both work on
        # the ubuntu-latest runner (the harness needs no TTY of its own).
        working-directory: crates/fno
        run: >-
          cargo test
          --test agent_edge_e2e
          --test client_e2e
          --test idle_reaper_e2e
          --test keymap_e2e
          --test layout_e2e
          --test mouse_e2e
          --test multiclient_e2e
          --test mux_config_e2e
          --test persistence
          --test proto_socket
          --test script_api_e2e
          --test search_e2e
          --test server_spine
          --test squad_prune
          --test squad_prune_live_pane
          --test workspace_persistence_e2e
          -- --test-threads=1

      - name: Build fno-agents binary (for parity check)
        working-directory: crates/fno-agents
        # Force a fresh fno-agents build. This job's Cargo cache key is keyed
        # only on Cargo.lock, so a source-only KNOWN_EVENT_KINDS change (which
        # does not touch Cargo.lock) restores a stale target/ that cargo's mtime
        # fingerprint treats as fresh - serving an outdated --emit-schema to the
        # parity check below and reporting phantom kind drift. `clean -p` drops
        # only fno-agents' own artifacts; every dependency stays cached.
        run: |
          cargo clean -p fno-agents
          cargo build --bin fno-agents

      - name: Schema parity check
        # The parity script resolves the Rust binary via `command -v fno-agents`
        # FIRST, only then the fresh crates/fno-agents/target/debug build. If any
        # stale fno-agents shadows PATH, the freshly-built one is ignored and the
        # check reads an outdated --emit-schema (phantom kind drift). Prepend the
        # fresh build dir so `command -v` resolves it, and print a diagnostic of
        # the resolved binary + its emitted kind count for future triage.
        run: |
          export PATH="$PWD/crates/fno-agents/target/debug:$PATH"
          echo "parity-diag: resolved fno-agents = $(command -v fno-agents || echo NONE)"
          echo "parity-diag: emits newest kind (inside_leg_completed) = $(fno-agents --emit-schema 2>/dev/null | grep -c inside_leg_completed) (fresh=1, stale=0)"
          bash scripts/check-event-schema-parity.sh

      - name: Reviewer descriptor parity check
        # The reviewer table is declared in Python (config validator + init
        # capability refusal) and in Rust (the stop gate's blocked reason). A
        # Rust-only invocation edit never touches cli/**, so cli-ci's smoke
        # registry would not fire - this leg is what catches it. Pure text
        # extraction; no binary needed.
        run: bash scripts/ci/check-reviewer-descriptor-parity.sh

      - name: Review app login + marker parity check (x-0eaf)
        # The review-App login set is declared three times (Rust BOT_PROFILES,
        # Python _OPTIONAL_BOTS, Python _KNOWN_REVIEW_APP_LOGINS); the Rust
        # profiles also carry the usage_markers the refusal classifier reads.
        # A login on one side only is an App one path honors and another cannot
        # explain; a profile without an explicit usage_markers is an undecided
        # refusal shape (AC10 - "no marker matched" must never read as "did not
        # refuse"). Pure text extraction; no binary needed.
        run: bash scripts/ci/check-review-app-parity.sh

      - name: Registry schema parity check (ab-0baecaed)
        # Cross-language schema_version lockstep: catches a Rust-only bump of
        # REGISTRY_SCHEMA_VERSION that forgot the Python SCHEMA_VERSION side.
        # Pure text extraction; no binary needed (the build above is for the
        # event-schema check). cli-ci.yml runs the same check for Python-only
        # bumps and also runs the detector selftest.
        run: bash scripts/ci/check-registry-schema-parity.sh

      - name: Provider vocabulary parity check
        # Rust registry/claim writers and Python's resolver/claim reader share
        # one vocabulary. The detector harness proves drift fails before the
        # canonical sources are compared.
        run: |
          bash tests/ci/test_provider_vocabulary_parity.sh
          bash scripts/ci/check-provider-vocabulary-parity.sh

      - name: Session identity parity check
        # Installed-user birth writers must persist the canonical full session
        # identity before their rows become addressable across harnesses.
        run: |
          bash tests/ci/test_session_identity_parity.sh
          bash scripts/ci/check-session-identity-parity.sh
          bash tests/ci/test_spawn_lineage_parity.sh
          bash scripts/ci/check-spawn-lineage-parity.sh

  stress:
    name: rust e2e concurrency stress (20 trials)
    # The determinism claim this workflow's --test-threads=1 steps make is a
    # claim about REPEATED runs, so something has to repeat them. That used to
    # ride the cli-ci smoke shard, where the 20-trial default cost 756s of a
    # 1800s cap and killed the shard at 30 minutes. The denominator belongs
    # here instead: this workflow is path-triggered on crates/**, on
    # preflight.sh and on the harness itself, so the trials run exactly when
    # the thing they measure can have changed, and they run beside the other
    # jobs rather than serially inside someone else's budget.
    #
    # The cap is SET from measurement, not raised to absorb slack. Two
    # components: the trials, measured 2026-08-25 at a flat 35.9s each, so 20
    # of them are about 12 minutes; and a cold build of the three test
    # binaries, which the `test` job above shows costs the larger half of its
    # own 20-minute run. That is roughly 24 minutes on a cold cache, and 35
    # leaves room for a slow runner without leaving room for the suite to grow
    # unnoticed. If this job approaches the cap, cut trials or split the
    # binaries across two jobs; do not raise it.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # REPORTS, does not gate. Graduate by deleting this line, and only once the
    # comparison below says something.
    #
    # WHAT THIS HARNESS HAS AND HAS NOT SHOWN, measured 2026-08-25 on this
    # runner. Read this before citing a trial count as evidence of anything.
    #
    # Baseline, origin/main plus this harness and nothing else, 20 trials: ZERO
    # real test failures. Branch, 40 trials across two runs: two. One
    # `persistence`, one daemon_e2e `registry_list_refuses_over_a_broken_
    # registered_lane`, both genuine non-zero exits rather than a missing
    # marker. Two events against twenty trials of baseline separates nothing -
    # a zero in twenty is consistent with rates well above five percent - so
    # the honest reading is that this harness has NOT demonstrated the
    # serialization reduced flakiness. It has not shown the reverse either.
    #
    # The reason it cannot, yet: this harness runs three binaries in parallel
    # with `--test-threads=1` inside each, and the failures that motivated the
    # work came from `cargo test --all-targets`, which is far more parallel
    # than that. So the profile reproduced here is not the profile that broke.
    # Closing the question means reproducing THAT one.
    #
    # One thing it did settle cleanly. Its `daemons_left` counter reads
    # 2, 4, 6 ... 40 across the baseline's twenty trials, exactly two leaked
    # daemons per trial, and 0 on every trial of the branch. That reproduces
    # the ~40 orphans the original killed job cleaned up, and it is what the
    # reap fix closed.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry + build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/fno-agents/target
            crates/fno/target
          # A key of its OWN, deliberately. This job builds three test binaries
          # where the `test` job builds forty-six, and it finishes about seven
          # minutes earlier, so sharing a key means this small tree wins the
          # save race and the big job restores a cache missing most of its
          # artifacts. It still WARMS from the shared prefix via restore-keys.
          key: ${{ runner.os }}-cargo-stress-${{ hashFiles('crates/fno-agents/Cargo.lock', 'crates/fno/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-stress-
            ${{ runner.os }}-cargo-

      - name: Stress the process-backed e2e binaries
        # The exit code is not enough on its own. The script stands down with a
        # zero exit on a dirty tree (it cannot pin a sha), which is right where
        # it is auto-discovered by the local smoke suite and wrong here, where a
        # silent stand-down would publish a green job that ran no trials. So the
        # gate is the POSITIVE summary line, naming the trial count this job
        # exists to run. It reads STRESS_TRIALS, and 20 is already its default;
        # naming it here is what makes the contract greppable.
        env:
          STRESS_TRIALS: "20"
        run: |
          set -o pipefail
          bash scripts/tests/stress-rust-e2e-concurrency.sh | tee stress.log
          grep -q "^stress_summary trials=20 failures=0" stress.log

  audit:
    name: cargo audit (RUSTSEC advisories)
    # Scans Cargo.lock against the RustSec advisory DB. Vulnerabilities fail
    # the job; informational findings (unmaintained, yanked) warn but stay
    # green. Known expected warning: `serial` 0.4.0 (RUSTSEC-2017-0008) via
    # portable-pty 0.8 -- clears when the dep-refresh node ab-e784d8ff bumps
    # portable-pty to 0.9 (which swaps serial for the maintained serial2).
    # No cron trigger: advisories on untouched deps surface on the next
    # crates/** push, which is frequent enough here. Runs locally as
    # `cargo audit` from crates/fno-agents (cargo install cargo-audit).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install cargo-audit (prebuilt)
        # Prebuilt binary install; compiling cargo-audit from source costs
        # ~5 min of CI per run.
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit (fno-agents)
        working-directory: crates/fno-agents
        run: cargo audit

      - name: cargo audit (fno)
        working-directory: crates/fno
        run: cargo audit
