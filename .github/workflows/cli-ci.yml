name: idle hook latency research
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  idle-hooks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/build
            crates/fno-agents/target
            crates/fno/target
          key: ${{ runner.os }}-idle-hooks-release-${{ hashFiles('crates/fno-agents/Cargo.lock', 'crates/fno/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-idle-hooks-release-
            ${{ runner.os }}-cargo-
      - name: Install this checkout's Python CLI
        run: uv tool install ./cli --python 3.12
      - name: Build this head's release binaries sequentially
        run: |
          cargo build --locked --release --manifest-path crates/fno-agents/Cargo.toml --bin fno-agents
          cargo build --locked --release --manifest-path crates/fno/Cargo.toml --bin fno --example hook_latency_probe
          echo "${{ github.workspace }}/crates/fno/target/release" >> "$GITHUB_PATH"
          echo "${{ github.workspace }}/crates/fno-agents/target/release" >> "$GITHUB_PATH"
      - name: Record source and binary identities
        run: |
          mkdir -p hook-latency-results
          git rev-parse HEAD > hook-latency-results/source-sha.txt
          sha256sum crates/fno/target/release/fno crates/fno-agents/target/release/fno-agents hooks/target-stop-hook.sh hooks/king-delegation-guard.sh > hook-latency-results/sha256.txt
      - name: Measure idle hooks and verify behavior
        run: crates/fno/target/release/examples/hook_latency_probe "${{ github.workspace }}"
      - name: Upload raw timings and verification outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idle-hook-latency-${{ github.sha }}
          path: hook-latency-results/
          if-no-files-found: warn
