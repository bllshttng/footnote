name: cli-ci

# Cancel a PR's superseded runs on re-push so iterative pushes don't each run
# the full matrix (GitHub Actions minutes). Keyed by head_ref so PR re-pushes
# share a group; non-PR (push) events fall back to a unique run_id, so every
# main commit keeps its own run (a shared main group could drop an intermediate
# run - concurrency allows only one pending).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - cli/**
      - .claude-plugin/**
      - agents/**
      - skills/**
      - hooks/**
      - scripts/**
      - scripts/lib/events-validate.sh
      - scripts/lib/set-gate.sh
      - scripts/lib/paths.sh
      - scripts/ci/check-no-hardcoded-paths.sh
      - scripts/ci/check-placement-rule.sh
      - scripts/generate-skill-bundles.sh
      - scripts/lib/parse-bundle-manifest.py
      - scripts/lint/**
      - skill-bundles.yaml
      - tests/**
      - .github/workflows/cli-ci.yml
  pull_request:
    paths:
      - cli/**
      - .claude-plugin/**
      - agents/**
      - skills/**
      - hooks/**
      - scripts/**
      - scripts/lib/events-validate.sh
      - scripts/lib/set-gate.sh
      - scripts/lib/paths.sh
      - scripts/ci/check-no-hardcoded-paths.sh
      - scripts/ci/check-placement-rule.sh
      - scripts/generate-skill-bundles.sh
      - scripts/lib/parse-bundle-manifest.py
      - scripts/lint/**
      - skill-bundles.yaml
      - tests/**
      - .github/workflows/cli-ci.yml

jobs:
  real-codex-0145:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Codex 0.145
        run: npm install -g @openai/codex@0.145.0

      - name: Sync CLI
        working-directory: cli
        run: uv sync

      - name: Real Codex 0.145 plugin boundary
        env:
          FNO_REAL_CODEX_PLUGIN_TEST: "1"
        run: cli/.venv/bin/fno-py test -q cli/tests/integration/test_codex_plugin_real_boundary.py

  # Early, explicitly partial feedback. It runs BESIDE the canonical smoke job,
  # never in front of it: no `needs:` edge in either direction, so both start at
  # once and this one cannot add merge latency. Only `smoke` satisfies the merge
  # gate - a green here means the selected packet passed and nothing more.
  changed-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The selector diffs two explicit revisions, so both must be present;
          # the default shallow fetch cannot resolve the base and the packet
          # would report UNEVALUATED on every run.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install PyYAML for bundler + marketplace lint
        run: python3 -m pip install --upgrade pyyaml

      - name: Install stable Rust toolchain
        # A changed crate selects its Rust step family; without the toolchain
        # that would red as a missing prerequisite rather than a real failure.
        uses: dtolnay/rust-toolchain@stable

      - name: Changed packet (CHANGED SUBSET)
        env:
          CHANGED_BASE: ${{ github.event.pull_request.base.sha }}
          CHANGED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          uv run --project cli fno-py test smoke --changed \
            --base "$CHANGED_BASE" --head "$CHANGED_HEAD"
          rc=$?
          set -e
          # 20 = the selector mapped nothing. That is evidence about the
          # selector, not a coverage claim, and the full smoke job still gates -
          # so it is not a failure here. Every other code, including 21
          # (UNEVALUATED: no trustworthy diff), stays non-green.
          if [ "$rc" -eq 20 ]; then
            echo "changed packet mapped nothing to run; the full smoke job remains the gate"
            exit 0
          fi
          exit $rc

  smoke:
    runs-on: ubuntu-latest
    # 20 left no margin and cancelled green runs. Measured 2026-08-06: the test
    # step alone is 16m35s on a warm main run, and a branch with a cold uv/cargo
    # cache - the normal state for a new branch - runs ~19m and hit the cap with
    # every test passing. A cancelled job reports as `smoke fail`, so the tax was
    # paid as phantom red PRs and re-run cycles, not as a visible timeout.
    # Raise the ceiling rather than the suite: if this step approaches 30, the
    # suite is the thing to fix.
    #
    # 2026-08-21: it approached 30. The step measured 29m01s and the cap fired
    # one second later, cancelling a trailing 6s guard on a suite that had
    # already passed. That is 16m35s -> 29m01s in fifteen days. At a sub-minute
    # margin a re-run is a coin flip: the same commit went green and cancelled
    # on consecutive attempts, which reads as flake and is not one. Raised to 45
    # because cold cache is the normal state for a new branch.
    #
    # This raise is the unblock, NOT the fix - the line above already ruled on
    # that and x-5b73 owns it. The step below emits its own duration so the next
    # reading of this trend is a log line rather than API archaeology.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provision the smoke runner
        uses: ./.github/actions/smoke-setup

      - name: Smoke (test + lint registry)
        # The test/lint steps live in the code-owned `fno test smoke` runner
        # (cli/src/fno/test_cmd.py) so "run what CI runs" is one command and
        # local/CI parity is structural. Default (no flag) = fail-fast, the
        # pre-extraction semantics; ::group:: markers keep per-step folding in
        # the CI log. Bootstrapped via `uv run --project cli` (no repo-root
        # pyproject, no global fno-py in a fresh checkout); uv auto-syncs.
        # Emit the duration on every exit path (trap, not a trailing echo:
        # the runner's bash is -e, so a failing suite would skip a plain echo
        # and the slow runs - the only ones worth trending - would be the ones
        # that never reported). A hard timeout SIGKILLs the job and no trap
        # runs, which is itself the signal: no duration line means the cap ate
        # the run.
        run: |
          start=$SECONDS
          trap 'printf "smoke-duration-seconds=%s\n" "$(( SECONDS - start ))"' EXIT
          uv run --project cli fno-py test smoke

      # Static dead-import guard (x-ac5f): a module move down a layer can leave
      # test-only callers on the old `from fno.agents import moved` path that
      # fail at collection. changed-smoke selects tests from changed files and a
      # module move does not change the importing test, so the fast gate ran
      # green on exactly the broken files. This lint catches the whole class
      # independent of test selection (and faster than full collection).
      - name: Dead import paths (module-move guard)
        run: bash scripts/ci/check-import-paths.sh

  # TODO: graduate to blocking in the next release - remove continue-on-error
  prompt-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    # paths: cli/src/fno/review/prompts/**, agents/**
    # Job runs whenever those paths appear in the changeset (top-level trigger
    # already gates the whole workflow on cli/** and agents/**).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check prompt drift
        id: drift
        run: |
          bash cli/scripts/check-prompt-drift.sh && echo "drift=false" >> "$GITHUB_OUTPUT" || echo "drift=true" >> "$GITHUB_OUTPUT"

      - name: Note drift in summary
        if: steps.drift.outputs.drift == 'true'
        run: |
          echo "## Prompt Drift Detected" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "One or more bundled CLI agent prompts have drifted from their" >> "$GITHUB_STEP_SUMMARY"
          echo "canonical plugin agents. Run \`bash cli/scripts/check-prompt-drift.sh\`" >> "$GITHUB_STEP_SUMMARY"
          echo "locally to see the diff. This check is non-blocking for now." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          bash cli/scripts/check-prompt-drift.sh || true
