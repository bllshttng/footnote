name: cli-ci

# Cancel a PR's superseded runs on re-push so iterative pushes don't each run
# the full matrix (GitHub Actions minutes). Keyed by head_ref so PR re-pushes
# share a group; non-PR (push) events fall back to a unique run_id, so every
# main commit keeps its own run (a shared main group could drop an intermediate
# run - concurrency allows only one pending).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - cli/**
      - .claude-plugin/**
      - agents/**
      - skills/**
      - hooks/**
      - scripts/**
      - scripts/lib/events-validate.sh
      - scripts/lib/set-gate.sh
      - scripts/lib/paths.sh
      - scripts/ci/check-no-hardcoded-paths.sh
      - scripts/ci/check-placement-rule.sh
      - scripts/generate-skill-bundles.sh
      - scripts/lib/parse-bundle-manifest.py
      - scripts/lint/**
      - skill-bundles.yaml
      - tests/**
      - .github/workflows/cli-ci.yml
  pull_request:
    paths:
      - cli/**
      - .claude-plugin/**
      - agents/**
      - skills/**
      - hooks/**
      - scripts/**
      - scripts/lib/events-validate.sh
      - scripts/lib/set-gate.sh
      - scripts/lib/paths.sh
      - scripts/ci/check-no-hardcoded-paths.sh
      - scripts/ci/check-placement-rule.sh
      - scripts/generate-skill-bundles.sh
      - scripts/lib/parse-bundle-manifest.py
      - scripts/lint/**
      - skill-bundles.yaml
      - tests/**
      - .github/workflows/cli-ci.yml

jobs:
  real-codex-0145:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Codex 0.145
        run: npm install -g @openai/codex@0.145.0

      - name: Sync CLI
        working-directory: cli
        run: uv sync

      - name: Real Codex 0.145 plugin boundary
        env:
          FNO_REAL_CODEX_PLUGIN_TEST: "1"
        run: cli/.venv/bin/fno-py test -q cli/tests/integration/test_codex_plugin_real_boundary.py

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install PyYAML for bundler + marketplace lint
        # The skill-bundler parser opts into PyYAML when the manifest declares
        # references: or agents: blocks (nested shapes the stdlib fallback
        # parser can't handle). The marketplace-readiness lint similarly
        # imports yaml for frontmatter validation. Install at system level so
        # the freshness check + lint scripts (run outside the cli venv) can
        # import yaml from the same python3 that setup-python installed. This
        # stays in the yml (not the smoke runner): the runner only ASSERTS
        # python3-yaml and names it if missing, the CI/local install divergence
        # is deliberate (locally you install pyyaml once, by hand).
        run: python3 -m pip install --upgrade pyyaml

      - name: Install stable Rust toolchain (for journey tests)
        # Journey tests (e2e, emission-schema, backstop-subprocess) and the
        # claims compat matrix invoke the REAL fno-agents binary, which the
        # smoke runner builds mid-run. Provision the toolchain + cargo cache
        # here (CI-runner concern); the debug build itself lives in the runner
        # so local runs build it too.
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry + build artifacts (journey tests)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/fno-agents/target
          key: ${{ runner.os }}-cargo-journey-${{ hashFiles('crates/fno-agents/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-journey-

      - name: Smoke (test + lint registry)
        # The test/lint steps live in the code-owned `fno test smoke` runner
        # (cli/src/fno/test_cmd.py) so "run what CI runs" is one command and
        # local/CI parity is structural. Default (no flag) = fail-fast, the
        # pre-extraction semantics; ::group:: markers keep per-step folding in
        # the CI log. Bootstrapped via `uv run --project cli` (no repo-root
        # pyproject, no global fno-py in a fresh checkout); uv auto-syncs.
        run: uv run --project cli fno-py test smoke

  # TODO: graduate to blocking in the next release - remove continue-on-error
  prompt-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    # paths: cli/src/fno/review/prompts/**, agents/**
    # Job runs whenever those paths appear in the changeset (top-level trigger
    # already gates the whole workflow on cli/** and agents/**).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check prompt drift
        id: drift
        run: |
          bash cli/scripts/check-prompt-drift.sh && echo "drift=false" >> "$GITHUB_OUTPUT" || echo "drift=true" >> "$GITHUB_OUTPUT"

      - name: Note drift in summary
        if: steps.drift.outputs.drift == 'true'
        run: |
          echo "## Prompt Drift Detected" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "One or more bundled CLI agent prompts have drifted from their" >> "$GITHUB_STEP_SUMMARY"
          echo "canonical plugin agents. Run \`bash cli/scripts/check-prompt-drift.sh\`" >> "$GITHUB_STEP_SUMMARY"
          echo "locally to see the diff. This check is non-blocking for now." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          bash cli/scripts/check-prompt-drift.sh || true
