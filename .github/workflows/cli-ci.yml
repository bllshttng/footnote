name: cli-ci

# Cancel a PR's superseded runs on re-push so iterative pushes don't each run
# the full matrix (GitHub Actions minutes). Keyed by head_ref so PR re-pushes
# share a group; non-PR (push) events fall back to a unique run_id, so every
# main commit keeps its own run (a shared main group could drop an intermediate
# run - concurrency allows only one pending).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - cli/**
      - .claude-plugin/**
      - agents/**
      - skills/**
      - hooks/**
      - scripts/**
      - scripts/lib/events-validate.sh
      - scripts/lib/set-gate.sh
      - scripts/lib/paths.sh
      - scripts/ci/check-no-hardcoded-paths.sh
      - scripts/ci/check-placement-rule.sh
      - scripts/generate-skill-bundles.sh
      - scripts/lib/parse-bundle-manifest.py
      - scripts/lint/**
      - skill-bundles.yaml
      - tests/**
      - .github/workflows/cli-ci.yml
      - .github/workflows/guards.yml
      - .github/workflows/rust-ci.yml
  pull_request:
    paths:
      - cli/**
      - .claude-plugin/**
      - agents/**
      - skills/**
      - hooks/**
      - scripts/**
      - scripts/lib/events-validate.sh
      - scripts/lib/set-gate.sh
      - scripts/lib/paths.sh
      - scripts/ci/check-no-hardcoded-paths.sh
      - scripts/ci/check-placement-rule.sh
      - scripts/generate-skill-bundles.sh
      - scripts/lib/parse-bundle-manifest.py
      - scripts/lint/**
      - skill-bundles.yaml
      - tests/**
      - .github/workflows/cli-ci.yml
      - .github/workflows/guards.yml
      - .github/workflows/rust-ci.yml

jobs:
  real-codex-0145:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Codex 0.145
        run: npm install -g @openai/codex@0.145.0

      - name: Sync CLI
        working-directory: cli
        run: uv sync

      - name: Real Codex 0.145 plugin boundary
        env:
          FNO_REAL_CODEX_PLUGIN_TEST: "1"
        run: cli/.venv/bin/fno-py doctor test -q cli/tests/integration/test_codex_plugin_real_boundary.py

  # Sizes the changed-smoke ceiling from the packet the selector maps. The
  # packet scales with the diff, so a fixed cap either starves a large rebase
  # (killed at the cap, reported as an unattributable `cancelled`) or idles
  # over a small one. Selection only: `--list` maps and prints, it runs
  # nothing, so this job needs no smoke-setup and costs seconds. Two outputs:
  # the raw estimate (the run job's fit assertion compares against it) and the
  # ceiling actually applied, the estimate clamped at 45.
  changed-packet-size:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Estimate the packet
        id: estimate
        env:
          CHANGED_BASE: ${{ github.event.pull_request.base.sha }}
          CHANGED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          est="$(uv run --project cli fno-py doctor test smoke --changed \
            --base "$CHANGED_BASE" --head "$CHANGED_HEAD" --list 2>/dev/null \
            | sed -n 's/.*changed-estimate minutes=\([0-9][0-9]*\).*/\1/p' \
            | tail -1)"
          # No estimate line is a selector regression, not a small packet, so
          # it must not read as a ceiling of zero.
          if [ -z "$est" ]; then
            echo "no changed-estimate line in the selector output; refusing to size"
            exit 1
          fi
          echo "estimate_minutes=$est" >> "$GITHUB_OUTPUT"
          echo "timeout_minutes=$(( est > 45 ? 45 : est ))" >> "$GITHUB_OUTPUT"

    outputs:
      estimate_minutes: ${{ steps.estimate.outputs.estimate_minutes }}
      timeout_minutes: ${{ steps.estimate.outputs.timeout_minutes }}

  # Early, explicitly partial feedback. It runs BESIDE the canonical smoke job,
  # never in front of it: only `smoke` satisfies the merge gate - a green here
  # means the selected packet passed and nothing more. Its one needs edge is
  # the sizer above, which runs no tests; nothing can make this job delay the
  # gate. Coverage boundary: `smoke-pytest` and `smoke-rest` are the full-gate
  # shards on main and pull requests. `changed-smoke` is PR-only and is
  # skipped on main; its changed-subset selector never supplies main-branch
  # coverage.
  changed-smoke:
    if: github.event_name == 'pull_request'
    needs: [changed-packet-size]
    runs-on: ubuntu-latest
    # The ceiling is the packet-sized output of changed-packet-size, not a
    # fixed number (needs context is legal in timeout-minutes). GitHub does
    # not expose timeout-minutes to a step, so the same outputs are also this
    # job's env and the reporter's third argument; the guards assert the
    # spellings stay one value.
    timeout-minutes: ${{ fromJSON(needs.changed-packet-size.outputs.timeout_minutes) }}
    env:
      CAP_MINUTES: ${{ needs.changed-packet-size.outputs.timeout_minutes }}
      ESTIMATE_MINUTES: ${{ needs.changed-packet-size.outputs.estimate_minutes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The selector diffs two explicit revisions, so both must be present;
          # the default shallow fetch cannot resolve the base and the packet
          # would report UNEVALUATED on every run.
          fetch-depth: 0

      - name: Provision the smoke runner
        # The SAME provisioning the full shards get, for the reason the action
        # itself documents: this job began as a hand-copied subset and the copy
        # was missing the Rust front. Without FNO_AGENTS_FRONT the graph-store
        # keeper cannot spawn, read_graph raises, and the merge-guard read
        # swallows it and answers None - so any packet selecting a
        # keeper-dependent test file reds for a setup reason, not a real one.
        uses: ./.github/actions/smoke-setup

      - name: Changed packet (CHANGED SUBSET)
        env:
          CHANGED_BASE: ${{ github.event.pull_request.base.sha }}
          CHANGED_HEAD: ${{ github.event.pull_request.head.sha }}
          # The full stress contract remains 20 trials. The changed packet is
          # partial evidence under a cap sized from the packet itself; one
          # trial proves the shell harness and the full rust-ci job owns the
          # denominator.
          STRESS_TRIALS: "1"
        run: |
          date +%s > "$RUNNER_TEMP/changed-start"
          start=$SECONDS
          trap 'bash scripts/ci/smoke-duration-report.sh changed-smoke "$(( SECONDS - start ))" "$CAP_MINUTES" || true; touch "$RUNNER_TEMP/smoke-duration-reported"' EXIT
          # The estimate is raw (unclamped). A packet that cannot fit the
          # ceiling fails THIS assertion, naming both numbers, instead of
          # running until the cap kills it and the run reports cancelled.
          if [ -z "$ESTIMATE_MINUTES" ] || [ "$ESTIMATE_MINUTES" -gt "$CAP_MINUTES" ]; then
            echo "ASSERTION: the changed packet estimates ${ESTIMATE_MINUTES:-unknown}m, which cannot fit its ${CAP_MINUTES}m ceiling. Split the work; do not raise the cap."
            exit 1
          fi
          set +e
          uv run --project cli fno-py doctor test smoke --changed \
            --base "$CHANGED_BASE" --head "$CHANGED_HEAD"
          rc=$?
          set -e
          # 20 = the selector mapped nothing. That is evidence about the
          # selector, not a coverage claim, and the full smoke job still gates -
          # so it is not a failure here. Every other code, including 21
          # (UNEVALUATED: no trustworthy diff), stays non-green.
          if [ "$rc" -eq 20 ]; then
            echo "changed packet mapped nothing to run; the full smoke job remains the gate"
            exit 0
          fi
          exit $rc

      - name: Timeout receipt (the receipt a cap kill cannot print)
        # timeout-minutes SIGKILLs the job and the EXIT trap never runs, so an
        # absent marker means exactly that the cap ate the run. This step then
        # reports elapsed against the cap itself: the receipt that says
        # TIMEOUT and names the cap, instead of leaving the reader with a bare
        # `cancelled` and no actor.
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/smoke-duration-reported" ]; then
            exit 0
          fi
          if [ ! -f "$RUNNER_TEMP/changed-start" ]; then
            exit 0
          fi
          elapsed=$(( $(date +%s) - $(cat "$RUNNER_TEMP/changed-start") ))
          if [ "$elapsed" -lt 0 ]; then
            # A clock stepped backward mid-job. The honest floor for a job
            # that reached this step without its trap is the cap itself:
            # reaching this step unmarked is the cap kill's signature.
            elapsed=$(( CAP_MINUTES * 60 ))
          fi
          bash scripts/ci/smoke-duration-report.sh changed-smoke "$elapsed" "$CAP_MINUTES" || true

  # The suite outgrew two runners, so the pytest full-gate lane now runs as
  # eight matrix shards and the rest lane as four. Read this before
  # raising a ceiling again.
  #
  # History: 20 left no margin and cancelled green runs. Measured 2026-08-06,
  # the test step alone was 995s on a warm main run and about 1140s on the cold
  # uv/cargo cache that is the normal state for a new branch, which hit the cap
  # with every test passing. Raised to 30. On 2026-08-21 it hit 30 too, and the
  # comment then standing said that at 30 the suite is the thing to fix. It was
  # raised to 45 anyway, as an unblock for a stalled fleet, on the condition
  # that the suite got fixed. This is that fix. Eight pytest legs and four rest
  # legs bring the measured work below the 15-minute cap instead of raising the
  # ceiling again.
  #
  # What was measured, so the next reader can re-measure rather than guess. One
  # main-push job ran 2095 seconds: 64s of runner setup, 1036s in the single
  # pytest step, and 995s in every step after it. Pytest already runs with
  # `-n auto --maxprocesses=4` and this runner has 4 vCPU, so it was not short
  # of workers. The 995s tail was simply serial behind it on the same machine.
  # Splitting at that boundary gives two near-even halves and roughly halves
  # wall clock, and 1036 against 995 is why the seam is here and not elsewhere.
  #
  # The seam is also the only clean cut in the registry. `fno doctor test smoke`
  # deletes the fno-agents debug binary when pytest is selected, so the
  # @requires_rust parity tests skip; a later step rebuilds it for the rust
  # journey steps. The runner keeps pytest in every pytest matrix leg and adds
  # the build step to every rest leg whose bin contains a later rust step.
  #
  # The two selections below must keep COVERING the registry. They are exact
  # complements over one glob, so a step added later lands in smoke-rest on its
  # own, and cli/tests/unit/test_smoke_shards.py fails if that ever stops being
  # true. `Sync + build` deliberately runs in every leg: it costs about 3s and
  # removes any question of whether pytest can rely on `uv build`.
  #
  # The last four-way pytest run reached only 38%, 42%, 39% and 54% before its
  # 15-minute cap. The pytest lane therefore doubles; the rest lane stays at
  # four because its measured legs already finish below the cap.
  # If a shard approaches 15, split again or cut work. Do not raise this.
  smoke-pytest:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    # The latest two-leg main run measured 27m35s for pytest. Four matrix legs
    # are the planned remedy, and each leg remains capped at 15 minutes.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provision the smoke runner
        uses: ./.github/actions/smoke-setup

      - name: "Smoke shard: pytest (${{ matrix.shard }}/8)"
        # This shard throws away the fno-agents binary smoke-setup
        # just built (the runner clears it so @requires_rust tests skip) and
        # never rebuilds it, because the build step lives in the other shard.
        # Both shards share one cargo cache key, so on a Cargo.lock change this
        # shard can win the save race and store a target dir with fingerprints
        # but no binary. Cargo relinks, so the ceiling is seconds of rebuild,
        # never a wrong result. Upgrade path if it ever shows up in the
        # numbers: give smoke-setup a flag to skip the fno-agents build, and
        # pass it here.
        #
        # The test/lint steps live in the code-owned `fno doctor test smoke`
        # runner (cli/src/fno/test_cmd.py) so "run what CI runs" is one command
        # and local/CI parity is structural. A bare `fno doctor test smoke` with
        # no selector still runs every step; the shards are a CI concern only.
        #
        # Emit the duration on every exit path (trap, not a trailing echo: the
        # runner's bash is -e, so a failing suite would skip a plain echo and
        # the slow runs - the only ones worth trending - would be the ones that
        # never reported). A hard timeout SIGKILLs the job and no trap runs,
        # which is itself the signal: no duration line means the cap ate the
        # run. The key names the shard so two numbers are never read as one.
        #
        # The reporter READS that number rather than only printing it, warning
        # at 80% of the cap so the next approach is visible before it is fatal.
        # `|| true` is load-bearing: a failing suite must stay red and a missing
        # script must not break the step. The cap is passed explicitly because
        # GitHub does not expose timeout-minutes to a step, so it is duplicated
        # from the job above; tests/ci/test_smoke_duration_report.sh asserts the
        # two agree, because a raise applied to only one would move the warning
        # away from the real ceiling.
        run: |
          start=$SECONDS
          trap 'bash scripts/ci/smoke-duration-report.sh smoke-pytest-${{ matrix.shard }} "$(( SECONDS - start ))" 15 || true' EXIT
          uv run --project cli fno-py doctor test smoke --only 'Sync + build,Pytest*' --shard ${{ matrix.shard }}/8

  smoke-rest:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provision the smoke runner
        uses: ./.github/actions/smoke-setup

      - name: "Smoke shard: everything except pytest (${{ matrix.shard }}/4)"
        # Same trap, same reason as the pytest shard above.
        #
        # Measured on the 1750s run that hit the cap, not guessed: of 1733s of
        # reported step time, the stress harness alone was 756s. It builds the
        # three test binaries once (38s) and then costs a flat 35.9s per trial,
        # so 20 trials is 718s of the shard on their own. Three trials is 146s,
        # which still left the then-unsharded shard near 1120s; the four legs
        # below are what bring it under the cap.
        #
        # The 20-trial contract did not move to a smaller number, it moved to
        # rust-ci's `stress` job, which is path-triggered on the crates and on
        # the harness itself. A local `fno doctor test smoke` still defaults to
        # 20, because the script's default is what a developer gets.
        env:
          STRESS_TRIALS: "3"
        run: |
          start=$SECONDS
          trap 'bash scripts/ci/smoke-duration-report.sh smoke-rest-${{ matrix.shard }} "$(( SECONDS - start ))" 15 || true' EXIT
          uv run --project cli fno-py doctor test smoke --skip 'Pytest*' --shard ${{ matrix.shard }}/4

      # Static dead-import guard: a module move down a layer can leave
      # test-only callers on the old `from fno.agents import moved` path that
      # fail at collection. changed-smoke selects tests from changed files and a
      # module move does not change the importing test, so the fast gate ran
      # green on exactly the broken files. This lint catches the whole class
      # independent of test selection (and faster than full collection).
      - name: Dead import paths (module-move guard)
        run: bash scripts/ci/check-import-paths.sh

      # Positive probe over the checked-in graduation registry. Every decision
      # in REGISTERED_GRADUATION_PROBES claims a shipped enforcement artifact;
      # this re-measures that claim, so deleting the enforcement a retired
      # ruling rests on turns red here instead of silently un-retiring it.
      - name: Decision graduation probes
        run: uv run --project cli python scripts/ci/check-decision-graduation.py

  # Keeps the required check named `smoke`. Branch protection and the review
  # gate key on that exact name, so publishing only `smoke-pytest` and
  # `smoke-rest` would make the required check stop appearing rather than fail
  # loudly.
  #
  # The condition is load-bearing in BOTH directions and `always()` is wrong.
  # Omit it and GitHub skips this job when a shard fails, and a skipped
  # required check is not a red one. Use `always()` and this job also runs
  # after a CANCELLED run - `cancel-in-progress` is on at the top of this file,
  # so every superseding push cancels its predecessor - where it reads
  # `result: cancelled` for both shards and exits 1. That publishes a FAILED
  # `smoke` for a run nobody let finish, which is the phantom red the history
  # above is about. `!cancelled()` gives the same protection: a failed shard
  # does not make the run cancelled, so the gate still runs and still blocks.
  #
  # The assertion is positive per shard, because `cancelled` and `skipped` are
  # neither success nor failure and both must block.
  smoke:
    needs: [smoke-pytest, smoke-rest]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Two string compares. A cap this tight is a real alarm on a job that can
    # only ever hang, and this whole change exists because a job outran its
    # cap unnoticed; the required check itself must not be the one job with no
    # cap at all.
    timeout-minutes: 5
    steps:
      - name: Both shards passed
        run: |
          # A lone `cancelled` here is that shard's OWN cap, never a superseding
          # push: a cancelled run skips this gate entirely (`!cancelled()`
          # above). Say so, because the cap kills the shard before its EXIT trap
          # runs, so the missing smoke-duration line is an ABSENCE - and that
          # absence was read as three failing assertions, which filed a green
          # suite as three broken registries.
          capped() {
            [ "$2" = "cancelled" ] || return 0
            echo "$1 outran its own timeout-minutes cap; the run was never cancelled."
            echo "Its shard step prints no smoke-duration line when the cap kills it."
          }
          echo "smoke-pytest=${{ needs.smoke-pytest.result }} smoke-rest=${{ needs.smoke-rest.result }}"
          capped smoke-pytest "${{ needs.smoke-pytest.result }}"
          capped smoke-rest "${{ needs.smoke-rest.result }}"
          [ "${{ needs.smoke-pytest.result }}" = "success" ] || exit 1
          [ "${{ needs.smoke-rest.result }}" = "success" ] || exit 1

  # TODO: graduate to blocking in the next release - remove continue-on-error
  prompt-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    # paths: cli/src/fno/review/prompts/**, agents/**
    # Job runs whenever those paths appear in the changeset (top-level trigger
    # already gates the whole workflow on cli/** and agents/**).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check prompt drift
        id: drift
        run: |
          bash cli/scripts/check-prompt-drift.sh && echo "drift=false" >> "$GITHUB_OUTPUT" || echo "drift=true" >> "$GITHUB_OUTPUT"

      - name: Note drift in summary
        if: steps.drift.outputs.drift == 'true'
        run: |
          echo "## Prompt Drift Detected" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "One or more bundled CLI agent prompts have drifted from their" >> "$GITHUB_STEP_SUMMARY"
          echo "canonical plugin agents. Run \`bash cli/scripts/check-prompt-drift.sh\`" >> "$GITHUB_STEP_SUMMARY"
          echo "locally to see the diff. This check is non-blocking for now." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          bash cli/scripts/check-prompt-drift.sh || true
