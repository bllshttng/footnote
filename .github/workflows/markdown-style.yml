name: markdown-style

# ADDED lines only under docs/, skills/, agents/ must pass the five style rules.
# A whole-file gate is unlandable while existing prose breaks the rules; the
# added-lines ratchet lets the trees converge without a flag-day rewrite. The
# gate is fail-loud: a touched gated tree with zero inspected lines fails too,
# since "no violations" and "the checker never ran" share an exit code.

on:
  pull_request:
    paths:
      - docs/**
      - skills/**
      - agents/**
      - cli/src/fno/style.py
      - scripts/ci/check-markdown-style.sh
      - .github/workflows/markdown-style.yml
  push:
    branches: [main]
    paths:
      - docs/**
      - skills/**
      - agents/**

concurrency:
  group: markdown-style-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-markdown-style:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Markdown style (added lines)
        run: bash scripts/ci/check-markdown-style.sh origin/main
