# Install-channel matrix: every advertised install path installs footnote on a
# clean runner and runs one shared smoke. Rows the product does not satisfy
# yet carry expect: fail and name the node whose work flips them; when such a
# row starts passing, its job FAILS and names the flip, so every repair PR
# turns its own row. Runs daily, on every workflow_dispatch, and on any PR
# that touches an install surface (no branches filter, so stacked PRs run it).
name: install-channels

on:
  pull_request:
    paths:
      - 'scripts/install/**'
      - '.claude-plugin/**'
      - '.codex-plugin/**'
      - '.agents/plugins/**'
      - 'hooks/context-run.sh'
      - 'hooks/frontdoor-nudge-session-start.sh'
      - 'hooks/frontdoor-nudge-prompt-submit.sh'
      - 'hooks/hooks.json'
      - 'hooks/context-hooks.json'
      - 'hooks/codex-hooks.json'
      - 'scripts/setup.sh'
      - 'scripts/preflight.sh'
      - 'skills/tdd/SKILL.md'
      - 'README.md'
      - '.github/workflows/install-channels.yml'
      - 'cli/tests/smoke/channel_matrix_smoke.sh'
      - 'scripts/ci/check-readme-install-commands.sh'
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  channel:
    runs-on: ${{ matrix.row.runs-on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        row:
          - id: claude-marketplace
            runs-on: ubuntu-latest
            expect: pass
            node: ''
            readme: ['/plugin marketplace add bllshttng/footnote', '/plugin install fno@footnote']
          - id: claude-plugin-session
            runs-on: ubuntu-latest
            expect: pass
            node: ''
            readme: []
          - id: claude-plugin-session-macos
            runs-on: macos-14
            expect: pass
            node: ''
            readme: []
          - id: codex-plugin-session
            runs-on: ubuntu-latest
            expect: pass
            node: ''
            readme: ['codex plugin marketplace add bllshttng/footnote', 'codex plugin add fno@footnote']
          - id: fno-sh-served
            runs-on: ubuntu-latest
            expect: pass
            node: ''
            readme: ['curl -fsSL fno.sh | sh']
          - id: fno-sh-served-macos
            runs-on: macos-14
            expect: pass
            node: ''
            readme: ['curl -fsSL fno.sh | sh']
          - id: fno-sh-head
            runs-on: ubuntu-latest
            expect: pass
            node: ''
            readme: []
          - id: fno-sh-head-macos
            runs-on: macos-14
            expect: pass
            node: ''
            readme: []
          - id: fno-sh-nightly
            runs-on: ubuntu-latest
            expect: pass
            node: x-6f1d
            readme: []
          - id: fno-sh-fresh
            runs-on: ubuntu-latest
            expect: fail
            node: x-f867
            readme: []
          - id: install-sh-alias
            runs-on: ubuntu-latest
            expect: pass
            node: ''
            readme: []
          - id: pypi-uv
            runs-on: ubuntu-latest
            expect: pass
            node: ''
            readme: ['uv tool install fno']
          - id: pypi-uv-pinned
            runs-on: ubuntu-latest
            expect: pass
            node: ''
            readme: []
          - id: brew
            runs-on: macos-14
            expect: fail
            node: ''
            readme: ['brew install bllshttng/fno/fno']
          - id: cargo
            runs-on: ubuntu-latest
            expect: pass
            node: ''
            readme: ['cargo install fno']
          - id: skills-sh
            runs-on: ubuntu-latest
            expect: pass
            node: ''
            readme: ['npx skills add bllshttng/footnote --skill tdd']
          - id: clone-setup
            runs-on: ubuntu-latest
            expect: pass
            node: ''
            readme: ['bash scripts/setup.sh']
          - id: readme-commands
            runs-on: ubuntu-latest
            expect: pass
            node: ''
            readme: []
    steps:
      - uses: actions/checkout@v4

      - name: 'row: ${{ matrix.row.id }}'
        shell: bash
        run: |
          set -uo pipefail
          set +e
          bash cli/tests/smoke/channel_matrix_smoke.sh '${{ matrix.row.id }}'
          rc=$?
          set -e
          expect='${{ matrix.row.expect }}'
          if [ "$rc" -eq 42 ] || [ "$rc" -eq 3 ] || [ "$rc" -eq 43 ]; then
            echo "row ${{ matrix.row.id }}: driver refused the run (rc=$rc: dirty machine, unknown row, or a hang); the job fails regardless of the row's expectation"
            exit 1
          fi
          if [ "$expect" = pass ]; then
            if [ "$rc" -eq 0 ]; then
              exit 0
            fi
            echo "row ${{ matrix.row.id }} is expected to pass but failed (rc=$rc)"
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "expected-fail ${{ matrix.row.id }}: ${{ matrix.row.node }}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "row ${{ matrix.row.id }} now passes: set expect: pass in this PR"
          exit 1
