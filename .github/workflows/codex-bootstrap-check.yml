name: Codex Bootstrap Check

# Cancel a PR's superseded runs on re-push (Actions minute conservation). Keyed by head_ref so PR re-pushes share a
# group; non-PR events use a unique run_id, so every main commit keeps its own
# run.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  codex-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup prerequisites
        # jq ships on ubuntu-latest; apt runs only as an image-drift fallback.
        # The unconditional `apt-get update` once stalled 15 minutes on an
        # unreachable azure.archive.ubuntu.com mirror and took the job down at
        # its own timeout with zero assertions run (PR 933's red codex-bootstrap
        # was exactly that), so the common path never touches apt at all.
        run: |
          command -v jq >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y jq; }
          jq --version

      - name: Run Codex setup (no package setup)
        run: |
          bash scripts/setup.sh --provider codex --skip-package-setup

      - name: Run doctor checks
        run: |
          bash scripts/doctor.sh
