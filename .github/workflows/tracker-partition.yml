name: tracker-partition

# check-tracker-partition.sh enforces the zero-overlap rule between the
# footnote-owned sidecar and the tracker read interface. A field named on both
# (other than the id key) is the two-sources-of-truth bug the
# bring-your-own-id design exists to prevent. Runs on every push and pull
# request with no paths filter: the guard scans the two model files, and a
# paths filter would let a mirror of `title` into the sidecar land green.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tracker-partition-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-tracker-partition:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tracker partition gate + self-test
        run: |
          bash scripts/ci/check-tracker-partition.sh --self-test
          bash scripts/ci/check-tracker-partition.sh
